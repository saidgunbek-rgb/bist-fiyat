          def rsi(c, n=14):
              if len(c) <= n:
                  return None
              ar = [c[i] - c[i - 1] for i in range(1, len(c))]
              g = sum(max(x, 0) for x in ar[:n]) / n
              l = sum(max(-x, 0) for x in ar[:n]) / n
              for x in ar[n:]:
                  g = (g * (n - 1) + max(x, 0)) / n
                  l = (l * (n - 1) + max(-x, 0)) / n
              return 100.0 if l == 0 else 100 - 100 / (1 + g / l)

