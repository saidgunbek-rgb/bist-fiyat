# Hisse kutuphanesi (BIST30'dan secilen hisseler): her aksam fiyat, karne, seviyeler, bilanco ve KAP verisini kutuphane.json dosyasina yazar.
# Portfoyundeki hisselerin dosyalarina (karne.json, prices.json) dokunmaz, onlarin calismalarini bekletmez. Telefon bildirimi gondermez.
# Kutuphaneye hisse eklemek/cikarmak icin asagidaki KUTUPHANE satirini degistir (KOD=Sirket adi=Sektor, virgulle ayir).
name: Hisse kutuphanesi

on:
  schedule:
    - cron: "3 18 * * 1-5"    # hafta ici 21:03 (Turkiye saati), portfoy calismalarindan sonra
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kutuphane
  cancel-in-progress: false

jobs:
  kutuphane:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KUTUPHANE: "THYAO=Türk Hava Yolları=Havayolu,AKBNK=Akbank=Banka,MGROS=Migros=Perakende,BIMAS=BİM Birleşik Mağazalar=Perakende,TCELL=Turkcell=İletişim,YKBNK=Yapı ve Kredi Bankası=Banka,GARAN=Garanti BBVA=Banka,ASELS=Aselsan=Savunma,FROTO=Ford Otosan=Otomotiv,KCHOL=Koç Holding=Holding"
      KARNE: "THYAO,AKBNK,MGROS,BIMAS,TCELL,YKBNK,GARAN,ASELS,FROTO,KCHOL"
      VADE: "THYAO=uzun,AKBNK=uzun,MGROS=uzun,BIMAS=uzun,TCELL=uzun,YKBNK=uzun,GARAN=uzun,ASELS=uzun,FROTO=uzun,KCHOL=uzun"
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli paketler
        continue-on-error: true
        run: pip install borsapy pypdf 2>&1 | tail -1

      - name: Kutuphane dosyalarini hazirla
        run: |
          # Ayni hesap kodlari kullanilir; portfoy dosyalari gecici olarak kenara alinir, sonda geri konur
          cp karne.json /tmp/karne_portfoy.json
          cp kontrol-kaydi.json /tmp/kontrol_portfoy.json 2>/dev/null || true
          if [ -f kutuphane.json ]; then cp kutuphane.json karne.json; else echo '{"stocks":{}}' > karne.json; fi
          if [ -f kutuphane-kontrol.json ]; then cp kutuphane-kontrol.json kontrol-kaydi.json; else echo '{}' > kontrol-kaydi.json; fi

      - name: Karne verisini al
        run: |
          python3 - <<'PY'
          import json, os, sys, datetime, time, urllib.request, urllib.error, http.cookiejar

          kodlar = [k.strip().upper() for k in os.environ["KARNE"].split(",") if k.strip()]
          UA = {"User-Agent": "Mozilla/5.0"}
          bugun = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=3)).strftime("%Y-%m-%d")

          # Onceki basarili veri (hicbir kaynak calismazsa panel bos kalmasin diye)
          try:
              _k = json.load(open("karne.json"))
              onceki, onceki_gun = _k.get("stocks", {}), _k.get("updated")
              kap_zaman = _k.get("kapUpdatedAt")
              enf_onceki = _k.get("enf")
              # kap.yml'nin yazdigi bildirim kayitlari korunur (silinirse bildirimler sifirlanir)
              ust_alanlar = {x: _k[x] for x in ("bildirimler", "bildirim_durum") if x in _k}
          except Exception:
              ust_alanlar = {}
              onceki, onceki_gun = {}, None
              kap_zaman = None
              enf_onceki = None

          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def ac(url):
              return op.open(urllib.request.Request(url, headers=UA), timeout=30).read().decode()
          crumb = ""
          try:
              try:
                  ac("https://fc.yahoo.com")
              except urllib.error.HTTPError:
                  pass
              crumb = ac("https://query1.finance.yahoo.com/v1/test/getcrumb")
          except Exception as e:
              print("Yahoo crumb HATA:", e)

          def sayi(x):
              if isinstance(x, dict):
                  x = x.get("raw")
              try:
                  x = float(x)
              except Exception:
                  return None
              return x if x == x else None

          # ---- Kaynak: Yahoo ozet (piyasa degeri, temettu verimi)
          def yahoo_ozet(kod):
              try:
                  u = ("https://query1.finance.yahoo.com/v10/finance/quoteSummary/%s.IS"
                       "?modules=summaryDetail&crumb=%s") % (kod, crumb)
                  return json.loads(ac(u))["quoteSummary"]["result"][0]["summaryDetail"]
              except Exception as e:
                  print("Yahoo ozet HATA", kod, e)
                  return {}

          # ---- Kaynak: Yahoo grafik (fiyat + son 12 ay temettuleri, TL bazli)
          def yahoo_grafik(kod):
              try:
                  u = "https://query1.finance.yahoo.com/v8/finance/chart/%s.IS?range=1y&interval=1d&events=div" % kod
                  r = json.loads(ac(u))["chart"]["result"][0]
                  fiyat = sayi(r["meta"].get("regularMarketPrice"))
                  tem = 0.0
                  esik = time.time() - 365 * 86400
                  for v in ((r.get("events") or {}).get("dividends") or {}).values():
                      if v.get("date", 0) >= esik:
                          tem += sayi(v.get("amount")) or 0
                  return fiyat, tem
              except Exception as e:
                  print("Yahoo grafik HATA", kod, e)
                  return None, None

          # ---- Kaynak: repodaki fiyat dosyasi (fiyat.yml her aksam yazar)
          def fiyat_dosyasi(kod):
              try:
                  d = json.load(open("prices.json"))
                  gunler = d.get("days", {})
                  for g in sorted(gunler, reverse=True):
                      v = sayi((gunler[g] or {}).get(kod))
                      if v:
                          return v
              except Exception as e:
                  print("prices.json HATA", kod, e)
              return None

          # ---- Kaynak: Is Yatirim bilanco (F/K = piyasa degeri / son 12 ay net kar, PD/DD = piyasa degeri / ozkaynak)
          def maliyet(kod, grup, y, p):
              u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/MaliTablo"
                   "?companyCode=%s&exchange=TRY&financialGroup=%s&year1=%d&period1=%d&year2=%d&period2=12"
                   "&year3=%d&period3=%d&year4=%d&period4=12&_=%d") % (kod, grup, y, p, y-1, y-1, p, y-2, int(time.time()*1000))
              j = json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40))
              d = {}
              for x in (j.get("value") or []):
                  if x.get("itemCode") in ("3Z", "2O"):
                      d[x["itemCode"]] = [sayi(x.get("value%d" % i)) for i in (1, 2, 3, 4)]
              return d

          def bilanco(kod, mc):
              if not mc:
                  return None
              now = datetime.datetime.now()
              adaylar = []
              for y in (now.year, now.year - 1):
                  for p in (12, 9, 6, 3):
                      if (y, p) <= (now.year, (now.month - 2) // 3 * 3):
                          adaylar.append((y, p))
              for grup in ("XI_29", "UFRS"):
                  for (y, p) in adaylar[:4]:
                      try:
                          d = maliyet(kod, grup, y, p)
                      except Exception as e:
                          print("Bilanco HATA", kod, grup, y, p, e)
                          break
                      ni, eq = d.get("3Z"), d.get("2O")
                      if not ni or not eq or not ni[0] or not eq[0]:
                          continue
                      if p == 12:
                          ltm = ni[0]
                      elif ni[1] is not None and ni[2] is not None:
                          ltm = ni[1] + ni[0] - ni[2]
                      else:
                          continue
                      # Uzun vade icin: gecen yilin ayni donemine gore kar buyumesi ve ozkaynak karliligi
                      if p == 12:
                          kb = (ni[0] / ni[1] - 1) * 100 if ni[1] and ni[1] > 0 else None
                      else:
                          kb = (ni[0] / ni[2] - 1) * 100 if ni[2] and ni[2] > 0 else None
                      roe = ltm / eq[0] * 100 if eq[0] > 0 else None
                      return (mc / ltm if ltm > 0 else None, mc / eq[0] if eq[0] > 0 else None, "%d/%d" % (y, p), kb, roe,
                              {"ltm": ltm, "eq": eq[0], "grup": grup, "y": y, "p": p})
              return None

          # ---- Kaynak: Is Yatirim fiyat servisi (borsa kapanisi + piyasa degeri, TL)
          def is_fiyat(kod):
              try:
                  t = time.time()
                  d2 = time.strftime("%d-%m-%Y", time.gmtime(t)); d1 = time.strftime("%d-%m-%Y", time.gmtime(t - 10 * 86400))
                  u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/HisseTekil"
                       "?hisse=%s&startdate=%s&enddate=%s") % (kod, d1, d2)
                  v = (json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30)).get("value") or [])
                  for x in reversed(v):
                      p, pd = sayi(x.get("HGDG_KAPANIS")), sayi(x.get("PD"))
                      if p:
                          return p, pd
              except Exception as e:
                  print("IsYatirim fiyat HATA", kod, e)
              return None, None

          # ---- Kaynak: TradingView tarayici (fiyat, piyasa degeri, temettu verimi)
          def tv_hepsi(kodlar):
              out = {}
              try:
                  body = json.dumps({"symbols": {"tickers": ["BIST:" + k for k in kodlar]},
                                     "columns": ["close", "market_cap_basic", "dividends_yield", "price_earnings_ttm", "price_book_fq"]}).encode()
                  r = urllib.request.Request("https://scanner.tradingview.com/turkey/scan", data=body,
                          headers=dict(UA, **{"Content-Type": "application/json"}))
                  for row in json.load(urllib.request.urlopen(r, timeout=30)).get("data", []):
                      k = row["s"].split(":")[1]
                      c, m, d, fk, pdd = (list(row["d"]) + [None] * 5)[:5]
                      out[k] = {"price": sayi(c), "mc": sayi(m), "dy": sayi(d), "pe": sayi(fk), "pb": sayi(pdd)}
              except Exception as e:
                  print("TradingView HATA", e)
              return out

          def secim(degerler, tolerans):
              """Kaynak listesi (oncelik sirasiyla). 3+ kaynakta medyan, yoksa ilk deger; None'lar atlanir."""
              v = [x for x in degerler if x]
              if not v:
                  return None
              if len(v) >= 3:
                  v2 = sorted(v)
                  return v2[len(v2) // 2]
              return v[0]

          import borsapy as bp
          hisseler, hata = {}, []
          tv = tv_hepsi(kodlar)
          for kod in kodlar:
              o = onceki.get(kod) or {}
              h = {"pe": None, "pb": None, "dy": None, "price": None, "mc": None}
              bfiyat = bmc = bpe = bpb = None
              try:
                  fi = bp.Ticker(kod).fast_info
                  fi = dict(fi) if hasattr(fi, "keys") else {}
                  bfiyat, bmc = sayi(fi.get("last_price")), sayi(fi.get("market_cap"))
                  bpe, bpb = sayi(fi.get("pe_ratio")), sayi(fi.get("pb_ratio"))
              except Exception as e:
                  hata.append(kod)
                  print("borsapy HATA", kod, e)
              ifiyat, imc = is_fiyat(kod)
              yo = yahoo_ozet(kod)
              yf, ytem = yahoo_grafik(kod)
              t = tv.get(kod) or {}
              carry = []
              # fiyat: Is Yatirim, borsapy, TradingView, Yahoo (3+ kaynakta medyan) -> prices.json -> onceki
              h["price"] = secim([ifiyat, bfiyat, t.get("price"), yf], 0.03)
              if not h["price"]: h["price"] = fiyat_dosyasi(kod)
              if not h["price"] and o.get("price"):
                  h["price"] = o["price"]; carry.append("price")
              # piyasa degeri: ayni mantik -> fiyat x onceki hisse sayisi -> onceki
              ymc = sayi(yo.get("marketCap"))
              h["mc"] = secim([imc, bmc, t.get("mc"), ymc], 0.05)
              if not h["mc"] and h["price"] and o.get("price") and o.get("mc"):
                  h["mc"] = h["price"] * o["mc"] / o["price"]
              if not h["mc"] and o.get("mc"):
                  h["mc"] = o["mc"]; carry.append("mc")
              # F/K, PD/DD: bilanco -> borsapy -> onceki orani guncel fiyata gore olcekle
              b = None
              try:
                  b = bilanco(kod, h["mc"])
              except Exception as e:
                  print("Bilanco HATA", kod, e)
              if b:
                  fk, pdv, dnm, kb, roe, ham = b
                  h["chk"] = dict(ham, d=dnm)
                  h["kb"] = None if kb is None else round(kb, 1)
                  h["roe"] = None if roe is None else round(roe, 1)
                  h["pe"] = None if not fk else round(fk, 2)
                  h["pb"] = None if not pdv else round(pdv, 2)
              else:
                  # Bilanco okunamadi: borsapy ve TradingView ayni degeri veriyorsa kullan, vermiyorsa bos birak
                  def iki_kaynak(x, y, ust):
                      x = x if x and 0 < x < ust else None
                      y = y if y and 0 < y < ust else None
                      if x and y and abs(x - y) <= max(x, y) * 0.10:
                          return round((x + y) / 2, 2)
                      return None
                  h["pe"] = iki_kaynak(bpe, t.get("pe"), 200)
                  h["pb"] = iki_kaynak(bpb, t.get("pb"), 50)
                  print("Bilanco yok", kod, "F/K borsapy/TV:", bpe, t.get("pe"), "PD/DD:", bpb, t.get("pb"))
                  # Onceki deger sadece bilancodan teyitliyse (chk) guncel fiyata gore tasinir
                  if o.get("chk"):
                      h["chk"] = o["chk"]
                      oran = (h["price"] / o["price"]) if (h["price"] and o.get("price")) else 1
                      if h["pe"] is None and o.get("pe"):
                          h["pe"] = round(o["pe"] * oran, 2); carry.append("pe")
                      if h["pb"] is None and o.get("pb"):
                          h["pb"] = round(o["pb"] * oran, 2); carry.append("pb")
                      for kk in ("kb", "roe"):
                          if o.get(kk) is not None:
                              h[kk] = o[kk]
              # temettu verimi: Yahoo ozet -> TradingView -> Yahoo grafik (12 ay temettu / fiyat) -> onceki
              def mak(v):
                  return v if v is not None and 0 <= v <= 20 else None
              yd = None
              v = sayi(yo.get("dividendYield"))
              if v is None:
                  v = sayi(yo.get("trailingAnnualDividendYield"))
              if v is not None:
                  yd = round(v * 100, 2)
              dy = mak(yd)
              if dy is None: dy = mak(t.get("dy"))
              if dy is None and ytem is not None and h["price"]:
                  dy = mak(round(ytem / h["price"] * 100, 2))
              if dy is None and o.get("dy") is not None:
                  dy = o["dy"]; carry.append("dy")
              h["dy"] = None if dy is None else round(dy, 2)
              if carry:
                  h["carry"] = carry
                  h["asof"] = o.get("asof") or onceki_gun or bugun
              for alan in ("kap", "bdog", "byorum", "frapor", "tek", "uzun"):
                  if alan in o and alan not in h:
                      h[alan] = o[alan]  # bu alanlari diger adimlar/kap.yml gunceller; burada silinmesin
              hisseler[kod] = h
              print(kod, h)

          if not any(v["price"] for v in hisseler.values()):
              print("Hic veri alinamadi")
              sys.exit(1)

          now = datetime.datetime.now(datetime.timezone.utc)
          veri = {"updated": bugun, "kapUpdatedAt": kap_zaman, "enf": enf_onceki,
                  "updatedAt": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "stocks": hisseler}
          veri.update(ust_alanlar)
          json.dump(veri, open("karne.json", "w"), indent=1, sort_keys=True)
          print("Tamam. Hata:", hata)
          PY

      - name: Al-bekle-sat seviyeleri
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, time, datetime, subprocess, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}
          kodlar = [k.strip().upper() for k in os.environ["KARNE"].split(",") if k.strip()]
          simdi = datetime.datetime.now(datetime.timezone.utc)
          bugun = (simdi + datetime.timedelta(hours=3)).date()
          bas = bugun - datetime.timedelta(days=420)
          BAS = bas.strftime("%Y-%m-%d")

          karne = json.load(open("karne.json"))
          try:
              eski = json.loads(subprocess.check_output(["git", "show", "HEAD:kutuphane.json"])).get("stocks", {})
          except Exception:
              eski = {}

          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=40))

          def sayi(x):
              try:
                  x = float(x)
              except Exception:
                  return None
              return x if x == x and x > 0 else None

          def isyatirim(kod):
              out, d = {}, bas
              while d <= bugun:
                  e = min(d + datetime.timedelta(days=90), bugun)
                  u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/HisseTekil"
                       "?hisse=%s&startdate=%s&enddate=%s") % (kod, d.strftime("%d-%m-%Y"), e.strftime("%d-%m-%Y"))
                  for x in (get(u).get("value") or []):
                      try:
                          t = datetime.datetime.strptime(x["HGDG_TARIH"], "%d-%m-%Y").strftime("%Y-%m-%d")
                      except Exception:
                          continue
                      c = sayi(x.get("HGDG_KAPANIS"))
                      if c:
                          out[t] = {"c": c, "lo": sayi(x.get("HGDG_MIN")), "hi": sayi(x.get("HGDG_MAX"))}
                  d = e + datetime.timedelta(days=1)
                  time.sleep(1)
              return out

          def yahoo(kod):
              u = "https://query1.finance.yahoo.com/v8/finance/chart/%s.IS?range=2y&interval=1d&events=div,split" % kod
              r = get(u)["chart"]["result"][0]
              off = r["meta"].get("gmtoffset", 10800)
              q = r["indicators"]["quote"][0]
              out = {}
              for i, t in enumerate(r.get("timestamp") or []):
                  c = sayi(q["close"][i])
                  if not c:
                      continue
                  d = datetime.datetime.utcfromtimestamp(t + off).strftime("%Y-%m-%d")
                  if d >= BAS:
                      out[d] = {"c": round(c, 2), "lo": sayi(q["low"][i]), "hi": sayi(q["high"][i])}
              bol = sorted(datetime.datetime.utcfromtimestamp(v.get("date", 0) + off).strftime("%Y-%m-%d")
                           for tur in ("splits", "dividends")
                       for v in ((r.get("events") or {}).get(tur) or {}).values())
              return out, bol

          def borsapy_gecmis(kod):
              import borsapy as bp
              df = bp.Ticker(kod).history(period="2y")
              out = {}
              for idx, row in df.iterrows():
                  c = sayi(row.get("Close"))
                  d = str(idx)[:10]
                  if c and d >= BAS:
                      out[d] = {"c": round(c, 2)}
              return out

          def kendi_kayit(kod):
              out = {}
              try:
                  gunler = json.load(open("prices.json")).get("days", {})
              except Exception:
                  return out
              for d, g in gunler.items():
                  c = sayi(((g or {}).get("p") or {}).get(kod))
                  if c:
                      out[d] = {"c": c}
              return out

          def esit(a, b):
              return abs(a - b) <= max(0.011, 0.002 * max(a, b))

          def dogrula(K, bolunmeler):
              """Her gun icin dogrulanmis kapanis. Dogrulanamayan gun seriye girmez."""
              ser, kayit = {}, []
              say = {"iki_kaynak": 0, "ek_kaynak": 0, "duzeltme": 0, "cozulemedi": 0}
              tarihler = sorted(set(K["isyatirim"]) | set(K["yahoo"]))

              def aralikta(src, d, v):
                  ref = K[src].get(d) if src in ("isyatirim", "yahoo") else None
                  if not ref or not ref.get("lo"):
                      ref = K["isyatirim"].get(d) or K["yahoo"].get(d) or {}
                  lo, hi = ref.get("lo"), ref.get("hi")
                  return not (lo and hi) or (lo - 0.011 <= v <= hi + 0.011)

              # Temettu/bedelsiz duzeltme farki: Is Yatirim fiyatlari duzeltilmis (gecmis fiyatlar temettu ve
              # bedelsizlere gore asagi cekilir), Yahoo ve borsapy ham fiyat verir. Olaydan onceki gunlerde
              # ikisi arasinda SABIT bir oran olusur. Bu bir hata degil; bu gunlerde duzeltilmis fiyat kullanilir,
              # ancak ham fiyatin da iki kaynakta (Yahoo + borsapy) birebir tuttugu sartiyla.
              oran = {}
              for d in tarihler:
                  a = (K["isyatirim"].get(d) or {}).get("c")
                  b = (K["yahoo"].get(d) or {}).get("c")
                  if a and b and not esit(a, b):
                      oran[d] = a / b
              sira = {d: i for i, d in enumerate(tarihler)}
              bloklar = []
              for d in sorted(oran):
                  bl = bloklar[-1] if bloklar else None
                  if bl and sira[d] == sira[bl["son"]] + 1 and abs(oran[d] - bl["r"]) <= 0.003 * bl["r"]:
                      bl["gunler"].append(d); bl["son"] = d
                  else:
                      bloklar.append({"r": oran[d], "son": d, "gunler": [d]})
              duz = {}
              for bl in bloklar:
                  if len(bl["gunler"]) < 5 or abs(bl["r"] - 1) < 0.004:
                      continue
                  olay = [o for o in bolunmeler if bl["son"] < o <= (datetime.date.fromisoformat(bl["son"]) + datetime.timedelta(days=10)).isoformat()]
                  if olay or len(bl["gunler"]) >= 10:
                      for d in bl["gunler"]:
                          duz[d] = olay[0] if olay else None

              def duzeltme(d, deg):
                  if d not in duz:
                      return False
                  b = deg.get("yahoo")
                  ham_teyit = [x for x in ("borsapy", "kendi_kayit") if deg.get(x) and esit(deg[x], b)]
                  return bool(ham_teyit)

              for d in tarihler:
                  deg = {s: K[s][d]["c"] for s in K if d in K[s]}
                  a, b = deg.get("isyatirim"), deg.get("yahoo")
                  if a and b and esit(a, b) and aralikta("isyatirim", d, a):
                      ser[d] = a; say["iki_kaynak"] += 1
                      continue
                  if a and b and duzeltme(d, deg) and aralikta("isyatirim", d, a) and aralikta("yahoo", d, b):
                      ser[d] = a; say["duzeltme"] += 1
                      kayit.append({"tarih": d, "degerler": deg, "secilen": a,
                                    "neden": "temettu/bedelsiz duzeltilmis fiyat (olay: %s), ham fiyat Yahoo+borsapy ile teyitli" % (duz[d] or "?")})
                      continue
                  en_iyi, destek = None, []
                  for s, v in deg.items():
