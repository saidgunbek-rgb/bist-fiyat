              trend = "yukari" if son > ma20 > ma50 else ("asagi" if son < ma20 < ma50 else "yatay")
              r = rsi(c[-120:])
              return {"vade": "kisa", "seri": [[d, r2(ser[d])] for d in ds[-260:]],
                      "son": r2(son), "tarih": ds[-1], "gun": len(c), "ma20": r2(ma20), "ma20_once": r2(ma20_once), "ma50": r2(ma50),
