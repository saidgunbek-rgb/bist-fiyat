              ma50 = sum(c[-50:]) / 50
              w = c[-63:]
              L, H = min(w), max(w)
              R = H - L
              f382, f50, f618 = H - 0.382 * R, H - 0.5 * R, H - 0.618 * R
              e1272, e1618 = L + 1.272 * R, L + 1.618 * R
              if son < H * 0.98:
                  h1, h1n, h2, h2n = H, "son 3 ayın zirvesi", e1272, "Fibonacci 1,272 uzantısı (3 ay)"
              else:
                  h1, h1n, h2, h2n = e1272, "Fibonacci 1,272 uzantısı (3 ay)", e1618, "Fibonacci 1,618 uzantısı (3 ay)"
              risk, riskn = ma20, "20 günlük ortalama"
              if son < risk:
                  durum = "risk"
              elif son >= h1 * 0.99:
