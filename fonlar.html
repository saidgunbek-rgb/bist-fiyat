<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function sg(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
function ss(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function trD(s){var p=String(s||"").slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s;}
function vir(x,d){return x.toFixed(d).replace(".",",");}
function sade(x){x=String(x||"").replace(/i̇/g,"i").toUpperCase();[["İ","I"],["Ş","S"],["Ğ","G"],["Ü","U"],["Ö","O"],["Ç","C"],["Â","A"]].forEach(function(p){x=x.split(p[0]).join(p[1]);});return x;}
var BNK=/^(AK PORTFÖY|GARANTİ|DENİZ|İŞ PORTFÖY|YAPI KREDİ|QNB|AKTİF|ZİRAAT|HSBC|TEB)/;
var KAY={hisse:["fonlar.json","fon-seri.json","Hisse"],tema:["yabanci.json","yabanci-seri.json","Tematik"],borc:["borclanma.json","borclanma-seri.json","Borçlanma"]};
var TUR=[["tum","Tümü"],["hisse","Hisse"],["tema","Tematik"],["borc","Borçlanma"]];
var WMSG="",DATA={},SER={},SERY={},ROWS=[],TS=sg("fonlar-tur","tum"),FIL="Hepsi",ARA="";
if(!KAY[TS]&&TS!=="tum")TS="tum";

/* ---- Sutunlar ---- */
function G(a){return function(r){var g=r.f.g||{};return g[a]==null?null:g[a];};}
function RK(a){return function(r){var k=r.f.rk||{};return k[a]==null?null:k[a];};}
var COL=[
 {id:"d1",ad:"Günlük",gr:"Getiri",v:G("d1"),t:"p"},{id:"w1",ad:"1 Hafta",gr:"Getiri",v:G("w1"),t:"p"},
 {id:"a1",ad:"1 Ay",gr:"Getiri",v:G("a1"),t:"p"},{id:"a3",ad:"3 Ay",gr:"Getiri",v:G("a3"),t:"p"},{id:"a6",ad:"6 Ay",gr:"Getiri",v:G("a6"),t:"p"},
 {id:"ytd",ad:"YBB",gr:"Getiri",v:G("ytd"),t:"p"},{id:"y1",ad:"1 Yıl",gr:"Getiri",v:G("y1"),t:"p"},{id:"y3",ad:"3 Yıl",gr:"Getiri",v:G("y3"),t:"p"},{id:"y5",ad:"5 Yıl",gr:"Getiri",v:G("y5"),t:"p"},
 {id:"tumg",ad:"Tüm zaman",gr:"Getiri",v:function(r){var t=tek(r);return t?t.tum:null;},t:"p",seri:1},
 {id:"gecm",ad:"Kayıtlı geçmiş",gr:"Getiri",v:function(r){var t=tek(r);return t?t.ys:null;},t:"yil",seri:1},
 {id:"reel",ad:"Reel getiri (1 yıl)",gr:"Getiri",v:G("reel_y1"),t:"p"},
 {id:"fark",ad:"Endeksten fark (1 yıl)",gr:"Getiri",v:function(r){if(r.tur==="tema"){var f=(r.f.fark||{}).y1;return f==null?null:f;}if(r.tur==="hisse"){var b=((DATA.hisse||{}).bist||{}).y1,y=(r.f.g||{}).y1;return b==null||y==null?null:Math.round((y-b)*100)/100;}return null;},t:"p"},
 {id:"mdd",ad:"En büyük düşüş",gr:"Risk",v:RK("mdd"),t:"p"},{id:"vol",ad:"Dalgalanma",gr:"Risk",v:RK("vol"),t:"pu",ilk:"asc"},
 {id:"gr",ad:"Getiri/risk",gr:"Risk",v:RK("gr"),t:"n2"},{id:"rsk",ad:"Risk (1-7)",gr:"Risk",v:function(r){return r.f.risk==null?null:r.f.risk;},t:"n0",ilk:"asc"},
 {id:"buy",ad:"Büyüklük",gr:"Büyüklük",v:function(r){return r.f.buyukluk>0?r.f.buyukluk:null;},t:"para"},
 {id:"yat",ad:"Yatırımcı",gr:"Büyüklük",v:function(r){return r.f.yatirimci>0?r.f.yatirimci:null;},t:"adet"},
 {id:"puan",ad:"Puan",gr:"Puan",v:function(r){return r.f.puan==null?null:r.f.puan;},t:"n0"},
 {id:"kon",ad:"52 hf konum",gr:"Teknik",v:function(r){var t=tek(r);return t?t.kon:null;},t:"pct",ilk:"asc",seri:1},
 {id:"zr",ad:"Zirveden uzaklık",gr:"Teknik",v:function(r){var t=tek(r);return t?t.zr:null;},t:"p",seri:1},
 {id:"tr",ad:"Trend (EMA 13/39)",gr:"Teknik",v:function(r){var t=tek(r);return t?t.tr:null;},t:"trend",seri:1},
 {id:"rsi",ad:"RSI 14 (haftalık)",gr:"Teknik",v:function(r){var t=tek(r);return t?t.rsi:null;},t:"n0",ilk:"asc",seri:1},
 {id:"s13",ad:"Fiyat–SMA 13",gr:"Teknik",v:function(r){var t=tek(r);return t?t.s13:null;},t:"p",seri:1},
 {id:"s26",ad:"Fiyat–SMA 26",gr:"Teknik",v:function(r){var t=tek(r);return t?t.s26:null;},t:"p",seri:1},
 {id:"s52",ad:"Fiyat–SMA 52",gr:"Teknik",v:function(r){var t=tek(r);return t?t.s52:null;},t:"p",seri:1},
 {id:"s13y",ad:"Fiyat / SMA 13",gr:"Teknik",v:function(r){var t=tek(r);return t&&t.s13!=null?(t.s13>=0?1:-1):null;},t:"trend",seri:1}
];
var CI={};COL.forEach(function(c){CI[c.id]=c;});
var PRE=[["📈 Getiri",["d1","w1","a1","a3","a6","y1"],"y1"],["📅 Uzun vade",["y1","y3","y5","tumg","gecm"],"y3"],["🎯 Dibe yakın bakış",["kon","zr","tr","reel","y1"],"kon"],["🛡️ Risk",["mdd","vol","gr","rsk","y1"],"mdd"],["💰 Büyüklük",["buy","yat","puan","y1"],"buy"],["🏅 Puan",["puan","y1","mdd","gr"],"puan"],["📉 Teknik (RSI, SMA)",["rsi","s13","s26","s52","s13y"],"rsi"]];
var SEL=sg("fonlar-sut","d1,a1,a3,a6,y1").split(",").filter(function(c){return CI[c];});if(!SEL.length)SEL=["d1","a1","a3","a6","y1"];
var SK=sg("fonlar-sk","y1"),SD=sg("fonlar-sd","desc");if(!CI[SK]){SK="y1";SD="desc";}

/* ---- Teknik olculer (haftalik fiyat gecmisinden) ---- */
function ema(a,n){var o=[],k=2/(n+1),s=0,p=null;for(var i=0;i<a.length;i++){if(p===null){s+=a[i];if(i===n-1){p=s/n;o.push(p);}else o.push(null);}else{p=a[i]*k+p*(1-k);o.push(p);}}return o;}
function tek(r){if(r._t!==undefined)return r._t;var S=SER[r.tur];if(!S)return null;var s=S[r.k];var t=null;
  if(s&&s.length>=30){var c=s.map(function(p){return p[1];}),son=c[c.length-1],d=new Date(s[s.length-1][0]).getTime(),lim=d-365*864e5,w=[],ilk=null;
    for(var i=0;i<s.length;i++){var ti=new Date(s[i][0]).getTime();if(ti>=lim){w.push(s[i][1]);if(ilk===null)ilk=ti;}}
    t={kon:null,zr:null,tr:null,tum:null,ys:null};var s0=s[0][1],d0=new Date(s[0][0]).getTime();if(s0>0){t.tum=(son/s0-1)*100;t.ys=(d-d0)/(365.25*864e5);}
    if(w.length>=30&&ilk!==null&&ilk-(d-365*864e5)<=35*864e5){var hi=Math.max.apply(null,w),lo=Math.min.apply(null,w);if(hi>lo)t.kon=(son-lo)/(hi-lo)*100;t.zr=(son/hi-1)*100;}
    t.rsi=null;t.s13=null;t.s26=null;t.s52=null;
    if(c.length>=15){var ag=0,al=0,df;for(var q=1;q<=14;q++){df=c[q]-c[q-1];ag+=df>0?df:0;al+=df<0?-df:0;}ag/=14;al/=14;for(q=15;q<c.length;q++){df=c[q]-c[q-1];ag=(ag*13+(df>0?df:0))/14;al=(al*13+(df<0?-df:0))/14;}t.rsi=al===0?100:100-100/(1+ag/al);}
    [[13,"s13"],[26,"s26"],[52,"s52"]].forEach(function(a){if(c.length>=a[0]){var m=0;for(var q2=c.length-a[0];q2<c.length;q2++)m+=c[q2];m/=a[0];if(m>0)t[a[1]]=(son/m-1)*100;}});
    if(c.length>=45){var a=ema(c,13),b=ema(c,39),x=a[a.length-1],y=b[b.length-1];if(x!=null&&y!=null)t.tr=x>y?1:-1;}}
  r._t=t;return t;}

/* ---- Bicimler ---- */
function fmt(c,v){if(v==null)return"—";
  if(c.t==="p")return(v>=0?"+":"−")+"%"+vir(Math.abs(v),Math.abs(v)<10?2:1);
  if(c.t==="pu")return"%"+vir(v,1);if(c.t==="pct")return"%"+Math.round(v);
  if(c.t==="n2")return vir(v,2);if(c.t==="n0")return String(Math.round(v));
  if(c.t==="para")return v>=1e9?vir(v/1e9,1)+" mr":Math.round(v/1e6)+" mn";
  if(c.t==="adet")return v>=1e3?vir(v/1e3,v>=1e4?0:1)+" bin":String(Math.round(v));
  if(c.t==="trend")return v>0?"Üstünde ▲":"Altında ▼";if(c.t==="yil")return vir(v,1)+" yıl";return String(v);}
function kls(c,v){if(v==null)return"";if(c.t==="p")return v>=0?"up":"dn";if(c.t==="trend")return v>0?"up":"dn";if(c.id==="gr")return v>=0?"up":"dn";return"";}

/* ---- Veri ---- */
function altBorc(ad){var u=sade(ad);if(u.indexOf("TLREF")>=0)return"Tlref endeksli";if(u.indexOf("KATILIM")>=0||u.indexOf("KIRA")>=0)return"Katılım";if(/EUROBOND|DOVIZ|YABANCI|DOLAR|EURO\b/.test(u))return"Döviz / yabancı";return"TL borçlanma";}
function kur(){ROWS=[];
  var H=DATA.hisse;if(H&&H.fonlar)H.fonlar.forEach(function(f){ROWS.push({k:f.k,ad:f.ad||"",tur:"hisse",alt:f.grup==="Kamu"?"Kamu banka":"Özel banka",f:f});});
  var T=DATA.tema;if(T&&T.fonlar)T.fonlar.filter(function(f){return f.et!=="Tematik"||BNK.test(f.ad||"");}).forEach(function(f){ROWS.push({k:f.k,ad:f.ad||"",tur:"tema",alt:f.tema||"Tematik",f:f});});
  var B=DATA.borc;if(B&&B.fonlar)B.fonlar.forEach(function(f){ROWS.push({k:f.k,ad:f.ad||"",tur:"borc",alt:altBorc(f.ad),f:f});});}
function say(t){return ROWS.filter(function(r){return r.tur===t;}).length;}
function yukle(){var bek=Object.keys(KAY).map(function(t){return fetch(KAY[t][0]+"?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){DATA[t]=d;}).catch(function(){DATA[t]=null;});});
  Promise.all(bek).then(function(){kur();var m=[];if(!DATA.hisse)m.push("Hisse");if(!DATA.tema)m.push("Tematik");
    if(m.length)WMSG='<div class="warn">'+m.join(" ve ")+' fon verisi şu an okunamadı. Sayfa yenilenince tekrar denenir.</div>';
    ciz();});}
function seriYukle(cb){var t=Object.keys(KAY).filter(function(x){return DATA[x]&&!SER[x]&&!SERY[x];});if(!t.length)return cb&&cb();
  t.forEach(function(x){SERY[x]=1;});
  Promise.all(t.map(function(x){return fetch(KAY[x][1]+"?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){SER[x]=d.fon||{};}).catch(function(){SER[x]={};});})).then(function(){ROWS.forEach(function(r){r._t=undefined;});cb&&cb();});}

/* ---- Cizim ---- */
function filtreler(){var L=["Hepsi"];if(TS==="tum")return L;
  ROWS.filter(function(r){return r.tur===TS;}).forEach(function(r){if(L.indexOf(r.alt)<0)L.push(r.alt);});return L;}
function ciz(){
  var h="";TUR.forEach(function(t){var n=t[0]==="tum"?ROWS.length:say(t[0]);h+='<button data-t="'+t[0]+'" class="'+(TS===t[0]?"on":"")+'">'+t[1]+((t[0]==="borc"&&!DATA.borc)?"":" · "+n)+'</button>';});
  document.getElementById("tur").innerHTML=h;
  var up=[];Object.keys(KAY).forEach(function(t){var d=DATA[t];if(d&&(d.updated||d.updatedAt))up.push(d.updated||String(d.updatedAt).slice(0,10));});
  document.getElementById("sub").textContent="Hisse, tematik ve borçlanma fonları tek yerde · yalnızca banka portföy şirketlerinin fonları"+(up.length?" · son tarama "+trD(up.sort().slice(-1)[0]):"");
  var p="";PRE.forEach(function(x,i){p+='<button data-p="'+i+'">'+x[0]+'</button>';});document.getElementById("pre").innerHTML=p;
  var s="",grs=["Getiri","Risk","Büyüklük","Puan","Teknik"];grs.forEach(function(g){s+='<div class="sg">'+(g==="Teknik"?"Teknik (fiyat geçmişinden)":g)+'</div>';COL.filter(function(c){return c.gr===g;}).forEach(function(c){s+='<button class="ch'+(SEL.indexOf(c.id)>=0?" on":"")+'" data-c="'+c.id+'">'+c.ad+'</button>';});});
  document.getElementById("sut").innerHTML=s;
  var F=filtreler();if(F.indexOf(FIL)<0)FIL="Hepsi";var f="";if(F.length>1)F.forEach(function(x){f+='<button data-f="'+esc(x)+'" class="'+(FIL===x?"on":"")+'">'+esc(x)+'</button>';});document.getElementById("flt").innerHTML=f;
  tablo();}
function tablo(){
  var msg=document.getElementById("msg"),cols=COL.filter(function(c){return SEL.indexOf(c.id)>=0;});
  var needS=cols.some(function(c){return c.seri;})||(CI[SK]&&CI[SK].seri);
  if(needS&&!Object.keys(SER).length&&Object.keys(SERY).length<1){seriYukle(function(){tablo();});}
  var uyr="";if(TS==="borc"&&!DATA.borc)uyr='<div class="warn">Borçlanma fonları verisi henüz hazır değil. GitHub’da Actions → “Borçlanma fonlari” → Run workflow ile ilk kez çalıştırılınca burada görünecek.</div>';
  if(TS==="tum"&&!DATA.borc)uyr='<div class="warn">Borçlanma fonları henüz listede yok: veri toplayan çalışma ilk kez çalıştırılınca eklenecek.</div>';
  msg.innerHTML=WMSG+uyr;
  var L=ROWS.filter(function(r){return TS==="tum"||r.tur===TS;});
  if(FIL!=="Hepsi"&&TS!=="tum")L=L.filter(function(r){return r.alt===FIL;});
  if(ARA){var q=ARA.toLocaleUpperCase("tr");L=L.filter(function(r){return r.k.toUpperCase().indexOf(q)>=0||(r.ad||"").toLocaleUpperCase("tr").indexOf(q)>=0;});}
  var sc=CI[SK]||CI.y1,dir=SD==="asc"?1:-1;
  L=L.slice().sort(function(a,b){var x=sc.v(a),y=sc.v(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (x-y)*dir;});
  var h='<tr><th>#</th><th>Fon</th>';cols.forEach(function(c){h+='<th data-s="'+c.id+'" class="'+(c.id===SK?"so":"")+'">'+c.ad+(c.id===SK?(SD==="asc"?" ▲":" ▼"):"")+'</th>';});h+='</tr>';
  var ET={hisse:"Hisse",tema:"Tematik",borc:"Borçlanma"};
  L.forEach(function(r,i){h+='<tr class="rw" data-k="'+esc(r.k)+'" data-t="'+r.tur+'"><td>'+(i+1)+'</td><td><b>'+esc(r.k)+'</b><small>'+(TS==="tum"?ET[r.tur]+" · ":"")+esc(r.alt)+'</small></td>';
    cols.forEach(function(c){var v=c.v(r);h+='<td class="'+kls(c,v)+'">'+fmt(c,v)+'</td>';});h+='</tr>';});
  if(!L.length)h+='<tr><td colspan="'+(cols.length+2)+'" style="text-align:center;color:var(--mut)">Gösterilecek fon yok</td></tr>';
  document.getElementById("tb").innerHTML=h;
  document.getElementById("bilgi").textContent=L.length+" fon · sütun başlığına dokununca o sütuna göre sıralanır (tekrar dokununca ters) · satıra dokununca fon penceresi açılır · tabloyu sağa kaydır →";
  var nt="Getiriler fonun TEFAS fiyat geçmişinden hesaplanır ve TEFAS’ın bildirdiği değerle teyit edilir; tutmayan fon listeye girmez. “—” = veri yok ya da bu fon için hesaplanamadı. ";
  if(cols.some(function(c){return c.id==="fark";}))nt+="Endeksten fark: Hisse fonlarında BIST 100, Tematik fonlarda Nasdaq-100’e göre 1 yıllık getiri farkıdır; Borçlanma fonlarında yoktur. ";
  if(cols.some(function(c){return c.id==="tumg"||c.id==="gecm";}))nt+="Tüm zaman: fonun elimizdeki en eski fiyatından bugüne getiri. Fiyat geçmişi en fazla yaklaşık 5 yıl geriye gidebildiği için daha eski fonlarda bu, fonun kuruluşundan değil kayıtlı geçmişin başından itibarendir; “Kayıtlı geçmiş” sütunu bunun kaç yıl olduğunu gösterir. ";
  if(needS)nt+="52 hf konum: fiyatın son 1 yılın en düşüğü (%0) ile en yükseği (%100) arasındaki yeri; Trend: haftalık EMA 13’ün EMA 39’un üstünde olup olmadığı. ";
  nt+="Geçmiş getiri gelecek getirinin garantisi değildir; bu sayfa al/sat önerisi değildir, karar sana aittir.";
  document.getElementById("not").textContent=nt;}

/* ---- Olaylar ---- */
document.addEventListener("click",function(e){var t=e.target;
  var b=t.closest("[data-t]");if(b&&b.parentNode.id==="tur"){TS=b.getAttribute("data-t");FIL="Hepsi";ss("fonlar-tur",TS);ciz();return;}
  b=t.closest("[data-p]");if(b){var p=PRE[+b.getAttribute("data-p")];SEL=p[1].slice();SK=p[2];SD=(CI[SK].ilk||"desc");sak();ciz();return;}
  b=t.closest("[data-c]");if(b){var c=b.getAttribute("data-c"),i=SEL.indexOf(c);if(i>=0){if(SEL.length>1)SEL.splice(i,1);}else SEL.push(c);sak();if(CI[c].seri&&SEL.indexOf(c)>=0)seriYukle(function(){ciz();});ciz();return;}
  b=t.closest("[data-f]");if(b&&b.parentNode.id==="flt"){FIL=b.getAttribute("data-f");ciz();return;}
  b=t.closest("th[data-s]");if(b){var s=b.getAttribute("data-s");if(SK===s)SD=SD==="asc"?"desc":"asc";else{SK=s;SD=CI[s].ilk||"desc";}sak();tablo();return;}
  b=t.closest("tr.rw");if(b){ac(b.getAttribute("data-t"),b.getAttribute("data-k"));return;}
});
function sak(){ss("fonlar-sut",SEL.join(","));ss("fonlar-sk",SK);ss("fonlar-sd",SD);}
document.getElementById("ara").addEventListener("input",function(e){ARA=e.target.value.trim();tablo();});

/* ---- Fon penceresi ---- */
function ac(tur,k){var r=ROWS.filter(function(x){return x.k===k&&x.tur===tur;})[0];if(!r)return;
  if(tur==="borc")return borcPen(r);
  var u=(tur==="hisse"?"fon.html":"yabanci.html")+"#k="+encodeURIComponent(k);
  var o=document.getElementById("ov");o.innerHTML='<iframe src="'+u+'" title="Fon penceresi"></iframe>';o.className="on";document.body.style.overflow="hidden";}
function ovKapat(){var o=document.getElementById("ov");o.className="";o.innerHTML="";document.body.style.overflow="";}
window.addEventListener("message",function(e){if(e.origin!==location.origin)return;if(e.data&&e.data.fonKapat)ovKapat();});

function sira(r,get){var L=DATA.borc.fonlar.filter(function(x){return get(x)!=null;}).sort(function(a,b){return get(b)-get(a);});var i=-1;L.forEach(function(x,j){if(x.k===r.k)i=j;});return i<0?null:[i+1,L.length];}
function borcPen(r){var f=r.f,g=f.g||{},rk=f.rk||{},o=document.getElementById("bp");
  function M(ad,c,v){return'<div>'+ad+'<b class="'+kls(CI[c],v)+'">'+fmt(CI[c],v)+'</b></div>';}
  var h='<div class="pk"><button class="px" aria-label="Kapat">✕</button><h2>'+esc(f.k)+'</h2><div class="sub" style="margin-bottom:0">'+esc(f.ad||"")+'<br>'+esc(r.alt)+(f.banka?" · "+esc(f.banka):"")+'</div>'
   +'<div class="mg">'+M("1 ay","a1",g.a1)+M("3 ay","a3",g.a3)+M("6 ay","a6",g.a6)+M("1 yıl","y1",g.y1)+M("Reel 1 yıl","reel",g.reel_y1)+M("En büyük düşüş","mdd",rk.mdd==null?null:rk.mdd)+M("Dalgalanma","vol",rk.vol==null?null:rk.vol)+M("Büyüklük","buy",f.buyukluk>0?f.buyukluk:null)+M("Yatırımcı","yat",f.yatirimci>0?f.yatirimci:null)+'</div>'
   +'<div class="bx"><div class="t">📈 Fiyat grafiği <small style="font-weight:400;color:var(--mut)">haftalık</small></div><canvas id="bc" width="520" height="300"></canvas><div class="nt" id="bcn" style="margin:4px 0 0"></div></div>';
  var sr=[["1 yıl getiri",function(x){return(x.g||{}).y1;}],["6 ay getiri",function(x){return(x.g||{}).a6;}],["Reel getiri (1 yıl)",function(x){return(x.g||{}).reel_y1;}],["En az düşüş",function(x){return(x.rk||{}).mdd;}]],sh="";
  sr.forEach(function(q){var s=sira(r,q[1]);if(s)sh+='<div class="far"><span>'+q[0]+'</span><b class="'+(s[0]<=Math.ceil(s[1]/4)?"up":s[0]>Math.floor(s[1]*3/4)?"dn":"")+'">'+s[0]+'. / '+s[1]+'</b></div>';});
  if(sh)h+='<div class="bx"><div class="t">🏅 Diğer borçlanma fonları arasında sırası</div>'+sh+'</div>';
  h+='<div class="nt">Borçlanma fonlarında yüksek getiri risksiz olduğu anlamına gelmez; faiz ve fiyat hareketleriyle değer kaybı olabilir. Geçmiş getiri gelecek getirinin garantisi değildir. Bu pencere al/sat önerisi değildir, karar sana aittir.</div><button class="pkap">Kapat</button></div>';
  o.innerHTML=h;o.className="on";document.body.style.overflow="hidden";
  function kapat(){o.className="";o.innerHTML="";document.body.style.overflow="";}
  o.onclick=function(e){if(e.target===o)kapat();};o.querySelector(".px").onclick=kapat;o.querySelector(".pkap").onclick=kapat;
  seriYukle(function(){grafik(r);});if(SER.borc)grafik(r);}
function grafik(r){var cv=document.getElementById("bc");if(!cv)return;var s=(SER.borc||{})[r.k],n=document.getElementById("bcn");
  if(!s||s.length<5){cv.style.display="none";if(n)n.textContent="Bu fon için grafik verisi yok.";return;}
  s=s.slice(-104);var W=cv.width,H=cv.height,x=cv.getContext("2d"),mn=Infinity,mx=-Infinity;s.forEach(function(p){mn=Math.min(mn,p[1]);mx=Math.max(mx,p[1]);});if(mx<=mn)mx=mn+1e-9;
  x.clearRect(0,0,W,H);x.strokeStyle="#8b7cf6";x.lineWidth=3;x.beginPath();s.forEach(function(p,i){var px=10+(W-20)*i/(s.length-1),py=H-14-(H-28)*(p[1]-mn)/(mx-mn);if(i)x.lineTo(px,py);else x.moveTo(px,py);});x.stroke();
  if(n)n.textContent=trD(s[0][0])+" – "+trD(s[s.length-1][0])+" · en düşük "+mn.toPrecision(4).replace(".",",")+" · en yüksek "+mx.toPrecision(4).replace(".",",");}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){ovKapat();var b=document.getElementById("bp");b.className="";b.innerHTML="";}});
yukle();
</script></body></html>
