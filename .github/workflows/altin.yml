# Analiz sayfasi icin altin ve gumus (gram, ons) gunluk mum verisini hazirlar: altin.json
# Kaynaklar Yahoo + Stooq (dogrulama). Diger dosyalara dokunmaz.
name: Altin verisi

on:
  schedule:
    - cron: "7,37 6-14 * * 1-5"
    - cron: "17 16,18 * * 1-5"
    - cron: "37 21 * * 1-5"   
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altin
  cancel-in-progress: false

jobs:
  altin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Mum verisini al ve dogrula
        run: python3 altin_veri.py

      - name: Kaydet
        run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          git add altin.json
          git diff --cached --quiet && exit 0
          git commit -m "Altin verisi"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
