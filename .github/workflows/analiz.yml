# Analiz sayfasi (analiz.html) icin gunluk mum verisini hazirlar: analiz.json
# Her hisse icin son 2 yilin acilis / en yuksek / en dusuk / kapanis / hacim degerleri.
# Bir gunun kapanisi en az 2 kaynakta (Yahoo, borsapy, Is Yatirim) ayni degilse o gun seriye alinmaz (uydurulmaz).
# Hisse listesi kendiliginden olusur: fiyat.yml'deki HISSELER + kutuphane.yml'deki KUTUPHANE. Burayi ayrica degistirmek gerekmez.
# Diger dosyalara (prices.json, karne.json, kutuphane.json) dokunmaz.
name: Analiz verisi

on:
  schedule:
    - cron: "7 16 * * 1-5"    # hafta ici 19:07 (Turkiye saati), kapanis kesinlestikten sonra
    - cron: "27 18 * * 1-5"   # hafta ici 21:27: yedek calisma, eksik kalan hisseleri tamamlar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analiz
  cancel-in-progress: false

jobs:
  analiz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Baglanti kopmalarina karsi tekrar deneme
        run: |
          mkdir -p /tmp/ag
          cat > /tmp/ag/sitecustomize.py <<'PY'
          import time, socket, http.client, urllib.request, urllib.error
          _asil = urllib.request.urlopen
          def _tekrarli(*a, **k):
              for i in range(4):
                  try:
                      return _asil(*a, **k)
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504) and i < 3:
                          time.sleep(5 * (i + 1)); continue
                      raise
                  except (urllib.error.URLError, ConnectionError, http.client.HTTPException, socket.timeout, TimeoutError, OSError):
                      if i == 3:
                          raise
                      time.sleep(3 * (i + 1))
          urllib.request.urlopen = _tekrarli
          PY
          echo "PYTHONPATH=/tmp/ag" >> "$GITHUB_ENV"

      - name: borsapy kur
        continue-on-error: true
        run: pip install borsapy 2>&1 | tail -1

      - name: Mum verisini al ve dogrula
        run: python3 analiz_veri.py

      - name: Kaydet
        run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          git add analiz.json
          git diff --cached --quiet && exit 0
          git commit -m "Analiz verisi"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
