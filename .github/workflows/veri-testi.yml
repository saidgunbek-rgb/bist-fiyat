# TEK SEFERLİK TEST: BIST hisseleri için F/K, PD/DD, temettü verisi geliyor mu?
# Hiçbir dosyayı değiştirmez, sadece sonucu kayıtta gösterir.
name: Veri testi (tek seferlik)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 1 - Yahoo
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, http.cookiejar, urllib.error

          UA = {"User-Agent": "Mozilla/5.0"}
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def ac(url):
              return op.open(urllib.request.Request(url, headers=UA), timeout=30).read().decode()

          crumb = ""
          try:
              try:
                  ac("https://fc.yahoo.com")
              except urllib.error.HTTPError:
                  pass
              crumb = ac("https://query1.finance.yahoo.com/v1/test/getcrumb")
              print("CRUMB:", "alindi" if crumb else "bos")
          except Exception as e:
              print("CRUMB HATA:", e)

          def raw(x):
              if isinstance(x, dict):
                  return x.get("raw")
              return x

          for kod in ("THYAO", "PGSUS", "AKBNK"):
              print("=====", kod)
              try:
                  u = ("https://query1.finance.yahoo.com/v10/finance/quoteSummary/%s.IS"
                       "?modules=summaryDetail,defaultKeyStatistics,financialData&crumb=%s") % (kod, crumb)
                  j = json.loads(ac(u))["quoteSummary"]["result"][0]
                  sd = j.get("summaryDetail", {})
                  ks = j.get("defaultKeyStatistics", {})
                  fd = j.get("financialData", {})
                  print("FK (trailingPE):", raw(sd.get("trailingPE")))
                  print("PD/DD (priceToBook):", raw(ks.get("priceToBook")))
                  print("Temettu verimi:", raw(sd.get("dividendYield")))
                  print("Ozsermaye karliligi (ROE):", raw(fd.get("returnOnEquity")))
                  print("Kar buyumesi:", raw(fd.get("earningsGrowth")))
                  print("Borc/Ozsermaye:", raw(fd.get("debtToEquity")))
                  print("Piyasa degeri:", raw(sd.get("marketCap")))
              except Exception as e:
                  print("quoteSummary HATA:", e)
              try:
                  u = ("https://query1.finance.yahoo.com/v7/finance/quote?symbols=%s.IS&crumb=%s") % (kod, crumb)
                  q = json.loads(ac(u))["quoteResponse"]["result"][0]
                  print("v7 FK:", q.get("trailingPE"), "| PD/DD:", q.get("priceToBook"),
                        "| Temettu:", q.get("trailingAnnualDividendYield"), "| EPS:", q.get("epsTrailingTwelveMonths"))
              except Exception as e:
                  print("v7 quote HATA:", e)
          print("TEST BITTI")
          PY

      - name: 2 - borsapy (Turk kutuphanesi)
        continue-on-error: true
        run: |
          pip install borsapy 2>&1 | tail -1
          python3 - <<'PY'
          import borsapy as bp
          for kod in ("THYAO", "PGSUS", "AKBNK"):
              print("=====", kod)
              try:
                  h = bp.Ticker(kod)
                  for ad in ("info", "fast_info"):
                      try:
                          v = getattr(h, ad)
                          d = dict(v) if hasattr(v, "keys") else {"deger": str(v)[:200]}
                          sec = {k: d[k] for k in d if any(z in str(k).lower() for z in ("pe", "pb", "div", "f_k", "fk", "pd", "temett", "market", "cap", "price"))}
                          print(ad, "->", sec if sec else list(d)[:25])
                      except Exception as e:
                          print(ad, "HATA:", e)
              except Exception as e:
                  print("HATA:", e)
          print("TEST BITTI")
          PY

      - name: 3 - Is Yatirim bilanco
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          UA = {"User-Agent": "Mozilla/5.0"}
          for kod in ("THYAO", "PGSUS", "AKBNK"):
              print("=====", kod)
              for grup in ("XI_29", "UFRS"):
                  u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/MaliTablo"
                       "?companyCode=%s&exchange=TRY&financialGroup=%s&year1=2025&period1=9&year2=2025&period2=6&year3=2025&period3=3&year4=2024&period4=12&_=%d") % (kod, grup, int(time.time()*1000))
                  try:
                      j = json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30))
                      v = j.get("value") or []
                      print(grup, "ok=", j.get("ok"), "kalem sayisi:", len(v))
                      for x in v[:3]:
                          print("  ", x.get("itemCode"), x.get("itemDescTr"), x.get("value1"))
                      if v:
                          break
                  except Exception as e:
                      print(grup, "HATA:", e)
          print("TEST BITTI")
          PY
