name: Enpara gram altin gumus

on:
  schedule:
    - cron: "7,37 6-15 * * 1-5"   # 09:07 - 18:37 Turkiye saati, hafta ici
    - cron: "25 15 * * 1-5"       # 18:25 aksam (degerleme fiyati)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karne-veri
  cancel-in-progress: false

jobs:
  enpara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Veriyi cek
        run: python3 enpara_tara.py
      - name: Kaydet
        run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          git add enpara.json prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Enpara gram altin gumus guncellendi"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
