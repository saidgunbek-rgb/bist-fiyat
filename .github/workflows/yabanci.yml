# Nasdaq / S&P 500 icerikli fonlar: TEFAS'taki tum fonlar arasindan adinda Nasdaq ya da S&P gecenleri her aksam tarar, yabanci.json dosyasina yazar.
# Olcut: Nasdaq-100 ve S&P 500 endeksi, dolar/TL ile TL'ye cevrilmis (iki bagimsiz yoldan teyit edilir). Sayfa: yabanci.html
# Panelin diger dosyalarina dokunmaz, bildirim gondermez.
name: Yabanci fonlar

on:
  schedule:
    - cron: "50 17 * * 1-5"    # hafta ici 20:50 (Turkiye saati)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: yabanci
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli paketler
        run: pip install borsapy 2>&1 | tail -1

      - name: Fonlari tara
        run: |
          python3 - <<'PY'
          import json, time, datetime, re, calendar, inspect, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          import borsapy as bp

          LOG = {"surum": getattr(bp, "__version__", "?"), "notlar": []}
          def not_(x):
              print(x); LOG["notlar"].append(str(x)[:300])

          def kayitlar(x):
              if x is None:
                  return []
              if hasattr(x, "reset_index") and hasattr(x, "to_dict"):
                  try:
                      return x.reset_index().to_dict("records")
                  except Exception:
                      return x.to_dict("records")
              if isinstance(x, dict):
                  for k in ("data", "results", "funds", "items"):
                      if isinstance(x.get(k), list):
                          return x[k]
                  return [x]
              if isinstance(x, (list, tuple)):
                  return [r if isinstance(r, dict) else getattr(r, "__dict__", {"value": r}) for r in x]
              return []

          def al(r, *adlar):
              for a in adlar:
                  for k in r:
                      if str(k).lower() == a.lower() and r[k] not in (None, "", "nan"):
                          return r[k]
              return None

          def sayi(x):
              try:
                  v = float(str(x).replace(",", ".")) if not isinstance(x, (int, float)) else float(x)
                  return v if v == v else None
              except Exception:
                  return None

          def sade(x):
              x = str(x or "").replace("i̇", "i").upper()
              for a, b in (("İ", "I"), ("Ş", "S"), ("Ğ", "G"), ("Ü", "U"), ("Ö", "O"), ("Ç", "C"), ("Â", "A")):
                  x = x.replace(a, b)
              return " ".join(x.split())

          def ay_once(t, n):
              y, m = t.year, t.month - n
              while m <= 0:
                  m += 12; y -= 1
              return datetime.date(y, m, min(t.day, calendar.monthrange(y, m)[1]))

          def donem_getiri(seri, ay):
              # Takvim olarak "ay" ay onceki gun (ya da oncesindeki son fiyat) ile son fiyat arasi % degisim
              if len(seri) < 2:
                  return None
              son_t, son = seri[-1]
              hedef = ay_once(son_t, ay)
              if seri[0][0] > hedef + datetime.timedelta(days=14):
                  return None          # seri bu donemi kapsamiyor
              onceki = [v for t, v in seri if t <= hedef]
              if not onceki and seri[0][0] <= hedef + datetime.timedelta(days=5):
                  onceki = [seri[0][1]]   # TEFAS gecmisi tam o gunden baslıyorsa (5 yil siniri)
              if not onceki or not onceki[-1]:
                  return None
              return round((son / onceki[-1] - 1) * 100, 2)

          def getiri_araligi(seri, ay):
              if len(seri) < 30:
                  return None
              out = []
              for son_t, son in seri[-2:]:
                  h = ay_once(son_t, ay)
                  for t, v in seri:
                      if abs((t - h).days) <= 4 and v:
                          out.append((son / v - 1) * 100)
              return (min(out), max(out)) if out else None

          def risk_olc(seri):
              if len(seri) < 60:
                  return None
              son_t = seri[-1][0]
              s1 = [(t, v) for t, v in seri if t >= ay_once(son_t, 12)]
              if len(s1) < 40:
                  return None
              tepe, mdd = s1[0][1], 0.0
              for t, v in s1:
                  tepe = max(tepe, v); mdd = min(mdd, v / tepe - 1)
              hf, hedef = [], s1[0][0]
              for t, v in s1:
                  if t >= hedef:
                      hf.append(v); hedef = t + datetime.timedelta(days=7)
              r = [b / a - 1 for a, b in zip(hf, hf[1:]) if a]
              if len(r) < 20:
                  return None
              ort = sum(r) / len(r)
              vol = (sum((x - ort) ** 2 for x in r) / (len(r) - 1)) ** 0.5 * (52 ** 0.5)
              return {"mdd": round(mdd * 100, 2), "vol": round(vol * 100, 2)}

          def haftalik(seri, bas, adim=7):
              out, hedef = [], bas
              for t, v in seri:
                  if t >= hedef:
                      out.append((t, v)); hedef = t + datetime.timedelta(days=adim)
              return out

          def korelasyon(seri):
              # son 12 ayda haftalik getirilerin Nasdaq-100 / S&P 500 (TL) ile korelasyonu
              if len(seri) < 120:
                  return None
              bas = ay_once(seri[-1][0], 12)
              hf = haftalik([x for x in seri if x[0] >= bas], bas)
              if len(hf) < 30:
                  return None
              res = {}
              for ad, bs in BSER.items():
                for lag in (0, 1, 2, 3):
                  x, y, j, son = [], [], 0, None
                  for t, v in hf:
                      while j < len(bs) and bs[j][0] <= t - datetime.timedelta(days=lag):
                          son = bs[j][1]; j += 1
                      x.append(v); y.append(son)
                  if None in y:
                      continue
                  rx = [b / a - 1 for a, b in zip(x, x[1:]) if a]
                  ry = [b / a - 1 for a, b in zip(y, y[1:]) if a]
                  if len(rx) != len(ry) or len(rx) < 25:
                      continue
                  mx, my = sum(rx) / len(rx), sum(ry) / len(ry)
                  sxy = sum((a - mx) * (b - my) for a, b in zip(rx, ry))
                  sxx = sum((a - mx) ** 2 for a in rx); syy = sum((b - my) ** 2 for b in ry)
                  if sxx > 0 and syy > 0:
                      c = round(sxy / (sxx * syy) ** 0.5, 3)
                      if c > res.get(ad, -2):
                          res[ad] = c
              return res or None

          DON = {"a1": 1, "a3": 3, "a6": 6, "y1": 12}
          UZUN = {"y3": 36, "y5": 60}
          TUMD = dict(DON, **UZUN)

          # ---------------------------------------------------------------- 1) Olcut endeksleri (TL'ye cevrilmis)
          def web(u, deneme=3):
              hata = None
              for d in range(deneme):
                  try:
                      return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=30).read())
                  except Exception as e:
                      hata = e; time.sleep(3 * (d + 1))
              raise hata

          def yahoo(sembol):
              r = web("https://query1.finance.yahoo.com/v8/finance/chart/%s?range=6y&interval=1d" % sembol)["chart"]["result"][0]
              return sorted((datetime.date.fromtimestamp(t), c) for t, c in zip(r["timestamp"], r["indicators"]["quote"][0]["close"]) if c)

          def ecb_kur():
              bas = (datetime.date.today() - datetime.timedelta(days=6 * 366)).isoformat()
              for u in ("https://api.frankfurter.dev/v1/%s..?base=USD&symbols=TRY", "https://api.frankfurter.app/%s..?from=USD&to=TRY"):
                  try:
                      r = web(u % bas, 2)["rates"]
                      return sorted((datetime.date.fromisoformat(d), v["TRY"]) for d, v in r.items() if v.get("TRY"))
                  except Exception:
                      continue
              raise Exception("frankfurter ulasilamadi")

          def tl(endeks, kur):
              # endeks (USD) x o gunun (ya da oncesindeki son) dolar/TL kuru
              out, j, son = [], 0, None
              for t, c in endeks:
                  while j < len(kur) and kur[j][0] <= t:
                      son = kur[j][1]; j += 1
                  if son:
                      out.append((t, c * son))
              return out

          BEN = {}
          BSER = {}
          SER = {}      # fon kodu -> haftalik fiyat serisi (fon penceresindeki grafik icin)
          try:
              usd_y = yahoo("USDTRY=X"); usd_e = ecb_kur()
              not_("USDTRY: yahoo %d gun, ecb %d gun" % (len(usd_y), len(usd_e)))
              for ad, ana, vekil in (("ndx", "^NDX", "QQQ"), ("spx", "^GSPC", "SPY")):
                  try:
                      a = tl(yahoo(ana), usd_y); b = tl(yahoo(vekil), usd_e)
                      g = {}
                      for k, ay in TUMD.items():
                          x, y = donem_getiri(a, ay), donem_getiri(b, ay)
                          # iki bagimsiz yol (endeks x Yahoo kuru, ETF x ECB kuru) 3 puan icinde tutarsa teyitli
                          g[k] = x if (x is not None and y is not None and abs(x - y) <= 3.0) else None
                          if x is not None and y is not None and abs(x - y) > 3.0:
                              not_("%s %s tutmadi: %s / %s" % (ad, k, x, y))
                      if len(a) >= 2 and a[-2][1]:
                          g["d1"] = round((a[-1][1] / a[-2][1] - 1) * 100, 2)
                      g["tarih"] = str(a[-1][0]); g["ad"] = {"ndx": "Nasdaq-100", "spx": "S&P 500"}[ad]
                      BEN[ad] = g
                      BSER[ad] = a
                  except Exception as e:
                      not_("%s endeksi HATA %r" % (ad, e))
          except Exception as e:
              not_("Kur HATA %r" % e)
          try:
              BSER["bist"] = yahoo("XU100.IS")
          except Exception as e:
              not_("BIST100 serisi HATA %r" % e)
          not_("Olcutler: %s" % BEN)

          # ---------------------------------------------------------------- 2) Aday fonlar (tum TEFAS fon listesi, ada gore secilir)
          aday = {}
          for ad, fn in (("screen_funds(YAT)", lambda: bp.screen_funds(fund_type="YAT", limit=5000)),
                         ("screen_funds(BYF)", lambda: bp.screen_funds(fund_type="BYF", limit=5000))):
              try:
                  rs = kayitlar(fn()); n0 = len(aday)
                  for r in rs:
                      k = al(r, "fund_code", "code", "fon_kodu", "fonkodu", "kod", "symbol")
                      if k:
                          r = dict(r); r["_tur"] = ad[-4:-1]
                          aday.setdefault(str(k).upper().strip(), r)
                  not_("%s: %d kayit, %d yeni fon" % (ad, len(rs), len(aday) - n0))
              except Exception as e:
                  not_("%s HATA %r" % (ad, e))
          not_("Toplam aday: %d" % len(aday))

          SEC = re.compile(r"NASDAQ|S ?& ?P|SP ?500|STANDARD ?(&|AND) ?POOR")
          OLASI = re.compile(r"AMERIKA|\bABD\b|USA|NYSE|DOW JONES")
          def etiket(ad):
              u = sade(ad)
              nas, sp = "NASDAQ" in u, bool(re.search(r"S ?& ?P|SP ?500|STANDARD", u))
              if nas and sp:
                  return "Karma"
              if nas:
                  return "Nasdaq-100 Teknoloji" if re.search(r"TEKNOLOJI|TECH", u) else "Nasdaq-100"
              return "S&P 500"
          KARSI = {"Nasdaq-100": "ndx", "Nasdaq-100 Teknoloji": "ndx", "S&P 500": "spx", "Tematik": "ndx"}

          HAVUZ = re.compile(r"YABANCI|AMERIKA|\bABD\b|TEKNOLOJI|ENDEKS|\bBYF\b|FON SEPETI")
          DISLA = re.compile(r"SERBEST|BORCLANMA|EUROBOND|PARA PIYASASI|ALTIN|KIYMETLI|KATILIM|COMCEC|ISEDAK|SHARIAH|EMEKLILIK|GAYRIMENKUL|GIRISIM|TURKIYE|BIST|BORSA ISTANBUL|DOVIZ|KARMA|FAIZ|TAHVIL")
          TEMA = re.compile(r"YARI ILETKEN|YAPAY ZEKA|ROBOT|BLOKZINCIR|SIBER|OYUN|SAGLIK|ENERJI|GIDA|TARIM|NASDAQ|S ?& ?P|SP ?500|TEKNOLOJI|\bAMERIKA\b|\bABD\b|YABANCI|KURESEL|GLOBAL|DUNYA|AVRUPA|ASYA|GELISMEKTE|GELISEN")
          TLIST = [(r"YARI ILETKEN", "Yarı iletken"), (r"YAPAY ZEKA", "Yapay zekâ"), (r"ROBOT", "Robotik"), (r"BLOKZINCIR", "Blokzincir"),
                   (r"SIBER", "Siber güvenlik"), (r"OYUN", "Oyun"), (r"SAGLIK|GENETIK|BIYOTEKNOLOJI", "Sağlık"), (r"ENERJI", "Enerji"),
                   (r"GIDA|TARIM", "Tarım"), (r"NASDAQ|S ?& ?P|SP ?500", "Nasdaq / S&P"), (r"TEKNOLOJI", "Teknoloji"),
                   (r"\bAMERIKA\b|\bABD\b", "Amerika"), (r"AVRUPA", "Avrupa"), (r"ASYA|GELISMEKTE|GELISEN", "Gelişen / Asya"),
                   (r"KURESEL|GLOBAL|DUNYA", "Küresel")]
          TEMAAD = {"YARI ILETKEN": "Yarı iletken", "YAPAY ZEKA": "Yapay zekâ", "ROBOT": "Robotik", "BLOKZINCIR": "Blokzincir",
                    "SIBER": "Siber güvenlik", "OYUN": "Oyun", "SAGLIK": "Sağlık", "ENERJI": "Enerji", "GIDA": "Gıda", "TARIM": "Tarım"}
          kodlar, olasi = [], {}
          for k, r in sorted(aday.items()):
              ad = str(al(r, "name", "fund_name", "title") or "")
              if ad and TEMA.search(sade(ad)) and not DISLA.search(sade(ad)):
                  kodlar.append(k)
              elif ad and TEMA.search(sade(ad)) and not DISLA.search(sade(ad)):
                  kodlar.append(k)
              elif ad and OLASI.search(sade(ad)):
                  olasi[k] = ad[:90]
          not_("Nasdaq/S&P adli aday: %d | olasi (secilmeyen Amerika/ABD adli): %d" % (len(kodlar), len(olasi)))

          # ---------------------------------------------------------------- 3) Fon bilgisi, fiyat gecmisi, getiri teyidi
          def ek_olc(seri, bv):
              # 1 hafta, yilbasindan beri, aylik getiriler, fiyat, aylik net nakit akisi (varsa)
              r = {}
              son_t, son = seri[-1]
              r["fiyat"] = round(son, 6)
              h = son_t - datetime.timedelta(days=7)
              on = [(t, v) for t, v in seri if t <= h]
              if on and on[-1][1] and (h - on[-1][0]).days <= 5:
                  r["w1"] = round((son / on[-1][1] - 1) * 100, 2)
              yb = datetime.date(son_t.year - 1, 12, 31)
              on = [(t, v) for t, v in seri if t <= yb]
              if on and on[-1][1] and (yb - on[-1][0]).days <= 10:
                  r["ytd"] = round((son / on[-1][1] - 1) * 100, 2)
              def aysonu(x):
                  d = {}
                  for t, v in x:
                      d[(t.year, t.month)] = v
                  return d
              def onceki_ay(k):
                  return (k[0], k[1] - 1) if k[1] > 1 else (k[0] - 1, 12)
              fa = aysonu(seri)
              aylik = {}
              for k in sorted(fa):
                  o = onceki_ay(k)
                  if o in fa and fa[o]:
                      aylik["%04d-%02d" % k] = round((fa[k] / fa[o] - 1) * 100, 2)
              r["aylik"] = dict(sorted(aylik.items())[-12:])
              if bv:
                  ba = aysonu(bv); nak = {}
                  for k in sorted(ba):
                      o = onceki_ay(k)
                      if o in ba and o in fa and k in fa and fa[o] and ba[o]:
                          nak["%04d-%02d" % k] = round(ba[k] - ba[o] * (fa[k] / fa[o]))
                  if nak:
                      r["nakit"] = dict(sorted(nak.items())[-12:])
              return r

          def fon_isle(kod):
              out = {"k": kod}
              f = bp.Fund(kod)
              info = dict(f.info)
              ad = str(al(info, "name", "fund_name", "title") or al(aday.get(kod, {}), "name", "fund_name", "title") or "")
              ad0 = str(al(aday.get(kod, {}), "name", "fund_name", "title") or ad)
              out.update(ad=ad or ad0, tur=aday.get(kod, {}).get("_tur", "?"), et=etiket(ad0))
              rap = {"a1": sayi(al(info, "return_1m")), "a3": sayi(al(info, "return_3m")), "a6": sayi(al(info, "return_6m")),
                     "y1": sayi(al(info, "return_1y", "return_12m")), "y3": sayi(al(info, "return_3y")), "y5": sayi(al(info, "return_5y"))}
              out.update(buyukluk=sayi(al(info, "fund_size", "size", "portfolio_size")),
                         yatirimci=sayi(al(info, "investor_count", "investors")),
                         vb=sayi(al(info, "buy_valor", "buying_valor")),
                         vs=sayi(al(info, "sell_valor", "selling_valor")),
                         risk=sayi(al(info, "risk_value", "risk")),
                         ucret=sayi(al(info, "management_fee", "fee", "yonetim_ucreti", "annual_fee")),
                         kurucu=str(al(info, "founder", "manager") or "").strip())
              tf = {str(k): str(v)[:40] for k, v in info.items() if "tefas" in str(k).lower() or "durum" in str(k).lower() or "status" in str(k).lower()}
              if tf:
                  out["tefas"] = tf
              tm = TEMA.search(sade(ad0 or ad))
              if tm:
                  un = sade(ad0 or ad)
                  out["tema"] = "Genel yabancı hisse"
                  for rx, lab in TLIST:
                      if re.search(rx, un):
                          out["tema"] = lab; break
              else:
                  out["tema"] = None
              if "OZEL FON" in sade(ad0 or ad) or any(("KAPAL" in sade(v) or sade(v) in ("FALSE", "HAYIR", "0")) for k, v in tf.items() if "tefas" in k.lower()):
                  return dict(out, atla="TEFAS'ta alınamıyor (özel fon / TEFAS'a kapalı)")
              seri, bv = [], []
              bas5 = (datetime.date.today() - datetime.timedelta(days=5 * 366 + 20)).isoformat()
              for donem in ("max", "bas5", "5y", "2y", "1y"):
                  try:
                      df = f.history(start=bas5) if donem == "bas5" else f.history(period=donem)
                      if df is None or len(df) == 0:
                          continue
                      cols = [c for c in df.columns if str(c).lower() in ("price", "fiyat", "close")]
                      col = cols[0] if cols else [c for c in df.columns if str(df[c].dtype).startswith("float")][0]
                      for i, v in df[col].items():
                          t = i.date() if hasattr(i, "date") else datetime.date.fromisoformat(str(i)[:10])
                          if v and v == v:
                              seri.append((t, float(v)))
                      bcols = [c for c in df.columns if any(x in str(c).lower() for x in ("size", "buyukluk", "büyüklük", "portfolio_value", "aum", "total_value"))]
                      if bcols:
                          for i, v in df[bcols[0]].items():
                              t = i.date() if hasattr(i, "date") else datetime.date.fromisoformat(str(i)[:10])
                              if v and v == v:
                                  bv.append((t, float(v)))
                      break
                  except Exception as e:
                      out["gecmis_hata"] = repr(e)[:150]
              seri.sort()
              for (t0, v0), (t1, v1) in zip(seri, seri[1:]):
                  if v0 and (v1 / v0 < 0.6 or v1 / v0 > 1.6):
                      return dict(out, atla="olağandışı fiyat sıçraması (bölünme/tasfiye)", detay=[str(t1), v0, v1])
              if not seri or (datetime.date.today() - seri[-1][0]).days > 10:
                  return dict(out, atla="işleme kapalı (fiyatı güncel değil)")
              if (out.get("buyukluk") or 0) < 10e6:
                  return dict(out, atla="10 milyon TL altı küçük fon")
              kor = korelasyon(seri)
              out["kor"] = kor
              if tm:
                  if re.search(r"\(TL\)|HISSE SENEDI YOGUN|BORSA YATIRIM|ENDEKSI HISSE|BIST", sade(ad0 or ad)) and "YABANCI" not in sade(ad0 or ad):
                      return dict(out, atla="yerli hisse/endeks fonu (tematik yabancı fon değil)")
              elif not kor or max([v for a, v in kor.items() if a in ("ndx", "spx")] or [0]) < 0.80:
                  return dict(out, atla="Nasdaq/S&P ile uyumsuz (getiri korelasyonu düşük)")
              kus = {a: v for a, v in (kor or {}).items() if a in ("ndx", "spx")}
              en = max(kus, key=kus.get) if kus else "ndx"
              u = sade(ad0)
              if tm:
                  out["et"] = "Tematik"
              elif en == "ndx":
                  out["et"] = "Nasdaq-100 Teknoloji" if re.search(r"TEKNOLOJI|TECH", u) else "Nasdaq-100"
              else:
                  out["et"] = "S&P 500"
              hes = {k: donem_getiri(seri, g) for k, g in TUMD.items()}
              son, teyit, celiski = {}, [], []
              for k, g in TUMD.items():
                  a, ar = rap.get(k), getiri_araligi(seri, g)
                  if hes.get(k) is None:
                      continue
                  if a is not None and ar is not None:
                      if ar[0] - 0.5 <= a <= ar[1] + 0.5:
                          son[k] = hes[k]; teyit.append(k)
                      else:
                          celiski.append([k, a, round(ar[0], 2), round(ar[1], 2)])
                  elif a is None:
                      son[k] = hes[k]          # TEFAS bu donemi bildirmediyse fiyat gecmisinden hesaplanan
              if len(seri) >= 2 and seri[-2][1]:
                  son["d1"] = round((seri[-1][1] / seri[-2][1] - 1) * 100, 2); out["d1_tarih"] = str(seri[-1][0])
              out["rk"] = risk_olc(seri)
              try:
                  ek = ek_olc(seri, sorted(bv))
                  for k in ("w1", "ytd"):
                      if ek.get(k) is not None:
                          son[k] = ek.pop(k)
                  out.update(ek)
              except Exception as e:
                  out["ek_hata"] = repr(e)[:150]
              out.update(g=son, teyit=teyit, celiski=celiski, gun=len(seri), son_tarih=str(seri[-1][0]),
                         ilk_tarih=str(seri[0][0]))
              try:
                  wk = haftalik(seri, seri[0][0])
                  if wk[-1][0] != seri[-1][0]:
                      wk.append(seri[-1])      # son nokta her zaman en guncel fiyat
                  SER[kod] = [[str(t), round(v, 6)] for t, v in wk]
              except Exception as e:
                  not_("%s haftalik seri HATA %r" % (kod, e))
              if not [k for k in teyit if k in DON]:
                  out["atla"] = "getirisi teyit edilemeyen"
              return out

          def guvenli(k):
              hata = None
              for d in range(3):
                  try:
                      return fon_isle(k)
                  except Exception as e:
                      hata = e; time.sleep(2 * (d + 1))
              return {"k": k, "atla": "verisi alınamayan: %r" % hata}

          def hepsi(liste, is_say):
              with ThreadPoolExecutor(is_say) as ex:
                  return list(ex.map(guvenli, liste))

          sonuclar = {r["k"]: r for r in hepsi(kodlar, 4)}
          for tur in (1, 2):
              kalan = [k for k, r in sonuclar.items() if str(r.get("atla", "")).startswith("verisi alınamayan")]
              if not kalan:
                  break
              not_("Verisi alinamayan %d fon yeniden denenecek (tur %d)" % (len(kalan), tur))
              time.sleep(30 * tur)
              for r in hepsi(kalan, 2):
                  sonuclar[r["k"]] = r

          fonlar, atlanan = [], {}
          for k in kodlar:
              r = sonuclar[k]
              if r.get("atla"):
                  atlanan.setdefault(r["atla"].split(":")[0], []).append([k, r.get("ad", "")[:70], r.get("kor"), r.get("buyukluk")])
                  continue
              b = BEN.get(KARSI.get(r["et"]))
              r["fark"] = {}
              if b:
                  for p in ("a1", "a3", "a6", "y1"):
                      if r["g"].get(p) is not None and b.get(p) is not None:
                          r["fark"][p] = round(r["g"][p] - b[p], 2)
              fonlar.append(r)

          # TEFAS portfoy dagilimi (varlik turu agirliklari) - kota asimina karsi tek tek, bekleyerek
          def dagilim_al(k):
              hata = None
              for d in range(5):
                  try:
                      recs = kayitlar(bp.Fund(k).allocation)
                      dag = []
                      for r in recs:
                          nm = al(r, "asset_name", "name", "varlik", "asset_type", "type", "asset", "index")
                          w = sayi(al(r, "weight", "percentage", "oran", "value", "pct", "percent"))
                          if nm is not None and w is not None:
                              dag.append([str(nm)[:40], round(w, 2)])
                      return dag
                  except Exception as e:
                      hata = e
                      time.sleep(50 if "429" in repr(e) or "rate" in repr(e).lower() else 5)
              raise hata

          def kapsam(dag):
              yab = sum(w for n, w in dag if n in ("Foreign Stocks", "Foreign ETFs") or ("YABANCI" in sade(n) and ("HISSE" in sade(n) or "ETF" in sade(n))))
              yur = sum(w for n, w in dag if n == "Stocks" or (sade(n) in ("HISSE SENETLERI", "HISSE SENEDI")))
              fkb = sum(w for n, w in dag if n in ("Fund Shares", "ETF Shares", "VC Fund Shares") or "KATILMA" in sade(n))
              if not dag:
                  return None, 0, 0, 0
              if fkb >= 50:
                  k = "Fon sepeti (içeriği başka fonlar)"
              elif yab >= 50 and yur < 10:
                  k = "Yalnızca yabancı hisse"
              elif yab >= 10 and yur >= 10:
                  k = "Karışık (yurt içi + yabancı)"
              elif yur >= 50 and yab < 10:
                  k = "Yurt içi ağırlıklı"
              else:
                  k = "Diğer / karma dağılım"
              return k, round(yab, 1), round(yur, 1), round(fkb, 1)

          for r in fonlar:
              try:
                  dag = dagilim_al(r["k"])
                  r["dagilim"] = dag
                  r["kap"], r["yab"], r["yur"], r["fkb"] = kapsam(dag)
                  if not r["kap"]:
                      r["kap"] = "Dağılım alınamadı"
              except Exception as e:
                  r["kap"] = "Dağılım alınamadı"; r["dagilim_hata"] = repr(e)[:120]
              time.sleep(1.5)
          not_("Portfoy dagilimi alinamayan: %d" % len([r for r in fonlar if r.get("kap") == "Dağılım alınamadı"]))

          # Sirala: once endeks grubu, sonra 1 yil (yoksa 6 ay) getirisi
          def anahtar(r):
              g = r["g"]; return -(g.get("y1") if g.get("y1") is not None else (g.get("a6") if g.get("a6") is not None else -999))
          fonlar.sort(key=lambda r: (r["et"], anahtar(r)))
          not_("Listeye giren: %d | Atlanan: %s" % (len(fonlar), {k: len(v) for k, v in atlanan.items()}))

          simdi = datetime.datetime.now(datetime.timezone.utc)
          veri = {"updatedAt": simdi.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "updated": (simdi + datetime.timedelta(hours=3)).strftime("%Y-%m-%d"),
                  "olcut": BEN, "fonlar": fonlar}
          json.dump({"log": LOG, "atlanan": atlanan, "olasi": olasi, "adaylar": {k: str(al(aday[k], "name", "fund_name", "title"))[:90] for k in kodlar}},
                    open("yabanci-kontrol.json", "w"), indent=1, ensure_ascii=False, default=str)
          if not fonlar or not BEN:
              raise SystemExit("Fon ya da olcut yok; onceki yabanci.json korunuyor (ayrinti: yabanci-kontrol.json).")
          json.dump(veri, open("yabanci.json", "w"), indent=1, ensure_ascii=False, default=str)
          # Tematik fonlarin haftalik fiyat serisi + Nasdaq-100 (TL) haftalik serisi: yabanci.html fon penceresindeki grafik ve analiz icin
          try:
              tk = [r["k"] for r in fonlar if r.get("et") == "Tematik" and len(SER.get(r["k"], [])) >= 3]
              nd = BSER.get("ndx") or []
              wn = haftalik(nd, nd[0][0]) if nd else []
              if wn and wn[-1][0] != nd[-1][0]:
                  wn.append(nd[-1])
              ndh = [[str(t), round(v, 4)] for t, v in wn]
              if tk:
                  json.dump({"guncel": veri["updatedAt"], "bist": ndh, "fon": {k: SER[k] for k in tk}},
                            open("yabanci-seri.json", "w"), separators=(",", ":"), ensure_ascii=False)
                  not_("Haftalik seri: %d fon, olcut %d hafta" % (len(tk), len(ndh)))
          except Exception as e:
              not_("Haftalik seri yazilamadi %r" % e)
          PY

      - name: Kaydet
        run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          for f in yabanci.json yabanci-kontrol.json yabanci-seri.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Yabanci fon verisi"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
