name: Borclanma fonlari

on:
  schedule:
    - cron: "57 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: borclanma
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli paketler
        run: pip install borsapy 2>&1 | tail -1

      - name: Fonlari tara
        run: python3 borclanma_tara.py

      - name: Kaydet
        if: always()
        run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          for f in borclanma.json borclanma-kontrol.json borclanma-gecmis.json borclanma-seri.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Borclanma fon verisi"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1

      - name: Zamanlamayi canli tut
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable borclanma.yml --repo "$GITHUB_REPOSITORY"
