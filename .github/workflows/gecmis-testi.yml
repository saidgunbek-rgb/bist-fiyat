# TEST: Son 1 yilin gunluk kapanis fiyatlarini birden fazla kaynaktan ceker,
# gun gun karsilastirir ve sonucu gecmis-test.json dosyasina yazar.
# Panel ve fiyat sistemine dokunmaz. Elle calistirilir (Run workflow).
name: Gecmis veri testi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HISSELER: "THYAO,AKBNK"
    steps:
      - uses: actions/checkout@v4

      - name: borsapy kur
        continue-on-error: true
        run: pip install borsapy 2>&1 | tail -1

      - name: Gecmis fiyatlari karsilastir
        run: |
          python3 - <<'PY'
          import json, os, time, datetime, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}
          KODLAR = [k.strip().upper() for k in os.environ["HISSELER"].split(",") if k.strip()]
          bugun = (datetime.datetime.utcnow() + datetime.timedelta(hours=3)).date()
          bas = bugun - datetime.timedelta(days=372)
          BAS = bas.strftime("%Y-%m-%d")

          def get(url):
              r = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=40)
              return json.load(r)

          def sayi(x):
              try:
                  x = float(x)
              except Exception:
                  return None
              return x if x == x and x > 0 else None

          # ---- Kaynak 1: Is Yatirim (Borsa Istanbul verisi, TL). 90 gunluk parcalarla
          def isyatirim(kod):
              out, d = {}, bas
              while d <= bugun:
                  e = min(d + datetime.timedelta(days=90), bugun)
                  u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/HisseTekil"
                       "?hisse=%s&startdate=%s&enddate=%s") % (kod, d.strftime("%d-%m-%Y"), e.strftime("%d-%m-%Y"))
                  for x in (get(u).get("value") or []):
                      try:
                          t = datetime.datetime.strptime(x["HGDG_TARIH"], "%d-%m-%Y").strftime("%Y-%m-%d")
                      except Exception:
                          continue
                      c = sayi(x.get("HGDG_KAPANIS"))
                      if c:
                          out[t] = {"c": c, "lo": sayi(x.get("HGDG_MIN")), "hi": sayi(x.get("HGDG_MAX"))}
                  d = e + datetime.timedelta(days=1)
                  time.sleep(1)
              return out

          # ---- Kaynak 2: Yahoo (+ bolunme/bedelsiz kayitlari)
          def yahoo(kod):
              u = ("https://query1.finance.yahoo.com/v8/finance/chart/%s.IS?range=2y&interval=1d&events=split" % kod)
              r = get(u)["chart"]["result"][0]
              off = r["meta"].get("gmtoffset", 10800)
              q = r["indicators"]["quote"][0]
              out = {}
              for i, t in enumerate(r.get("timestamp") or []):
                  c = sayi(q["close"][i])
                  if not c:
                      continue
                  d = datetime.datetime.utcfromtimestamp(t + off).strftime("%Y-%m-%d")
                  if d >= BAS:
                      out[d] = {"c": round(c, 2), "lo": sayi(q["low"][i]), "hi": sayi(q["high"][i])}
              bol = []
              for v in ((r.get("events") or {}).get("splits") or {}).values():
                  d = datetime.datetime.utcfromtimestamp(v.get("date", 0) + off).strftime("%Y-%m-%d")
                  bol.append({"tarih": d, "oran": v.get("splitRatio")})
              return out, sorted(bol, key=lambda b: b["tarih"])

          # ---- Kaynak 3: borsapy
          def borsapy_gecmis(kod):
              import borsapy as bp
              df = bp.Ticker(kod).history(period="1y")
              out = {}
              for idx, row in df.iterrows():
                  c = sayi(row.get("Close"))
                  d = str(idx)[:10]
                  if c and d >= BAS:
                      out[d] = {"c": round(c, 2)}
              return out

          # ---- Kaynak 4: kendi kaydimiz (fiyat sistemi her aksam yazar, 12 Ekim'den beri)
          def kendi_kayit(kod):
              out = {}
              try:
                  gunler = json.load(open("prices.json")).get("days", {})
              except Exception:
                  return out
              for d, g in gunler.items():
                  c = sayi(((g or {}).get("p") or {}).get(kod))
                  if c:
                      out[d] = {"c": c}
              return out

          def esit(a, b):
              return abs(a - b) <= max(0.011, 0.002 * max(a, b))

          rapor = {"tarih": bugun.strftime("%Y-%m-%d"), "aralik": [BAS, bugun.strftime("%Y-%m-%d")], "hisseler": {}}

          for kod in KODLAR:
              kaynaklar, hatalar, bolunmeler = {}, [], []
              for ad, fn in (("isyatirim", isyatirim), ("yahoo", yahoo), ("borsapy", borsapy_gecmis), ("kendi_kayit", kendi_kayit)):
                  try:
                      sonuc = fn(kod)
                      if ad == "yahoo":
                          sonuc, bolunmeler = sonuc
                      kaynaklar[ad] = sonuc
                  except Exception as e:
                      kaynaklar[ad] = {}
                      hatalar.append("%s: %s" % (ad, e))
                      print("HATA", kod, ad, e)

              ana = ("isyatirim", "yahoo")
              tarihler = sorted(set(kaynaklar["isyatirim"]) | set(kaynaklar["yahoo"]))
              say = {"toplam_gun": 0, "ilk_iki_kaynak_uyustu": 0, "ek_kaynakla_cozuldu": 0,
                     "cozulemedi": 0, "tek_kaynak_vardi": 0}
              farklar, oranlar = [], []

              for d in tarihler:
                  say["toplam_gun"] += 1
                  deg = {ad: kaynaklar[ad][d]["c"] for ad in kaynaklar if d in kaynaklar[ad]}
                  # gunun en dusuk/en yuksek araligi: Is Yatirim, yoksa Yahoo
                  ref = kaynaklar["isyatirim"].get(d) or kaynaklar["yahoo"].get(d) or {}
                  lo, hi = ref.get("lo"), ref.get("hi")

                  def aralikta(v):
                      return not (lo and hi) or (lo - 0.011 <= v <= hi + 0.011)

                  a, b = deg.get("isyatirim"), deg.get("yahoo")
                  if a and b and esit(a, b) and aralikta(a):
                      say["ilk_iki_kaynak_uyustu"] += 1
                      continue

                  # Ek kaynaklarla cogunluk ara (en az 2 kaynak ayni degeri vermeli, gun araligi icinde olmali)
                  en_iyi, destek = None, []
                  for ad, v in deg.items():
                      uyan = [x for x, w in deg.items() if esit(v, w)]
                      if len(uyan) > len(destek) and aralikta(v):
                          en_iyi, destek = v, uyan
                  if en_iyi is not None and len(destek) >= 2:
                      say["ek_kaynakla_cozuldu"] += 1
                      durum = "cozuldu"
                      secilen = deg.get("isyatirim") if "isyatirim" in destek else en_iyi
                  elif len(deg) < 2:
                      say["tek_kaynak_vardi"] += 1
                      durum, secilen, destek = "tek_kaynak", None, []
                  else:
                      say["cozulemedi"] += 1
                      durum, secilen = "cozulemedi", None
                  if a and b:
                      oranlar.append((d, round(a / b, 4)))
                  if len(farklar) < 80:
                      farklar.append({"tarih": d, "degerler": deg, "durum": durum,
                                      "secilen": secilen, "uyusan_kaynaklar": sorted(destek),
                                      "gun_araligi": [lo, hi]})

              # Ayni oranla suren farklar: genelde bedelsiz/bolunme duzeltmesi farkidir (veri hatasi degil)
              bloklar = []
              for d, r in oranlar:
                  if bloklar and abs(bloklar[-1]["oran"] - r) <= 0.003:
                      bloklar[-1]["bitis"] = d
                      bloklar[-1]["gun"] += 1
                  else:
                      bloklar.append({"baslangic": d, "bitis": d, "oran": r, "gun": 1})
              bloklar = [x for x in bloklar if x["gun"] >= 3]

              rapor["hisseler"][kod] = {
                  "ozet": say,
                  "kaynak_gun_sayisi": {ad: len(v) for ad, v in kaynaklar.items()},
                  "yahoo_bolunme_bedelsiz": bolunmeler,
                  "sabit_oranli_fark_bloklari": bloklar,
                  "farkli_gunler": farklar,
                  "hatalar": hatalar,
              }
              print(kod, json.dumps(say, ensure_ascii=False), "kaynaklar:",
                    {ad: len(v) for ad, v in kaynaklar.items()})

          json.dump(rapor, open("gecmis-test.json", "w"), ensure_ascii=False, indent=1)
          print("Rapor yazildi: gecmis-test.json")
          PY

      - name: Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add gecmis-test.json
          git commit -m "gecmis veri testi" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
