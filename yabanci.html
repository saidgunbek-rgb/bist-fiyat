<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#12131c">
<title>Nasdaq / S&amp;P fonları</title>
<style>
:root{--bg:#12131c;--card:#1b1d2a;--card2:#242739;--mut:#9a9ab0;--tx:#e6e6ee;--g:#4ade80;--y:#facc15;--r:#f87171;--p:#8b7cf6;--ln:#3a3d55}
*{box-sizing:border-box}body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font-family:Roboto,Arial,sans-serif;padding:16px}
a{color:var(--p);text-decoration:none}
h1{font-size:23px;margin:4px 0 2px;background:linear-gradient(90deg,#8b7cf6,#f0957a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:var(--mut);margin-bottom:12px;line-height:1.5}
.warn{background:#3a2a14;color:#fcd9a0;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:12px}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.flt button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:20px;background:var(--card2);color:var(--mut);border:1px solid transparent}
.flt button.on{background:rgba(139,124,246,.2);color:var(--p);border-color:var(--p);font-weight:700}
.bx{background:var(--card);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--mut);line-height:1.5}
.bx b{color:var(--tx)}
.it{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.ust{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ust b{font-size:16px}.ust small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.35}
.pn{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(139,124,246,.18);color:var(--p);white-space:nowrap}
.met{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 6px;font-size:11.5px;color:var(--mut)}
.met b{display:block;font-size:13.5px;color:var(--tx)}.met i{font-style:normal;font-size:10.5px}
.up{color:var(--g)!important}.dn{color:var(--r)!important}
.alt{font-size:12px;color:var(--mut);line-height:1.5}
.ok{color:var(--g);font-weight:700}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 2px 8px;padding-bottom:6px;border-bottom:1px solid var(--ln)}.bh b{font-size:16px}.bh small{color:var(--mut);font-size:12px}
.fs{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:9px 11px;margin-bottom:6px;cursor:pointer}.fn{width:16px;color:var(--mut);font-size:12px}.fk{flex:1;font-size:14px}.fk small{color:var(--p);font-weight:700;font-size:11.5px}.fv{font-weight:700;font-size:14px}.fp{font-size:12px;color:var(--mut);min-width:28px;text-align:right}
.dh{font-size:13.5px;font-weight:700;margin:12px 2px 6px}.dh small{font-weight:400;color:var(--mut);font-size:11.5px}
#pop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;padding:16px;align-items:center;justify-content:center}
#pop.on{display:flex}
.pk{position:relative;width:100%;max-width:520px;max-height:85vh;overflow:auto;background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:14px 12px 12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.pk .it{margin:0}
.pk .ust{padding-right:38px}
.px{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);font-size:15px;z-index:2}
.pkap{display:block;width:100%;margin-top:10px;padding:10px;border-radius:12px;border:0;background:var(--p);color:#fff;font:inherit;font-weight:700}
.fs2{display:block}
.fst{display:flex;align-items:center;gap:8px}
.sg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px;padding-top:7px;border-top:1px solid #2c2f44}
.sc{text-align:center;border-radius:7px;padding:3px 0}
.sc i{display:block;font-style:normal;font-size:10px;color:var(--mut);margin-bottom:2px}
.sc b{display:block;font-size:11.5px;font-weight:700;letter-spacing:-.2px}
.sc.hl{background:rgba(139,124,246,.16)}
.sc.hl i{color:var(--p);font-weight:700}
.gfw{background:#1b1d29;border:1.5px solid #3c3f58;border-radius:14px;padding:10px 11px;margin-bottom:9px}.gfh{font-size:13px;font-weight:700;margin-bottom:6px;padding-right:34px}.gar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.gab{background:var(--card2);color:var(--mut);border:1px solid transparent;border-radius:8px;padding:4px 8px;font:inherit;font-size:12px}.gab.on{border-color:var(--p);color:var(--p)}
.daha{display:block;width:100%;font:inherit;font-weight:700;padding:10px;border-radius:12px;border:1px dashed var(--ln);background:none;color:var(--p);margin:4px 0 12px}

/* Cerceve: butun fonlar ayni sade gri cerceve icinde */
.fs{border:1.5px solid #3c3f58;margin-bottom:9px;padding:11px 12px;background:#1b1d29}
.fs:active{border-color:var(--p)}
.it{border:1.5px solid #3c3f58;background:#1b1d29}
.bh{margin-top:22px}
.fa{margin-top:12px}.fah{font-size:16px;font-weight:700;margin:0 2px 8px;color:var(--p)}
.fak{border-radius:14px;padding:10px 11px;margin-bottom:9px;border:1px solid}.fat{font-size:14px;font-weight:700;margin-bottom:6px}.fat small{font-weight:400;color:var(--mut);font-size:11.5px}
.k2{background:rgba(139,124,246,.08);border-color:rgba(139,124,246,.3)}.k3{background:rgba(38,166,154,.08);border-color:rgba(38,166,154,.32)}.k4{background:rgba(245,185,66,.08);border-color:rgba(245,185,66,.32)}
.fatb{width:100%;border-collapse:collapse;font-size:12.5px}.fatb td,.fatb th{padding:5px 3px;text-align:right;border-bottom:1px solid var(--ln)}.fatb th{color:var(--mut);font-weight:400}.fatb td:first-child,.fatb th:first-child{text-align:left}
.far{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--ln)}.far:last-child{border:0}.far b{text-align:right}.far i{font-style:normal;color:var(--mut);font-weight:400}
.fan{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.45}
.fag{display:inline-block;border-radius:8px;padding:3px 9px;font-weight:700;font-size:12.5px;margin-bottom:6px;border:1px solid}.fag.up{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.4)}.fag.dn{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.4)}.fag.uy{color:#fbbf24;background:rgba(245,185,66,.12);border-color:rgba(245,185,66,.45)}
.ftb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.ftb button{font:inherit;text-align:left;padding:11px 12px;border-radius:14px;background:var(--card);color:var(--tx);border:1px solid var(--ln);display:flex;flex-direction:column;gap:3px}
.ftb button b{font-size:14px}.ftb button small{color:var(--mut);font-size:11.5px}
.fsek,.fbar{display:none}
#app.facik>*{display:none}#app.facik>.fsek.ac{display:block}
#app.facik>.fbar{display:flex;position:sticky;top:0;z-index:30;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;margin:0 0 6px;background:var(--bg);border-bottom:1px solid var(--ln)}
.fbar b{font-size:17px}.fbar button{font:inherit;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;background:transparent;color:var(--r,#ef5350);border:1px solid var(--r,#ef5350)}
.fsek>.bh:first-child{margin-top:4px}
</style><script>/* Cevrimdisi destek (sw.js): internet yokken en son kaydedilen veriler, kayit zamaniyla birlikte gosterilir */
(function(){if("serviceWorker"in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
var of=window.fetch;if(!of)return;var gos=0;
function bant(t){if(gos||window.top!==window)return;gos=1;var z=t&&t.length>15?new Date(t):null,y=z&&!isNaN(z)?("0"+z.getDate()).slice(-2)+"."+("0"+(z.getMonth()+1)).slice(-2)+"."+z.getFullYear()+" "+("0"+z.getHours()).slice(-2)+":"+("0"+z.getMinutes()).slice(-2):"";
 function ek(){var d=document.createElement("div");d.id="cvd";d.style.cssText="background:#3a2f12;color:#ffd27a;border:1px solid #6b5520;border-radius:10px;padding:8px 12px;margin:8px;font:13px/1.45 system-ui,-apple-system,sans-serif";d.textContent="📴 İnternet yok · "+(y?y+" tarihinde kaydedilen":"en son kaydedilen")+" veriler gösteriliyor. İnternet gelince sayfayı yenile.";document.body.insertBefore(d,document.body.firstChild);}
 if(document.body)ek();else document.addEventListener("DOMContentLoaded",ek);}
window.fetch=function(){return of.apply(this,arguments).then(function(r){try{var k=r.headers.get("x-onbellek");if(k)bant(k);}catch(e){}return r;});};})();</script>
</head><body>
<div><a href="index.html">‹ Panele dön</a></div>
<h1>Nasdaq / S&amp;P fonları</h1>
<div class="sub" id="sub">Nasdaq ve S&amp;P 500 içerikli TEFAS fonları</div>
<div id="msg"></div><div id="app"></div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function yz(x){return x==null?"—":(x>=0?"+":"−")+"%"+Math.abs(x).toFixed(x!==0&&Math.abs(x)<1?2:1).replace(".",",");}
function puan(x){return x==null?"—":(x>=0?"+":"−")+Math.abs(x).toFixed(1).replace(".",",")+" puan";}
function para(v){if(!(v>0))return"—";if(v>=1e9)return(v/1e9).toFixed(1).replace(".",",")+" milyar TL";if(v>=1e6)return Math.round(v/1e6)+" milyon TL";return Math.round(v).toLocaleString("tr-TR")+" TL";}
function adet(v){if(!(v>0))return"—";if(v>=1e3)return(v/1e3).toFixed(v>=1e4?0:1).replace(".",",")+" bin";return String(Math.round(v));}
function trD(s){var p=String(s||"").slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s;}
var D=null,GRP=sg("yab-grp","Hepsi"),SIRA=sg("yab-sira","y1");
function sg(k,v){try{return localStorage.getItem(k)||v;}catch(e){return v;}}
function ss(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var SUT=[["d1","1 gün"],["a1","1 ay"],["a3","3 ay"],["a6","6 ay"],["y1","1 yıl"],["y3","3 yıl"],["y5","5 yıl"]];
var SRT=[["y1","1 yıl"],["a6","6 ay"],["a3","3 ay"],["yakin","Ölçüte yakın"],["ucret","Düşük ücret"],["buyuk","Büyüklük"]];
var KARSI={"Nasdaq-100":"ndx","Nasdaq-100 Teknoloji":"ndx","S&P 500":"spx"};
function grup(f){return f.et==="S&P 500"?"S&P 500":(f.et==="Karma"?"Diğer":"Nasdaq");}
function deger(f,s){var g=f.g||{};
  if(s==="yakin"){var x=f.fark&&f.fark.y1!=null?f.fark.y1:(f.fark&&f.fark.a6);return x==null?-1e9:-Math.abs(x);}
  if(s==="ucret")return f.ucret==null?-1e9:-f.ucret;
  if(s==="buyuk")return f.buyukluk||-1;
  return g[s]==null?-1e9:g[s];}
function satir(f,hl){var g='';SUT.forEach(function(s){var x=f.g[s[0]];g+='<div class="sc'+(s[0]===hl?' hl':'')+'"><i>'+s[1]+'</i><b class="'+(x==null?"":(x>=0?"up":"dn"))+'">'+yz(x)+'</b></div>';});return g;}
function kart(f,i,kisa){
  var fr=f.fark||{},ol=D.olcut[KARSI[f.et]],fk="";
  if(ol){var p=fr.y1!=null?["1 yıl",fr.y1]:(fr.a6!=null?["6 ay",fr.a6]:(fr.a3!=null?["3 ay",fr.a3]:null));
    if(p)fk='<div class="alt" style="margin-top:6px">'+p[0]+': '+esc(ol.ad)+' ölçütünün <b class="'+(p[1]>=0?"up":"dn")+'">'+puan(Math.abs(p[1]))+'</b> '+(p[1]>=0?"önünde":"gerisinde")+' <small>(dolar/TL dahil)</small></div>';}
  else if(f.et==="Karma"||f.et==="Nasdaq-100 Teknoloji")fk='';
  return'<div class="it"><div class="ust"><span><b>'+esc(f.k)+'</b> <span style="font-size:12px;color:var(--p);font-weight:700">'+esc(f.et)+'</span><small>'+esc(f.ad)+'</small></span><span class="pn">'+(i!=null?"#"+(i+1):"")+'</span></div>'
   +'<div class="sg" style="grid-template-columns:repeat(7,1fr)">'+satir(f,SIRA==="a6"?"a6":SIRA==="a3"?"a3":"y1")+'</div>'+fk
   +(kisa?'':'<div class="alt" style="margin-top:6px">Büyüklük <b style="color:var(--tx)">'+para(f.buyukluk)+'</b> · '+adet(f.yatirimci)+' yatırımcı'+(f.risk?' · Risk '+f.risk+'/7':'')+(f.ucret!=null?' · Yönetim ücreti %'+String(f.ucret).replace(".",","):'')+(f.kurucu?'<br>'+esc(f.kurucu):'')+'</div>')+'</div>';}
function oneCik(F){
  // Olcut: en az 1 yillik gecmis, 50 milyon TL ve uzeri buyukluk, 1 yillik getirisi teyitli; grup icinde 1 yil getiriye gore ilk 3
  var el=F.filter(function(f){return f.gun>=250&&(f.buyukluk||0)>=50e6&&f.g.y1!=null;}),h='';
  [["Nasdaq","Nasdaq"],["S&P 500","S&P 500"]].forEach(function(G){
    var L=el.filter(function(f){return grup(f)===G[0];}).sort(function(a,b){return b.g.y1-a.g.y1;}).slice(0,3);
    h+='<div class="dh">'+G[1]+' içerikli fonlar · en iyi '+Math.max(L.length,0)+' <small>1 yıl TL getirisine göre</small></div>';
    if(!L.length)h+='<div class="alt" style="margin:0 2px 8px">Ölçütleri sağlayan fon yok.</div>';
    L.forEach(function(f,i){h+=kart(f,i,false);});});
  return h;}
function ciz(){
  var F=D.fonlar.slice(),h='';
  h+='<div class="bx"><b>Ölçüt (TL’ye çevrilmiş)</b>';
  ["ndx","spx"].forEach(function(k){var o=D.olcut[k];if(o)h+='<br>'+esc(o.ad)+' · 1 ay <b>'+yz(o.a1)+'</b> · 3 ay <b>'+yz(o.a3)+'</b> · 6 ay <b>'+yz(o.a6)+'</b> · 1 yıl <b>'+yz(o.y1)+'</b>'+(o.y3!=null?' · 3 yıl <b>'+yz(o.y3)+'</b>':'');});
  h+='<br><span style="font-size:11.5px">Endeks getirisi dolar/TL ile çarpılarak TL’ye çevrilir; iki bağımsız kaynaktan teyit edilir, tutmayan dönem boş kalır. Fiyat endeksidir (temettü dahil değil). Fonlar kendi fiyatlarını bir gün geriden açıklayabilir.</span></div>';
  h+='<div class="bh"><span><b>⭐ Öne çıkanlar</b></span><span class="alt">kriterler altta</span></div>';
  h+='<div class="alt" style="margin:-2px 2px 4px">Kriter: en az 1 yıllık geçmiş · 50 milyon TL ve üzeri büyüklük · 1 yıllık getirisi fiyat geçmişiyle teyitli. Sıralama yalnızca geçmiş 1 yıl getirisine göredir.</div>';
  h+=oneCik(F);
  h+='<div class="bh"><span><b>🌎 Bütün fonlar</b> <small>'+F.length+' fon</small></span></div>';
  h+='<div class="flt" id="grp">'+["Hepsi","Nasdaq","S&P 500","Diğer"].map(function(g){return'<button data-g="'+esc(g)+'"'+(GRP===g?' class="on"':'')+'>'+esc(g)+'</button>';}).join("")+'</div>';
  h+='<div class="flt" id="srt">'+SRT.map(function(s){return'<button data-s="'+s[0]+'"'+(SIRA===s[0]?' class="on"':'')+'>'+s[1]+'</button>';}).join("")+'</div>';
  var L=F.filter(function(f){return GRP==="Hepsi"||grup(f)===GRP;}).sort(function(a,b){return deger(b,SIRA)-deger(a,SIRA);});
  L.forEach(function(f,i){h+=kart(f,i,false);});
  var at=D.atlanan_sayi||{};
  h+='<div class="alt" style="margin-top:8px">Fonlar TEFAS’taki bütün fonlar arasından adında Nasdaq ya da S&amp;P geçenlerdir; getiriler TEFAS verisidir ve fonun günlük fiyatlarından ayrıca hesaplanarak teyit edilir. 10 milyon TL altı, işleme kapalı ve getirisi teyit edilemeyen fonlar dahil değildir. Fon getirisi ile ölçüt arasındaki fark yönetim ücreti, kur ve fiyat gecikmesinden de kaynaklanır. Geçmiş getiri gelecek getirinin garantisi değildir; bu sayfa al/sat önerisi değildir, karar sana aittir.</div>';
  document.getElementById("app").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#grp button"),function(b){b.onclick=function(){GRP=b.getAttribute("data-g");ss("yab-grp",GRP);ciz();};});
  Array.prototype.forEach.call(document.querySelectorAll("#srt button"),function(b){b.onclick=function(){SIRA=b.getAttribute("data-s");ss("yab-sira",SIRA);ciz();};});}
fetch("yabanci.json?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){D=d;
  document.getElementById("sub").innerHTML="Nasdaq ve S&amp;P 500 içerikli TEFAS fonları · "+d.fonlar.length+" fon · son tarama "+trD(d.updated);ciz();})
 .catch(function(){document.getElementById("msg").innerHTML='<div class="warn">Veri henüz hazır değil. GitHub’daki “Yabanci fonlar” çalışması ilk kez bittikten sonra burada görünecek.</div>';});
</script>
