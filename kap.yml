# KAP bildirimlerini ve bilancolari otomatik okur, kurala dayali Turkce yorum yazar (karne.json).
# Hafta ici 08:17-20:17 arasi her 2 saatte bir, hafta sonu gunde bir kez calisir. Ucretsizdir (GitHub Actions).
# Yorumlar kural tabanlidir: bildirim turu, bildirimdeki tutarlar ve bilanco rakamlari karsilastirilir.
# Takip edilen hisseler karne.yml ile ayni olmali (KARNE satiri).
name: KAP ve bilanco yorumu

on:
  schedule:
    - cron: "17 5-17/2 * * 1-5"   # hafta ici 08:17, 10:17 ... 20:17 (Turkiye saati)
    - cron: "17 9 * * 0,6"        # hafta sonu 12:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karne-veri
  cancel-in-progress: false

jobs:
  yorum:
    runs-on: ubuntu-latest
    env:
      KARNE: "AKBNK,THYAO"
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli paketler
        continue-on-error: true
        run: pip install borsapy pypdf 2>&1 | tail -1

      - name: KAP bildirimleri ve bilanco yorumu
        run: |
          python3 - <<'PY'
          import json, os, re, time, datetime, subprocess, urllib.request, urllib.parse, html as htmlmod
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
                "Accept-Language": "tr-TR,tr;q=0.9"}
          kodlar = [k.strip().upper() for k in os.environ["KARNE"].split(",") if k.strip()]
          simdi_tr = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=3)
          BUGUN = simdi_tr.strftime("%Y-%m-%d")
          karne = json.load(open("karne.json"))
          try:
              eski = json.loads(subprocess.check_output(["git", "show", "HEAD:karne.json"])).get("stocks", {})
          except Exception:
              eski = {}
          log = {"updatedAt": simdi_tr.strftime("%Y-%m-%d %H:%M"), "hisseler": {}}
          BANKALAR = {"AKBNK", "GARAN", "ISCTR", "YKBNK", "HALKB", "VAKBN", "TSKB", "ALBRK", "SKBNK", "QNBFB", "ICBCT"}

          def iste(url, data=None, h=None, ham=False):
              hd = dict(UA); hd.update(h or {})
              b = urllib.request.urlopen(urllib.request.Request(url, data=data, headers=hd), timeout=40).read()
              return b if ham else b.decode("utf-8", "replace")

          def sayi(x):
              try:
                  x = float(x)
              except Exception:
                  return None
              return x if x == x else None

          def norm(s):
              s = str(s or "").lower()
              for a, b in (("ı", "i"), ("İ", "i"), ("i̇", "i"), ("ş", "s"), ("ğ", "g"), ("ü", "u"), ("ö", "o"), ("ç", "c"), ("â", "a"), ("î", "i")):
                  s = s.replace(a, b)
              return s

          def para(x):
              """Turkce okunur tutar: 1,7 milyar TL"""
              if x is None:
                  return "-"
              a = abs(x)
              if a >= 1e9:
                  t = "%.1f milyar" % (a / 1e9)
              elif a >= 1e6:
                  t = "%.1f milyon" % (a / 1e6)
              else:
                  t = "%.0f" % a
              return ("-" if x < 0 else "") + t.replace(".", ",") + " TL"

          def yuzde(x, isaret=False):
              t = ("%.1f" % abs(x)).replace(".", ",")
              return ("+" if x >= 0 else "-") + "%" + t if isaret else "%" + t

          def son_kur():
              try:
                  g = json.load(open("prices.json")).get("days", {})
                  for d in sorted(g, reverse=True):
                      if g[d].get("u") and g[d].get("e"):
                          return g[d]["u"], g[d]["e"]
              except Exception:
                  pass
              return None, None
          USD, EUR = son_kur()

          def enflasyon():
              """Yillik TUFE (%): once borsapy, sonra TCMB sayfasi, olmazsa onceki deger."""
              try:
                  import borsapy as bp
                  o = bp.Inflation()
                  for ad in [a for a in dir(o) if not a.startswith("_")]:
                      if not re.search(r"(?i)tufe|cpi|latest|son", ad):
                          continue
                      try:
                          v = getattr(o, ad)
                          v = v() if callable(v) else v
                      except Exception:
                          continue
                      if hasattr(v, "columns") and len(v):
                          for c in v.columns:
                              if re.search(r"(?i)yill|annual|yoy|yearly", str(c)):
                                  sira = v.sort_index()
                                  x = sayi(sira[c].dropna().iloc[-1])
                                  if x and 0 < x < 200:
                                      return round(x, 2), "borsapy:%s" % ad
                      if isinstance(v, dict):
                          for kk, x in v.items():
                              if re.search(r"(?i)yill|annual|yoy|yearly", str(kk)) and sayi(x) and 0 < sayi(x) < 200:
                                  return round(sayi(x), 2), "borsapy:%s" % ad
              except Exception as e:
                  print("Enflasyon borsapy HATA", e)
              try:
                  s_ = iste("https://www.tcmb.gov.tr/wps/wcm/connect/TR/TCMB+TR/Main+Menu/Istatistikler/Enflasyon+Verileri/Tuketici+Fiyatlari")
                  m = re.search(r"(\d{2}-\d{4})\s*</td>\s*<td[^>]*>\s*([\d]+[.,]\d+)", s_)
                  if m:
                      x = float(m.group(2).replace(",", "."))
                      if 0 < x < 200:
                          return x, "tcmb:%s" % m.group(1)
              except Exception as e:
                  print("Enflasyon TCMB HATA", e)
              o = karne.get("enf") or {}
              return (o.get("y"), "onceki") if o.get("y") else (None, "yok")

          ENF, ENF_KAYNAK = enflasyon()
          if ENF:
              karne["enf"] = {"y": ENF, "k": ENF_KAYNAK, "t": BUGUN}

          def reel(d):
              """Nominal TL buyumesini enflasyondan arindirir (yaklasik)."""
              return None if d is None or not ENF else ((1 + d / 100) / (1 + ENF / 100) - 1) * 100

          def kisa(ad, d):
              r = reel(d)
              if r is None:
                  return "%s %s %s" % (ad, yuzde(d), "arttı" if d >= 0 else "azaldı")
              return "%s reel olarak %s %s" % (ad, yuzde(r), "arttı" if r >= 0 else "azaldı")

          def buyume_metni(d):
              r = reel(d)
              return "" if r is None else ", enflasyondan arındırınca yaklaşık %s" % yuzde(r, True)

          # =====================================================================
          # 1) BILANCO YORUMU (Is Yatirim mali tablolari, kural tabanli)
          # =====================================================================
          def mali_tablo(kod, grup, donemler):
              q = "".join("&year%d=%d&period%d=%d" % (i + 1, y, i + 1, p) for i, (y, p) in enumerate(donemler))
              u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/MaliTablo"
                   "?companyCode=%s&exchange=TRY&financialGroup=%s%s&_=%d") % (kod, grup, q, int(time.time() * 1000))
              rows = []
              for x in (json.loads(iste(u)).get("value") or []):
                  rows.append({"c": x.get("itemCode"), "a": norm(x.get("itemDescTr")).strip(),
                               "v": [sayi(x.get("value%d" % i)) for i in (1, 2, 3, 4)]})
              return rows

          def bul(rows, kodlar_=(), desen=None, topla=False):
              for r in rows:
                  if r["c"] in kodlar_:
                      return r["v"]
              if desen:
                  es = [r for r in rows if re.search(desen, r["a"])]
                  if not es:
                      return None
                  if topla:
                      return [sum((r["v"][i] or 0) for r in es) for i in range(4)]
                  return es[0]["v"]
              return None

          CEYREK = {3: "Ocak-Mart", 6: "Nisan-Haziran", 9: "Temmuz-Eylül", 12: "Ekim-Aralık"}

          def degisim(a, b):
              return None if a is None or b is None or b == 0 else (a / b - 1) * 100 * (1 if b > 0 else -1)

          def son_donem_bul(kod, chk):
              if chk.get("y") and chk.get("p") and chk.get("grup"):
                  return chk["grup"], chk["y"], chk["p"]
              now = datetime.date.today()
              for grup in ("XI_29", "UFRS"):
                  for y in (now.year, now.year - 1):
                      for p in (12, 9, 6, 3):
                          if (y, p) > (now.year, (now.month - 2) // 3 * 3):
                              continue
                          rows = mali_tablo(kod, grup, [(y, p), (y, p), (y, p), (y, p)])
                          v = bul(rows, ("3Z",))
                          if v and v[0]:
                              return grup, y, p
              return None

          def bilanco_yorumu(kod, st):
              chk = st.get("chk") or {}
              sd = son_donem_bul(kod, chk)
              if not sd:
                  return None, None
              grup, y, p = sd
              onc = (y, p - 3) if p > 3 else None
              donem = [(y, p), onc or (y, p), (y - 1, p), ((y - 1, p - 3) if onc else (y - 1, p))]
              rows = mali_tablo(kod, grup, donem)
              banka = kod in BANKALAR or any("net faiz geliri" in r["a"] for r in rows)
              M, puan = [], 0

              def satir(metin, p_, k=""):
                  nonlocal puan
                  M.append({"t": metin, "p": p_, "k": k}); puan += p_

              def ceyrek(v):  # son ceyrek ve gecen yilin ayni ceyregi
                  if not v:
                      return None, None
                  if not onc:
                      return v[0], v[2]
                  if None in (v[0], v[1], v[2], v[3]):
                      return None, None
                  return v[0] - v[1], v[2] - v[3]

              net = bul(rows, ("3Z",), r"ana ortaklik paylari|net donem kari")
              ozk = bul(rows, ("2O",), r"ozkaynaklar")
              if not net or net[0] is None:
                  return None, rows
              if banka:
                  nfg = bul(rows, (), r"net faiz geliri")
                  kom = bul(rows, (), r"net ucret ve komisyon")
                  kre = bul(rows, (), r"(^|\s|\.)krediler$")
                  mev = bul(rows, (), r"(^|\s|\.)mevduat$")
                  for ad, v, esik in (("Net kâr", net, (15, -10)), ("Net faiz geliri", nfg, (15, -10)),
                                      ("Net ücret ve komisyon gelirleri", kom, (15, -5))):
                      if v and v[0] is not None and v[2]:
                          d = degisim(v[0], v[2])
                          dd = reel(d) if ENF else d
                          p_ = 1 if dd > esik[0] else (-1 if dd < esik[1] else 0)
                          satir("%s geçen yılın aynı dönemine göre %s %s (%s → %s%s)." % (
                              ad, yuzde(d), "arttı" if d >= 0 else "azaldı", para(v[2]), para(v[0]), buyume_metni(d)), p_,
                              kisa(ad.lower(), d))
                  for ad, v in (("Krediler", kre), ("Mevduat", mev)):
                      if v and v[0] and v[2]:
                          d = degisim(v[0], v[2])
                          satir("%s bir yılda %s %s." % (ad, yuzde(d), "büyüdü" if d >= 0 else "küçüldü"), 0, "")
              else:
                  sat = bul(rows, ("3C",), r"^satis gelirleri$")
                  brut = bul(rows, ("3D",), r"^brut kar")
                  fa = bul(rows, ("3DF",), r"^faaliyet kari")
                  if sat and sat[0] and sat[2]:
                      d = degisim(sat[0], sat[2]); dd = reel(d) if ENF else d
                      satir("Satışlar geçen yılın aynı dönemine göre %s %s (%s → %s%s)." % (
                          yuzde(d), "arttı" if d >= 0 else "azaldı", para(sat[2]), para(sat[0]), buyume_metni(d)),
                          1 if dd > 10 else (-1 if dd < -5 else 0), kisa("satışlar", d))
                      for ad, v in (("Brüt kâr marjı", brut), ("Faaliyet kâr marjı", fa)):
                          if v and v[0] is not None and v[2] is not None:
                              m1, m0 = v[0] / sat[0] * 100, v[2] / sat[2] * 100
                              fark = m1 - m0
                              yon = "yükseldi" if fark > 0.5 else ("geriledi" if fark < -0.5 else "yatay kaldı")
                              satir("%s: %s → %s (%s)." % (ad, yuzde(m0), yuzde(m1), yon),
                                    1 if fark > 1.5 else (-1 if fark < -1.5 else 0), "%s %s" % (ad.lower(), yon))
                  if net[2]:
                      d = degisim(net[0], net[2]); dd = reel(d) if ENF else d
                      satir("Net kâr geçen yılın aynı dönemine göre %s %s (%s → %s%s)." % (
                          yuzde(d), "arttı" if d >= 0 else "azaldı", para(net[2]), para(net[0]), buyume_metni(d)),
                          1 if dd > 15 else (-1 if dd < -10 else 0), kisa("net kâr", d))
                  fb = bul(rows, (), r"^finansal borclar$", topla=True)
                  nk = bul(rows, (), r"^nakit ve nakit benzerleri$") or bul(rows, ("4CBL",))
                  if fb and nk and ozk and ozk[0] and fb[0]:
                      nb = fb[0] - (nk[0] or 0)
                      oran = nb / ozk[0]
                      if nb <= 0:
                          satir("Şirketin nakdi finansal borcundan fazla (net nakit: %s); borç riski düşük." % para(-nb), 1, "şirket net nakit pozisyonunda")
                      else:
                          sev = "düşük" if oran < 0.5 else ("orta" if oran < 1 else "yüksek")
                          satir("Net borç %s; özkaynağa oranı %s (%s)." % (para(nb), ("%.2f" % oran).replace(".", ","), sev),
                                1 if oran < 0.5 else (-1 if oran > 1 else 0), "borçluluk %s" % sev)
              q1, q0 = ceyrek(net)
              if q1 is not None and q0:
                  d = degisim(q1, q0); dd = reel(d) if ENF else d
                  satir("Son çeyrekte (%s) net kâr %s; geçen yılın aynı çeyreğinde %s idi (%s%s)." % (
                      CEYREK.get(p, ""), para(q1), para(q0), yuzde(d, True), buyume_metni(d)), 1 if dd > 15 else (-1 if dd < -15 else 0),
                      kisa("son çeyrek kârı", d))
              if st.get("roe") is not None:
                  r = st["roe"]
                  satir("Özkaynak kârlılığı yıllık %%%s." % ("%.1f" % r).replace(".", ","), 1 if r > 20 else (-1 if r < 5 else 0),
                        "özkaynak kârlılığı güçlü" if r > 20 else "özkaynak kârlılığı zayıf")
              if not M:
                  return None, rows
              etki = "olumlu" if puan >= 2 else ("olumsuz" if puan <= -2 else "karisik")
              ozet = {"olumlu": "Genel tablo olumlu", "olumsuz": "Genel tablo zayıf", "karisik": "Karışık bir tablo"}[etki]
              iyi = [m["k"] for m in M if m["p"] > 0 and m["k"]][:2]
              kotu = [m["k"] for m in M if m["p"] < 0 and m["k"]][:2]
              if iyi:
                  ozet += ": " + " ve ".join(iyi)
              if kotu:
                  ozet += ("; buna karşın " if iyi else ": ") + " ve ".join(kotu)
              if ENF:
                  M.append({"t": "Not: Geçen yılın rakamları o dönemin TL'siyle raporlandığı için büyümeler ayrıca yıllık enflasyona (%%%s) göre de değerlendirildi." % ("%.1f" % ENF).replace(".", ","), "p": 0, "k": ""})
              return {"d": "%d/%d" % (y, p), "etki": etki, "puan": puan, "ozet": ozet + ".", "m": M}, None

          # =====================================================================
          # 2) KAP BILDIRIMLERI: liste + icerik + kural tabanli yorum
          # =====================================================================
          def kap_borsapy(kod):
              import borsapy as bp
              v = bp.Ticker(kod).news
              v = v() if callable(v) else v
              kayit = v.to_dict("records") if hasattr(v, "to_dict") else list(v or [])
              out = []
              for r in kayit:
                  try:
                      d = datetime.datetime.strptime(str(r.get("Date")).strip(), "%d.%m.%Y %H:%M:%S")
                  except Exception:
                      continue
                  t = str(r.get("Title") or "").strip(); u = str(r.get("URL") or "")
                  if t and u.startswith("https://www.kap.org.tr/"):
                      out.append({"d": d.strftime("%Y-%m-%d %H:%M"), "t": t, "u": u, "k": "KAP"})
              return out

          def kap_google(kod):
              q = urllib.parse.quote('"KAP" "%s"' % kod)
              root = ET.fromstring(iste("https://news.google.com/rss/search?q=%s&hl=tr&gl=TR&ceid=TR:tr" % q))
              out = []
              for i in root.iter("item"):
                  bas = i.findtext("title") or ""
                  m = re.match(r"KAP \*\*\* (.+?) \*\*\* ([A-Z0-9 ,]+) \*\*\* (.+?)(?: - [^-]+)?$", bas)
                  if not m or kod not in [x.strip() for x in m.group(2).split(",")]:
                      continue
                  try:
                      d = parsedate_to_datetime(i.findtext("pubDate")) + datetime.timedelta(hours=3)
                  except Exception:
                      continue
                  out.append({"d": d.strftime("%Y-%m-%d %H:%M"), "t": m.group(3).strip(), "u": i.findtext("link") or "",
                              "k": "Google Haberler", "s": m.group(1).strip()})
              return out

          def html_metin(s):
              """KAP sayfasi (Next.js) HTML'inden okunur metni cikarir: gomulu veri parcalari dahil."""
              parca = []
              for m in re.finditer(r'self\.__next_f\.push\(\[\d+,\s*"((?:[^"\\]|\\.)*)"\]\)', s):
                  try:
                      parca.append(json.loads('"' + m.group(1) + '"'))
                  except Exception:
                      pass
              govde = re.sub(r"(?s)<(script|style|head)[^>]*>.*?</\1>", " ", s)
              hepsi = govde + " " + " ".join(parca)
              hepsi = re.sub(r"<br\s*/?>|</p>|</div>|</td>|</tr>", "\n", hepsi)
              hepsi = htmlmod.unescape(re.sub(r"<[^>]+>", " ", hepsi))
              hepsi = re.sub(r'\\[nrt]|\\"', " ", hepsi)
              return re.sub(r"[ \t\r\f\v]+", " ", hepsi)

          def bildirim_govdesi(metin, baslik):
              """Bildirimin asil aciklama kismini bulur (KAP'ta 'Aciklamalar' basligindan sonrasi)."""
              n = norm(metin)
              for desen in (r"aciklamalar\b(?!dan)", r"aciklama\s*:", r"konu\s*:"):
                  m = re.search(desen, n)
                  if m:
                      return metin[m.start():m.start() + 5000]
              i = n.find(norm(baslik)[:40])
              return metin[i:i + 5000] if i >= 0 else metin[:5000]

          def kap_icerik(kod, url):
              """Bildirim metni: KAP PDF -> KAP sayfasi (borsapy ya da dogrudan). Hicbiri olmazsa bos."""
              m = re.search(r"/Bildirim/(\d+)", url)
              if not m:
                  return "", "yok"
              bid = m.group(1)
              try:
                  from pypdf import PdfReader
                  import io
                  b = iste("https://www.kap.org.tr/tr/api/BildirimPdf/%s" % bid, ham=True)
                  if b[:4] == b"%PDF":
                      txt = "\n".join((pg.extract_text() or "") for pg in PdfReader(io.BytesIO(b)).pages[:6])
                      if len(txt) > 80:
                          return txt[:30000], "pdf"
              except Exception:
                  pass
              ham = None
              try:
                  import borsapy as bp
                  ham = bp.Ticker(kod).get_news_content(int(bid))
              except Exception:
                  ham = None
              if not ham:
                  try:
                      ham = iste(url)
                  except Exception:
                      ham = None
              if ham:
                  t = html_metin(ham) if "<" in ham else ham
                  if len(t) > 40:
                      return t[:60000], "sayfa"
              return "", "yok"

          def ozel_durum_parcala(metin):
              """KAP ozel durum metninden (konu, aciklama) cikarir."""
              duz = re.sub(r"\s+", " ", metin or "").strip()
              konu = ""
              i = duz.find("Özel Durum Açıklaması")
              if i > 0:
                  konu = duz[:i].strip()
                  # sirket unvani konu satirinin sonuna yapisik gelir: buyuk harfli unvan kismini at
                  konu = re.sub(r"\s+[A-ZÇĞİÖŞÜ0-9.,&\- ]{6,}(A\.?[ŞO]\.?|T\.?A\.?Ş\.?|A\.Ş\.)\s*$", "", konu).strip()
              m = re.search(r"Açıklamalar\s+(.*?)\s*(?:Özel Durum Açıklaması \(Genel\)\s*)?Yukarıdaki açıklamalarımızın", duz)
              govde = m.group(1).strip() if m else ""
              return konu[:120], govde

          def ilk_cumle(t, n=220):
              t = re.sub(r"\s+", " ", t or "").strip()
              m = re.match(r"(.{30,}?(?<!Sn)(?<!Dr)(?<!No)(?<!vb)(?<!St)(?<!Av)[.!?])(\s+[A-ZÇĞİÖŞÜ0-9\"“]|$)", t)
              t = m.group(1) if m else t
              return t if len(t) <= n else t[:n].rsplit(" ", 1)[0] + "…"

          OLCEK = {"milyar": 1e9, "milyon": 1e6, "bin": 1e3}
          PARA = {"tl": 1, "try": 1, "turk lirasi": 1, "usd": "u", "abd dolari": "u", "dolar": "u", "abd$": "u",
                  "eur": "e", "euro": "e", "avro": "e"}

          def tutarlar(metin):
              """Metindeki para tutarlarini TL'ye cevirip dondurur (en buyukler once)."""
              n = norm(metin)
              out = []
              for m in re.finditer(r"(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?)\s*(milyar|milyon|bin)?\s*(tl|try|turk lirasi|usd|abd dolari|abd\$|dolar|eur|euro|avro)\b", n):
                  try:
                      v = float(m.group(1).replace(".", "").replace(",", "."))
                  except Exception:
                      continue
                  v *= OLCEK.get(m.group(2) or "", 1)
                  kur = PARA.get(m.group(3), 1)
                  if kur == "u":
                      if not USD:
                          continue
                      v *= USD
                  elif kur == "e":
                      if not EUR:
                          continue
                      v *= EUR
                  if v >= 1e5:
                      out.append((v, m.group(0)))
              return sorted(out, reverse=True)

          def kap_yorum(kod, x, st, metin, kaynak="yok"):
              t = norm(x["t"]); n = norm(metin)
              konu, govde_ = ("", "")
              if "ozel durum" in t and metin:
                  konu, govde_ = ozel_durum_parcala(metin)
                  if govde_:
                      metin = govde_; n = norm(metin)
              if kaynak == "sayfa" and not govde_:  # sayfa metninde menu kalabaligi olabilir: asil aciklama kismini al
                  metin = bildirim_govdesi(metin, x["t"]); n = norm(metin)
              on = ("Konu: %s. " % konu) if konu and norm(konu) != t else ""
              ozet = (" Şirketin açıklaması: \u201c%s\u201d" % ilk_cumle(govde_)) if govde_ else ""
              ltm = sayi((st.get("chk") or {}).get("ltm"))
              fiyat = sayi(st.get("price"))
              def oran_cumlesi(v):
                  if ltm and ltm > 0:
                      return " Bu tutar, son 12 aylık net kârın %s büyüklüğünde." % yuzde(v / ltm * 100)
                  return ""
              # --- rutin / sirketle dogrudan ilgisi olmayan bildirimler
              rutin = (("temerrut islemi", "Takasbank'ın, bir aracı kurumdaki işlem temerrüdüne dair rutin bildirimi. Şirketin kendisiyle ilgili değil."),
                       ("viop islem iptali", "Vadeli işlemler piyasasında işlem iptali duyurusu. Şirketin kendisiyle ilgili değil."),
                       ("spk islem yasagi", "SPK'nın, bu hissede işlem yapmış bazı kişilere getirdiği işlem yasağı. Şirketin kendisiyle değil, o kişilerle ilgili."),
                       ("borsada islem goren tipe donusum", "Bazı ortakların paylarının borsada satılabilir hale getirilmesi. Arz artabileceği için izlenebilir, genelde rutindir."),
                       ("sirket genel bilgi formu", "Şirket bilgilerinin (ortaklık yapısı, yönetim vb.) güncellenmesi. Rutin bildirim."),
                       ("devre kesici", "Hissede fiyat kısa sürede sert hareket ettiği için işlemler otomatik olarak kısa süre durduruldu (devre kesici). Kendisi bir haber değil; fiyat hareketinin sebebine bakmak gerekir."),
                       ("sorumluluk beyani", "Finansal raporlara eşlik eden rutin yönetim beyanı."),
                       ("ihrac tavani", "Borçlanma aracı ihraç limitine dair bildirim. Şirket borç senedi çıkarabilir; genelde rutin finansman işlemidir."),
                       ("borclanma araci", "Bono/tahvil ihracı ya da itfasıyla ilgili bildirim. Genelde rutin finansman işlemidir."),
                       ("kupon odemesi", "Borçlanma aracı faiz ödemesi. Rutin."),
                       ("itfa", "Borçlanma aracı geri ödemesi. Rutin."),
                       ("surdurulebilirlik", "Sürdürülebilirlik raporu. Hisse fiyatına doğrudan etkisi genelde sınırlı."),
                       ("kurumsal yonetim", "Kurumsal yönetim uyum raporu. Rutin."),
                       ("faaliyet raporu", "Faaliyet raporu yayımlandı. Rakamlar için bilanço yorumuna bak."))
              for k, a in rutin:
                  if k in t:
                      return {"e": "notr", "t": a}
              if "finansal rapor" in t:
                  by = st.get("byorum") or {}
                  a = "Yeni finansal rapor (bilanço) açıklandı."
                  if by.get("ozet"):
                      a += " " + by["ozet"]
                  return {"e": {"olumlu": "olumlu", "olumsuz": "olumsuz"}.get(by.get("etki"), "izle"), "t": a}
              if "kar payi" in t or "temettu" in t or "kar dagitim" in t:
                  m = re.search(r"brut[^0-9]{0,80}?(\d+(?:,\d+)?)\s*(?:tl|try)", n) or re.search(r"pay basina[^0-9]{0,60}?(\d+(?:,\d+)?)\s*(?:tl|try)", n)
                  tarih = re.search(r"(?:odeme|dagitim)[^0-9]{0,60}?(\d{2}[./]\d{2}[./]\d{4})", n)
                  if "dagitilmamasi" in n or "dagitmama" in n or "kar dagitimi yapilmamasi" in n:
                      return {"e": "olumsuz", "t": "Şirket bu dönem kâr payı (temettü) dağıtmama kararı/önerisi açıkladı."}
                  if m:
                      b = float(m.group(1).replace(",", "."))
                      a = "Kâr payı (temettü): hisse başına brüt %s TL" % ("%.2f" % b).replace(".", ",")
                      if fiyat:
                          a += ", güncel fiyata göre %s verim" % yuzde(b / fiyat * 100)
                      if tarih:
                          a += ". Ödeme tarihi: %s" % tarih.group(1).replace("/", ".")
                      return {"e": "olumlu", "t": a + "."}
                  return {"e": "olumlu", "t": "Kâr payı (temettü) ile ilgili bildirim. Tutar ve tarih için bildirimi aç."}
              if "bedelsiz" in t or ("sermaye artirim" in t and "bedelsiz" in n):
                  m = re.search(r"%\s*(\d+(?:,\d+)?)|(\d+(?:,\d+)?)\s*%", n)
                  a = "Bedelsiz sermaye artırımı"
                  if m:
                      a += " (yaklaşık %%%s)" % (m.group(1) or m.group(2))
                  return {"e": "olumlu", "t": a + ". Şirketin değerini değiştirmez; hisse sayısı artar, fiyat aynı oranda düzeltilir. Piyasa genelde olumlu karşılar."}
              if "bedelli" in t or ("sermaye artirim" in t and "bedelli" in n):
                  return {"e": "izle", "t": "Bedelli sermaye artırımı: ortaklardan yeni para istenecek. Kısa vadede fiyat üzerinde baskı yaratabilir; paranın nereye kullanılacağı önemli."}
              if "geri alim" in t or "geri alim" in n[:3000] and "pay" in t:
                  return {"e": "olumlu", "t": "Şirket kendi hisselerini geri alıyor/alacak. Yönetimin hisseyi ucuz bulduğuna işaret olarak genelde olumlu karşılanır."}
              if "pay alim satim" in t or "icerden ogrenen" in t:
                  al, sat = n.count("alis") + n.count("alim"), n.count("satis")
                  if al > sat:
                      return {"e": "olumlu", "t": "Yönetici ya da büyük ortak hisse ALIMI bildirdi. Genelde olumlu bir işaret sayılır."}
                  if sat > al:
                      return {"e": "izle", "t": "Yönetici ya da büyük ortak hisse SATIŞI bildirdi. Tek başına olumsuz değildir ama izlenmeli."}
                  return {"e": "notr", "t": "Yönetici/ortak pay alım-satım bildirimi."}
              if "esas sozlesme" in t:
                  return {"e": "notr", "t": "Esas sözleşme (şirket tüzüğü) değişikliği. Sermaye tavanı gibi idari konular olabilir; genelde rutindir."}
              if "genel kurul" in t:
                  return {"e": "notr", "t": "Genel kurul toplantısı/kararları. Temettü ya da sermaye kararı varsa ayrıca bildirim gelir."}
              if "derecelendirme" in t:
                  if re.search(r"yukselt|artir|pozitif", n):
                      return {"e": "olumlu", "t": "Kredi notu/görünümü yükseltildi."}
                  if re.search(r"dusur|indir|negatif", n):
                      return {"e": "olumsuz", "t": "Kredi notu/görünümü düşürüldü."}
                  return {"e": "notr", "t": "Kredi derecelendirme notu açıklandı/teyit edildi."}
              # --- Ozel durum aciklamasi: once basliga, sonra (ozel durumsa) bildirim metnine gore konu
              baslik_konu = [("ceza", "olumsuz", "Şirkete ceza/yaptırım bildirildi."),
                             ("dava", "izle", "Şirketle ilgili bir dava/hukuki süreç var."),
                             ("ihale", "olumlu", "Şirket bir ihale ile ilgili bildirim yaptı."),
                             ("siparis", "olumlu", "Yeni sipariş bildirimi."),
                             ("yeni is iliskisi", "olumlu", "Yeni iş ilişkisi (sözleşme/anlaşma) bildirimi."),
                             ("satin alma", "izle", "Satın alma/devralma ile ilgili bildirim."),
                             ("devralma", "izle", "Satın alma/devralma ile ilgili bildirim."),
                             ("birlesme", "izle", "Birleşme ile ilgili bildirim."),
                             ("bolunme", "izle", "Bölünme ile ilgili bildirim."),
                             ("trafik", "notr", "Aylık yolcu/trafik sonuçları açıklandı."),
                             ("ucak", "notr", "Filo/uçak ile ilgili bildirim (alım, kiralama ya da teslimat)."),
                             ("yatirim", "notr", "Yatırım ile ilgili bildirim."),
                             ("kredi", "notr", "Kredi/finansman ile ilgili bildirim (şirketin borçlanması; gelir ya da kâr değildir).")]
              metin_konu = [("idari para cezasi", "olumsuz", "Şirkete idari para cezası verildi."),
                            ("ceza", "olumsuz", "Şirkete ceza/yaptırım bildirildi."),
                            ("dava", "izle", "Şirketle ilgili bir dava/hukuki süreç var."),
                            ("ihale", "olumlu", "Şirket bir ihale ile ilgili bildirim yaptı."),
                            ("siparis", "olumlu", "Yeni sipariş bildirimi."),
                            ("sozlesme imzala", "olumlu", "Yeni sözleşme imzalandı."),
                            ("anlasma imzala", "olumlu", "Yeni anlaşma imzalandı."),
                            ("satin alin", "izle", "Satın alma/devralma ile ilgili bildirim."),
                            ("devral", "izle", "Satın alma/devralma ile ilgili bildirim."),
                            ("trafik sonuc", "notr", "Aylık yolcu/trafik sonuçları açıklandı."),
                            ("ucak", "notr", "Filo/uçak ile ilgili bildirim (alım, kiralama ya da teslimat).")]
              nk = norm(konu)
              if re.search(r"finansal sonuc|finansal tablo|faaliyet sonuc|ceyrek sonuc|yatirimci sunum", nk + " " + n[:1500]):
                  return {"e": "notr", "t": on + "Şirket dönem finansal sonuçlarını ve yatırımcı sunumunu yayımladı. Rakamların yorumu yukarıdaki bilanço yorumunda.", "v": 3}
              if re.search(r"yonetim kurulu|genel mudur|atama|istifa|gorevden", nk):
                  return {"e": "notr", "t": (on + "Yönetimde görev değişikliği." + ozet).strip(), "v": 3}
              secilen = next(((e, a) for k, e, a in baslik_konu if k in t or k in nk), None)
              if secilen and secilen[1].startswith("Yeni sipariş") and re.search(r"siparis (ver|veril)|satin al", n):
                  secilen = ("notr", "Şirket bir alım/yatırım siparişi verdi (bu bir gelir değil, yatırım harcamasıdır; uzun vadeli kapasiteyi etkiler).")
              if not secilen and ("ozel durum" in t or "yeni is iliskisi" in t) and n:
                  secilen = next(((e, a) for k, e, a in metin_konu if k in n[:6000]), None)
              if secilen:
                  e, a = secilen
                  tl = tutarlar(metin)
                  if tl:
                      # kredi/borclanma bir kar kalemi degildir: kar ile kiyaslanmaz
                      borc = a.startswith("Kredi") or re.search(r"kredi|borclanma|ihrac|tahvil|bono|sendikasyon", nk)
                      a += " Bildirimdeki en büyük tutar: %s." % para(tl[0][0]) + ("" if borc else oran_cumlesi(tl[0][0]))
                  return {"e": e, "t": (on + a + ozet).strip(), "v": 3}
              if "ozel durum" in t:
                  tl = tutarlar(metin)
                  ek = (" Bildirimdeki en büyük tutar: %s.%s" % (para(tl[0][0]), oran_cumlesi(tl[0][0]))) if tl else ""
                  if on or ozet:
                      return {"e": "izle", "t": re.sub(r"\s+", " ", (on or "Özel durum açıklaması. ") + ("" if ozet else "Konusu kurallarla sınıflandırılamadı.") + ozet + ek).strip(), "v": 3}
                  return {"e": "izle", "t": "Özel durum açıklaması. Konusu otomatik belirlenemedi; ayrıntı için bildirimi aç." + ek, "v": 3}
              return {"e": "notr", "t": "Bildirim türü: %s." % x["t"]}

          ONEMLI_E = {"olumlu", "olumsuz", "izle"}

          # =====================================================================
          # 3) Bilanco karsi kontrol (TradingView, Yahoo, Is Yatirim onceki ceyrek)
          # =====================================================================
          def tv_bilanco():
              kol = ["net_income_ttm", "total_equity_fq"]
              body = json.dumps({"symbols": {"tickers": ["BIST:" + k for k in kodlar]}, "columns": kol}).encode()
              j = json.loads(iste("https://scanner.tradingview.com/turkey/scan", body, {"Content-Type": "application/json"}))
              return {row["s"].split(":")[1]: dict(zip(kol, row["d"])) for row in j.get("data", [])}

          def yahoo_bilanco(kod):
              p2 = int(time.time()); p1 = p2 - 2 * 365 * 86400
              tip = "trailingNetIncomeCommonStockholders,quarterlyStockholdersEquity"
              u = ("https://query1.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/%s.IS"
                   "?type=%s&period1=%d&period2=%d") % (kod, tip, p1, p2)
              d = {}
              for r in json.loads(iste(u))["timeseries"]["result"]:
                  t = r["meta"]["type"][0]
                  d[t] = sorted((x.get("asOfDate"), sayi((x.get("reportedValue") or {}).get("raw"))) for x in (r.get(t) or []) if x)
              return d

          def ayni(a, b, tol=0.01):
              return bool(a and b) and abs(a / b - 1) <= tol

          try:
              TV = tv_bilanco()
          except Exception as e:
              TV = {}
              print("TradingView HATA", e)

          for kod in kodlar:
              st = karne.setdefault("stocks", {}).setdefault(kod, {})
              es = eski.get(kod) or {}
              lg = {}

              # ---- Bilanco yorumu
              try:
                  by, rows = bilanco_yorumu(kod, st)
                  if by:
                      onceki = es.get("byorum") or {}
                      by["ilk"] = onceki.get("ilk") if onceki.get("d") == by["d"] else BUGUN
                      st["byorum"] = by
                  elif es.get("byorum"):
                      st["byorum"] = es["byorum"]
                  if rows:
                      lg["bilanco_kalemleri"] = [[r["c"], r["a"], r["v"][0]] for r in rows][:250]
              except Exception as e:
                  lg["bilanco_yorum_hata"] = str(e)[:200]
                  if es.get("byorum"):
                      st["byorum"] = es["byorum"]

              # ---- KAP listesi
              liste = []
              for ad, fn in (("borsapy", kap_borsapy), ("google", kap_google)):
                  try:
                      liste = fn(kod)
                      lg["kap_kaynak"] = ad; lg["kap_adet"] = len(liste)
                      if liste:
                          break
                  except Exception as e:
                      lg["kap_" + ad + "_hata"] = str(e)[:200]
              if not liste:
                  liste = es.get("kap") or []
              eski_y = {x.get("u"): x for x in (es.get("kap") or []) if x.get("y")}
              gor, temiz = set(), []
              for x in sorted(liste, key=lambda x: x["d"], reverse=True):
                  a = (x["d"][:10], norm(x["t"]))
                  if a in gor:
                      continue
                  gor.add(a); temiz.append(x)
              temiz = temiz[:10]
              lg["kap_icerik"] = []
              for x in temiz:
                  o = eski_y.get(x["u"])
                  # Yorum bir kez yapilir; finansal rapor yorumu ise bilanco yorumu degistikce yenilenir
                  if o and o.get("y") and "finansal rapor" not in norm(x["t"]) and "belirlenemedi" not in o["y"].get("t", "") and not o["y"].get("t", "").startswith("Bildirim türü") \
                          and not ("ozel durum" in norm(x["t"]) and o["y"].get("v") != 3):
                      x["y"] = o["y"]
                  else:
                      metin, kaynak = ("", "yok")
                      if x.get("k") == "KAP":
                          metin, kaynak = kap_icerik(kod, x["u"])
                      x["y"] = kap_yorum(kod, x, st, metin, kaynak)
                      parca = re.sub(r"\s+", " ", metin)[:1800] if metin else ""
                      lg["kap_icerik"].append([x["d"], x["t"], kaynak, len(metin), parca if "ozel durum" in norm(x["t"]) else ""])
                  x["o"] = x["y"]["e"] in ONEMLI_E
              if temiz:
                  st["kap"] = temiz

              # ---- Bilanco karsi kontrol
              chk = st.get("chk") or {}
              ltm, eq = sayi(chk.get("ltm")), sayi(chk.get("eq"))
              if ltm and eq:
                  dog, notlar = [], {}
                  t = TV.get(kod) or {}
                  tl_, te = sayi(t.get("net_income_ttm")), sayi(t.get("total_equity_fq"))
                  notlar["tradingview"] = {"kar": tl_, "ozkaynak": te}
                  if ayni(tl_, ltm) and ayni(te, eq):
                      dog.append("TradingView")
                  try:
                      yb = yahoo_bilanco(kod)
                      yl = (yb.get("trailingNetIncomeCommonStockholders") or [(None, None)])[-1]
                      ye = (yb.get("quarterlyStockholdersEquity") or [(None, None)])[-1]
                      notlar["yahoo"] = {"kar": yl, "ozkaynak": ye}
                      if ayni(yl[1], ltm) and ayni(ye[1], eq):
                          dog.append("Yahoo")
                  except Exception as e:
                      notlar["yahoo"] = "HATA: %s" % str(e)[:150]
                  bd = {"d": chk.get("d"), "kaynak": dog}
                  if not dog and te and chk.get("grup") and chk.get("y"):
                      try:
                          y, p = chk["y"], chk["p"]
                          py, pp = (y, p - 3) if p > 3 else (y - 1, 12)
                          v = bul(mali_tablo(kod, chk["grup"], [(py, pp)] * 4), ("2O",))
                          oe = v[0] if v else None
                          notlar["onceki_ceyrek_ozkaynak"] = ["%d/%d" % (py, pp), oe]
                          if ayni(te, oe):
                              bd["tv_onceki"] = "%d/%d" % (py, pp)
                      except Exception as e:
                          notlar["onceki_ceyrek_hata"] = str(e)[:150]
                  st["bdog"] = bd
                  lg["bilanco_kontrol"] = dict(bd, bizim={"kar": ltm, "ozkaynak": eq}, karsi=notlar)
              elif es.get("bdog"):
                  st["bdog"] = es["bdog"]

              log["hisseler"][kod] = lg
              print(kod, "| bilanco:", json.dumps(st.get("byorum"), ensure_ascii=False)[:500])
              for x in st.get("kap", [])[:6]:
                  print("   ", x["d"], x["t"], "->", x["y"]["e"], "|", x["y"]["t"][:140])

          karne["kapUpdatedAt"] = simdi_tr.strftime("%Y-%m-%d %H:%M")
          json.dump(karne, open("karne.json", "w"), indent=1, sort_keys=True, ensure_ascii=False)
          try:
              kk = json.load(open("kontrol-kaydi.json"))
          except Exception:
              kk = {}
          kk["kap_ve_bilanco"] = log
          json.dump(kk, open("kontrol-kaydi.json", "w"), ensure_ascii=False, indent=1, default=str)
          print("KAP ve bilanco yorumlari yazildi.")
          PY

      - name: Kaydet
        run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          git add karne.json kontrol-kaydi.json
          git diff --cached --quiet && exit 0
          git commit -m "KAP ve bilanco yorumu"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
