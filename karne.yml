# Hisse Karnesi verisini hazirlar (karne.json). Fiyat sistemine (fiyat.yml) dokunmaz.
# Al-bekle-sat seviyelerini ve uzun vade gorunumunu de hesaplar (KAP ve bilanco yorumlari kap.yml'de); secim ayrintilari kontrol-kaydi.json dosyasina yazilir.
# Takip edilecek hisseleri asagidaki KARNE satirindan degistir (virgulle ayir, borsa kodu: AKBNK, THYAO ...)
name: Hisse karnesi

on:
  schedule:
    - cron: "41 15 * * 1-5"   # hafta ici akşamı (GitHub bir miktar geciktirebilir)
    - cron: "17 5 * * 2-6"    # ertesi sabah 08:17: kesinlesmeyen gunleri tekrar dener
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karne-veri
  cancel-in-progress: false

jobs:
  karne:
    runs-on: ubuntu-latest
    env:
      KARNE: "THYAO,FROTO,KTLEV"
      # Her hissenin vadesi: uzun = yatirim (200 gunluk ort., 1 yillik seviyeler), kisa = kisa vadeli islem (20 gunluk ort., 3 aylik seviyeler)
      VADE: "THYAO=uzun,FROTO=uzun,KTLEV=kisa"
    steps:
      - uses: actions/checkout@v4

      - name: borsapy kur
        run: pip install borsapy 2>&1 | tail -1

      - name: Karne verisini al
        run: |
          python3 - <<'PY'
          import json, os, sys, datetime, time, urllib.request, urllib.error, http.cookiejar

          kodlar = [k.strip().upper() for k in os.environ["KARNE"].split(",") if k.strip()]
          UA = {"User-Agent": "Mozilla/5.0"}
          bugun = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=3)).strftime("%Y-%m-%d")

          # Onceki basarili veri (hicbir kaynak calismazsa panel bos kalmasin diye)
          try:
              _k = json.load(open("karne.json"))
              onceki, onceki_gun = _k.get("stocks", {}), _k.get("updated")
              kap_zaman = _k.get("kapUpdatedAt")
              enf_onceki = _k.get("enf")
              # kap.yml'nin yazdigi bildirim kayitlari korunur (silinirse bildirimler sifirlanir)
              ust_alanlar = {x: _k[x] for x in ("bildirimler", "bildirim_durum") if x in _k}
          except Exception:
              ust_alanlar = {}
              onceki, onceki_gun = {}, None
              kap_zaman = None
              enf_onceki = None

          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def ac(url):
              return op.open(urllib.request.Request(url, headers=UA), timeout=30).read().decode()
          crumb = ""
          try:
              try:
                  ac("https://fc.yahoo.com")
              except urllib.error.HTTPError:
                  pass
              crumb = ac("https://query1.finance.yahoo.com/v1/test/getcrumb")
          except Exception as e:
              print("Yahoo crumb HATA:", e)

          def sayi(x):
              if isinstance(x, dict):
                  x = x.get("raw")
              try:
                  x = float(x)
              except Exception:
                  return None
              return x if x == x else None

          # ---- Kaynak: Yahoo ozet (piyasa degeri, temettu verimi)
          def yahoo_ozet(kod):
              try:
                  u = ("https://query1.finance.yahoo.com/v10/finance/quoteSummary/%s.IS"
                       "?modules=summaryDetail&crumb=%s") % (kod, crumb)
                  return json.loads(ac(u))["quoteSummary"]["result"][0]["summaryDetail"]
              except Exception as e:
                  print("Yahoo ozet HATA", kod, e)
                  return {}

          # ---- Kaynak: Yahoo grafik (fiyat + son 12 ay temettuleri, TL bazli)
          def yahoo_grafik(kod):
              try:
                  u = "https://query1.finance.yahoo.com/v8/finance/chart/%s.IS?range=1y&interval=1d&events=div" % kod
                  r = json.loads(ac(u))["chart"]["result"][0]
                  fiyat = sayi(r["meta"].get("regularMarketPrice"))
                  tem = 0.0
                  esik = time.time() - 365 * 86400
                  for v in ((r.get("events") or {}).get("dividends") or {}).values():
                      if v.get("date", 0) >= esik:
                          tem += sayi(v.get("amount")) or 0
                  return fiyat, tem
              except Exception as e:
                  print("Yahoo grafik HATA", kod, e)
                  return None, None

          # ---- Kaynak: repodaki fiyat dosyasi (fiyat.yml her aksam yazar)
          def fiyat_dosyasi(kod):
              try:
                  d = json.load(open("prices.json"))
                  gunler = d.get("days", {})
                  for g in sorted(gunler, reverse=True):
                      v = sayi((gunler[g] or {}).get(kod))
                      if v:
                          return v
              except Exception as e:
                  print("prices.json HATA", kod, e)
              return None

          # ---- Kaynak: Is Yatirim bilanco (F/K = piyasa degeri / son 12 ay net kar, PD/DD = piyasa degeri / ozkaynak)
          def maliyet(kod, grup, y, p):
              u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/MaliTablo"
                   "?companyCode=%s&exchange=TRY&financialGroup=%s&year1=%d&period1=%d&year2=%d&period2=12"
                   "&year3=%d&period3=%d&year4=%d&period4=12&_=%d") % (kod, grup, y, p, y-1, y-1, p, y-2, int(time.time()*1000))
              j = json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40))
              d = {}
              for x in (j.get("value") or []):
                  if x.get("itemCode") in ("3Z", "2O"):
                      d[x["itemCode"]] = [sayi(x.get("value%d" % i)) for i in (1, 2, 3, 4)]
              return d

          def bilanco(kod, mc):
              if not mc:
                  return None
              now = datetime.datetime.now()
              adaylar = []
              for y in (now.year, now.year - 1):
                  for p in (12, 9, 6, 3):
                      if (y, p) <= (now.year, (now.month - 2) // 3 * 3):
                          adaylar.append((y, p))
              for grup in ("XI_29", "UFRS"):
                  for (y, p) in adaylar[:4]:
                      try:
                          d = maliyet(kod, grup, y, p)
                      except Exception as e:
                          print("Bilanco HATA", kod, grup, y, p, e)
                          break
                      ni, eq = d.get("3Z"), d.get("2O")
                      if not ni or not eq or not ni[0] or not eq[0]:
                          continue
                      if p == 12:
                          ltm = ni[0]
                      elif ni[1] is not None and ni[2] is not None:
                          ltm = ni[1] + ni[0] - ni[2]
                      else:
                          continue
                      # Uzun vade icin: gecen yilin ayni donemine gore kar buyumesi ve ozkaynak karliligi
                      if p == 12:
                          kb = (ni[0] / ni[1] - 1) * 100 if ni[1] and ni[1] > 0 else None
                      else:
                          kb = (ni[0] / ni[2] - 1) * 100 if ni[2] and ni[2] > 0 else None
                      roe = ltm / eq[0] * 100 if eq[0] > 0 else None
                      return (mc / ltm if ltm > 0 else None, mc / eq[0] if eq[0] > 0 else None, "%d/%d" % (y, p), kb, roe,
                              {"ltm": ltm, "eq": eq[0], "grup": grup, "y": y, "p": p})
              return None

          # ---- Kaynak: Is Yatirim fiyat servisi (borsa kapanisi + piyasa degeri, TL)
          def is_fiyat(kod):
              try:
                  t = time.time()
                  d2 = time.strftime("%d-%m-%Y", time.gmtime(t)); d1 = time.strftime("%d-%m-%Y", time.gmtime(t - 10 * 86400))
                  u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/HisseTekil"
                       "?hisse=%s&startdate=%s&enddate=%s") % (kod, d1, d2)
                  v = (json.load(urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30)).get("value") or [])
                  for x in reversed(v):
                      p, pd = sayi(x.get("HGDG_KAPANIS")), sayi(x.get("PD"))
                      if p:
                          return p, pd
              except Exception as e:
                  print("IsYatirim fiyat HATA", kod, e)
              return None, None

          # ---- Kaynak: TradingView tarayici (fiyat, piyasa degeri, temettu verimi)
          def tv_hepsi(kodlar):
              out = {}
              try:
                  body = json.dumps({"symbols": {"tickers": ["BIST:" + k for k in kodlar]},
                                     "columns": ["close", "market_cap_basic", "dividends_yield", "price_earnings_ttm", "price_book_fq"]}).encode()
                  r = urllib.request.Request("https://scanner.tradingview.com/turkey/scan", data=body,
                          headers=dict(UA, **{"Content-Type": "application/json"}))
                  for row in json.load(urllib.request.urlopen(r, timeout=30)).get("data", []):
                      k = row["s"].split(":")[1]
                      c, m, d, fk, pdd = (list(row["d"]) + [None] * 5)[:5]
                      out[k] = {"price": sayi(c), "mc": sayi(m), "dy": sayi(d), "pe": sayi(fk), "pb": sayi(pdd)}
              except Exception as e:
                  print("TradingView HATA", e)
              return out

          def secim(degerler, tolerans):
              """Kaynak listesi (oncelik sirasiyla). 3+ kaynakta medyan, yoksa ilk deger; None'lar atlanir."""
              v = [x for x in degerler if x]
              if not v:
                  return None
              if len(v) >= 3:
                  v2 = sorted(v)
                  return v2[len(v2) // 2]
              return v[0]

          import borsapy as bp
          hisseler, hata = {}, []
          tv = tv_hepsi(kodlar)
          for kod in kodlar:
              o = onceki.get(kod) or {}
              h = {"pe": None, "pb": None, "dy": None, "price": None, "mc": None}
              bfiyat = bmc = bpe = bpb = None
              try:
                  fi = bp.Ticker(kod).fast_info
                  fi = dict(fi) if hasattr(fi, "keys") else {}
                  bfiyat, bmc = sayi(fi.get("last_price")), sayi(fi.get("market_cap"))
                  bpe, bpb = sayi(fi.get("pe_ratio")), sayi(fi.get("pb_ratio"))
              except Exception as e:
                  hata.append(kod)
                  print("borsapy HATA", kod, e)
              ifiyat, imc = is_fiyat(kod)
              yo = yahoo_ozet(kod)
              yf, ytem = yahoo_grafik(kod)
              t = tv.get(kod) or {}
              carry = []
              # fiyat: Is Yatirim, borsapy, TradingView, Yahoo (3+ kaynakta medyan) -> prices.json -> onceki
              h["price"] = secim([ifiyat, bfiyat, t.get("price"), yf], 0.03)
              if not h["price"]: h["price"] = fiyat_dosyasi(kod)
              if not h["price"] and o.get("price"):
                  h["price"] = o["price"]; carry.append("price")
              # piyasa degeri: ayni mantik -> fiyat x onceki hisse sayisi -> onceki
              ymc = sayi(yo.get("marketCap"))
              h["mc"] = secim([imc, bmc, t.get("mc"), ymc], 0.05)
              if not h["mc"] and h["price"] and o.get("price") and o.get("mc"):
                  h["mc"] = h["price"] * o["mc"] / o["price"]
              if not h["mc"] and o.get("mc"):
                  h["mc"] = o["mc"]; carry.append("mc")
              # F/K, PD/DD: bilanco -> borsapy -> onceki orani guncel fiyata gore olcekle
              b = None
              try:
                  b = bilanco(kod, h["mc"])
              except Exception as e:
                  print("Bilanco HATA", kod, e)
              if b:
                  fk, pdv, dnm, kb, roe, ham = b
                  h["chk"] = dict(ham, d=dnm)
                  h["kb"] = None if kb is None else round(kb, 1)
                  h["roe"] = None if roe is None else round(roe, 1)
                  h["pe"] = None if not fk else round(fk, 2)
                  h["pb"] = None if not pdv else round(pdv, 2)
              else:
                  # Bilanco okunamadi: borsapy ve TradingView ayni degeri veriyorsa kullan, vermiyorsa bos birak
                  def iki_kaynak(x, y, ust):
                      x = x if x and 0 < x < ust else None
                      y = y if y and 0 < y < ust else None
                      if x and y and abs(x - y) <= max(x, y) * 0.10:
                          return round((x + y) / 2, 2)
                      return None
                  h["pe"] = iki_kaynak(bpe, t.get("pe"), 200)
                  h["pb"] = iki_kaynak(bpb, t.get("pb"), 50)
                  print("Bilanco yok", kod, "F/K borsapy/TV:", bpe, t.get("pe"), "PD/DD:", bpb, t.get("pb"))
                  # Onceki deger sadece bilancodan teyitliyse (chk) guncel fiyata gore tasinir
                  if o.get("chk"):
                      h["chk"] = o["chk"]
                      oran = (h["price"] / o["price"]) if (h["price"] and o.get("price")) else 1
                      if h["pe"] is None and o.get("pe"):
                          h["pe"] = round(o["pe"] * oran, 2); carry.append("pe")
                      if h["pb"] is None and o.get("pb"):
                          h["pb"] = round(o["pb"] * oran, 2); carry.append("pb")
                      for kk in ("kb", "roe"):
                          if o.get(kk) is not None:
                              h[kk] = o[kk]
              # temettu verimi: Yahoo ozet -> TradingView -> Yahoo grafik (12 ay temettu / fiyat) -> onceki
              def mak(v):
                  return v if v is not None and 0 <= v <= 20 else None
              yd = None
              v = sayi(yo.get("dividendYield"))
              if v is None:
                  v = sayi(yo.get("trailingAnnualDividendYield"))
              if v is not None:
                  yd = round(v * 100, 2)
              dy = mak(yd)
              if dy is None: dy = mak(t.get("dy"))
              if dy is None and ytem is not None and h["price"]:
                  dy = mak(round(ytem / h["price"] * 100, 2))
              if dy is None and o.get("dy") is not None:
                  dy = o["dy"]; carry.append("dy")
              h["dy"] = None if dy is None else round(dy, 2)
              if carry:
                  h["carry"] = carry
                  h["asof"] = o.get("asof") or onceki_gun or bugun
              for alan in ("kap", "bdog", "byorum", "frapor", "tek", "uzun"):
                  if alan in o and alan not in h:
                      h[alan] = o[alan]  # bu alanlari diger adimlar/kap.yml gunceller; burada silinmesin
              hisseler[kod] = h
              print(kod, h)

          if not any(v["price"] for v in hisseler.values()):
              print("Hic veri alinamadi")
              sys.exit(1)

          now = datetime.datetime.now(datetime.timezone.utc)
          veri = {"updated": bugun, "kapUpdatedAt": kap_zaman, "enf": enf_onceki,
                  "updatedAt": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "stocks": hisseler}
          veri.update(ust_alanlar)
          json.dump(veri, open("karne.json", "w"), indent=1, sort_keys=True)
          print("Tamam. Hata:", hata)
          PY

      - name: Al-bekle-sat seviyeleri (dogrulanmis 1 yillik fiyatlarla)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, time, datetime, subprocess, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}
          kodlar = [k.strip().upper() for k in os.environ["KARNE"].split(",") if k.strip()]
          simdi = datetime.datetime.now(datetime.timezone.utc)
          bugun = (simdi + datetime.timedelta(hours=3)).date()
          bas = bugun - datetime.timedelta(days=420)
          BAS = bas.strftime("%Y-%m-%d")

          karne = json.load(open("karne.json"))
          try:
              eski = json.loads(subprocess.check_output(["git", "show", "HEAD:karne.json"])).get("stocks", {})
          except Exception:
              eski = {}

          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=40))

          def sayi(x):
              try:
                  x = float(x)
              except Exception:
                  return None
              return x if x == x and x > 0 else None

          def isyatirim(kod):
              out, d = {}, bas
              while d <= bugun:
                  e = min(d + datetime.timedelta(days=90), bugun)
                  u = ("https://www.isyatirim.com.tr/_layouts/15/IsYatirim.Website/Common/Data.aspx/HisseTekil"
                       "?hisse=%s&startdate=%s&enddate=%s") % (kod, d.strftime("%d-%m-%Y"), e.strftime("%d-%m-%Y"))
                  for x in (get(u).get("value") or []):
                      try:
                          t = datetime.datetime.strptime(x["HGDG_TARIH"], "%d-%m-%Y").strftime("%Y-%m-%d")
                      except Exception:
                          continue
                      c = sayi(x.get("HGDG_KAPANIS"))
                      if c:
                          out[t] = {"c": c, "lo": sayi(x.get("HGDG_MIN")), "hi": sayi(x.get("HGDG_MAX"))}
                  d = e + datetime.timedelta(days=1)
                  time.sleep(1)
              return out

          def yahoo(kod):
              u = "https://query1.finance.yahoo.com/v8/finance/chart/%s.IS?range=2y&interval=1d&events=div,split" % kod
              r = get(u)["chart"]["result"][0]
              off = r["meta"].get("gmtoffset", 10800)
              q = r["indicators"]["quote"][0]
              out = {}
              for i, t in enumerate(r.get("timestamp") or []):
                  c = sayi(q["close"][i])
                  if not c:
                      continue
                  d = datetime.datetime.utcfromtimestamp(t + off).strftime("%Y-%m-%d")
                  if d >= BAS:
                      out[d] = {"c": round(c, 2), "lo": sayi(q["low"][i]), "hi": sayi(q["high"][i])}
              bol = sorted(datetime.datetime.utcfromtimestamp(v.get("date", 0) + off).strftime("%Y-%m-%d")
                           for tur in ("splits", "dividends")
                       for v in ((r.get("events") or {}).get(tur) or {}).values())
              return out, bol

          def borsapy_gecmis(kod):
              import borsapy as bp
              df = bp.Ticker(kod).history(period="2y")
              out = {}
              for idx, row in df.iterrows():
                  c = sayi(row.get("Close"))
                  d = str(idx)[:10]
                  if c and d >= BAS:
                      out[d] = {"c": round(c, 2)}
              return out

          def kendi_kayit(kod):
              out = {}
              try:
                  gunler = json.load(open("prices.json")).get("days", {})
              except Exception:
                  return out
              for d, g in gunler.items():
                  c = sayi(((g or {}).get("p") or {}).get(kod))
                  if c:
                      out[d] = {"c": c}
              return out

          def esit(a, b):
              return abs(a - b) <= max(0.011, 0.002 * max(a, b))

          def dogrula(K, bolunmeler):
              """Her gun icin dogrulanmis kapanis. Dogrulanamayan gun seriye girmez."""
              ser, kayit = {}, []
              say = {"iki_kaynak": 0, "ek_kaynak": 0, "duzeltme": 0, "cozulemedi": 0}
              tarihler = sorted(set(K["isyatirim"]) | set(K["yahoo"]))

              def aralikta(src, d, v):
                  ref = K[src].get(d) if src in ("isyatirim", "yahoo") else None
                  if not ref or not ref.get("lo"):
                      ref = K["isyatirim"].get(d) or K["yahoo"].get(d) or {}
                  lo, hi = ref.get("lo"), ref.get("hi")
                  return not (lo and hi) or (lo - 0.011 <= v <= hi + 0.011)

              # Temettu/bedelsiz duzeltme farki: Is Yatirim fiyatlari duzeltilmis (gecmis fiyatlar temettu ve
              # bedelsizlere gore asagi cekilir), Yahoo ve borsapy ham fiyat verir. Olaydan onceki gunlerde
              # ikisi arasinda SABIT bir oran olusur. Bu bir hata degil; bu gunlerde duzeltilmis fiyat kullanilir,
              # ancak ham fiyatin da iki kaynakta (Yahoo + borsapy) birebir tuttugu sartiyla.
              oran = {}
              for d in tarihler:
                  a = (K["isyatirim"].get(d) or {}).get("c")
                  b = (K["yahoo"].get(d) or {}).get("c")
                  if a and b and not esit(a, b):
                      oran[d] = a / b
              sira = {d: i for i, d in enumerate(tarihler)}
              bloklar = []
              for d in sorted(oran):
                  bl = bloklar[-1] if bloklar else None
                  if bl and sira[d] == sira[bl["son"]] + 1 and abs(oran[d] - bl["r"]) <= 0.003 * bl["r"]:
                      bl["gunler"].append(d); bl["son"] = d
                  else:
                      bloklar.append({"r": oran[d], "son": d, "gunler": [d]})
              duz = {}
              for bl in bloklar:
                  if len(bl["gunler"]) < 5 or abs(bl["r"] - 1) < 0.004:
                      continue
                  olay = [o for o in bolunmeler if bl["son"] < o <= (datetime.date.fromisoformat(bl["son"]) + datetime.timedelta(days=10)).isoformat()]
                  if olay or len(bl["gunler"]) >= 10:
                      for d in bl["gunler"]:
                          duz[d] = olay[0] if olay else None

              def duzeltme(d, deg):
                  if d not in duz:
                      return False
                  b = deg.get("yahoo")
                  ham_teyit = [x for x in ("borsapy", "kendi_kayit") if deg.get(x) and esit(deg[x], b)]
                  return bool(ham_teyit)

              for d in tarihler:
                  deg = {s: K[s][d]["c"] for s in K if d in K[s]}
                  a, b = deg.get("isyatirim"), deg.get("yahoo")
                  if a and b and esit(a, b) and aralikta("isyatirim", d, a):
                      ser[d] = a; say["iki_kaynak"] += 1
                      continue
                  if a and b and duzeltme(d, deg) and aralikta("isyatirim", d, a) and aralikta("yahoo", d, b):
                      ser[d] = a; say["duzeltme"] += 1
                      kayit.append({"tarih": d, "degerler": deg, "secilen": a,
                                    "neden": "temettu/bedelsiz duzeltilmis fiyat (olay: %s), ham fiyat Yahoo+borsapy ile teyitli" % (duz[d] or "?")})
                      continue
                  en_iyi, destek = None, []
                  for s, v in deg.items():
                      if not aralikta(s, d, v):
                          continue
                      uyan = [x for x, w in deg.items() if esit(v, w)]
                      if len(uyan) > len(destek):
                          en_iyi, destek = v, uyan
                  if en_iyi is not None and len(destek) >= 2:
                      secilen = deg["isyatirim"] if "isyatirim" in destek else en_iyi
                      ser[d] = secilen; say["ek_kaynak"] += 1
                      kayit.append({"tarih": d, "degerler": deg, "secilen": secilen, "neden": "cogunluk: " + ",".join(sorted(destek))})
                  else:
                      say["cozulemedi"] += 1
                      kayit.append({"tarih": d, "degerler": deg, "secilen": None, "neden": "kesinlesmedi, hesaba katilmadi"})
              return ser, say, kayit

          def r2(x):
              return None if x is None else round(x, 2)

          VADE = {}
          for _o in os.environ.get("VADE", "").split(","):
              _k, _, _v = _o.strip().upper().partition("=")
              if _k:
                  VADE[_k] = "kisa" if _v.strip().lower().startswith("k") else "uzun"

          def rsi(c, n=14):
              if len(c) <= n:
                  return None
              ar = [c[i] - c[i - 1] for i in range(1, len(c))]
              g = sum(max(x, 0) for x in ar[:n]) / n
              l = sum(max(-x, 0) for x in ar[:n]) / n
              for x in ar[n:]:
                  g = (g * (n - 1) + max(x, 0)) / n
                  l = (l * (n - 1) + max(-x, 0)) / n
              return 100.0 if l == 0 else 100 - 100 / (1 + g / l)

          def seviyeler_kisa(ser):
              """Kisa vadeli islem: son 3 ay, 20/50 gunluk ortalama, risk cizgisi 20 gunluk ortalama."""
              ds = sorted(ser)
              c = [ser[d] for d in ds]
              if len(c) < 60:
                  return None
              son = c[-1]
              ma20 = sum(c[-20:]) / 20
              ma20_once = sum(c[-25:-5]) / 20
              ma50 = sum(c[-50:]) / 50
              w = c[-63:]
              L, H = min(w), max(w)
              R = H - L
              f382, f50, f618 = H - 0.382 * R, H - 0.5 * R, H - 0.618 * R
              e1272, e1618 = L + 1.272 * R, L + 1.618 * R
              if son < H * 0.98:
                  h1, h1n, h2, h2n = H, "son 3 ayın zirvesi", e1272, "Fibonacci 1,272 uzantısı (3 ay)"
              else:
                  h1, h1n, h2, h2n = e1272, "Fibonacci 1,272 uzantısı (3 ay)", e1618, "Fibonacci 1,618 uzantısı (3 ay)"
              risk, riskn = ma20, "20 günlük ortalama"
              if son < risk:
                  durum = "risk"
              elif son >= h1 * 0.99:
                  durum = "kar_al"
              elif f50 <= son <= f382:
                  durum = "alim"
              elif son < f50:
                  durum = "dikkat"
              else:
                  durum = "bekle"
              trend = "yukari" if son > ma20 > ma50 else ("asagi" if son < ma20 < ma50 else "yatay")
              r = rsi(c[-120:])
              return {"vade": "kisa", "seri": [[d, r2(ser[d])] for d in ds[-260:]],
                      "son": r2(son), "tarih": ds[-1], "gun": len(c), "ma20": r2(ma20), "ma20_once": r2(ma20_once), "ma50": r2(ma50),
                      "rsi": None if r is None else round(r, 1), "deg5": round((son / c[-6] - 1) * 100, 1) if len(c) > 6 else None,
                      "deg1": round((son / c[-2] - 1) * 100, 1),
                      "dip": r2(L), "zirve": r2(H), "f382": r2(f382), "f50": r2(f50), "f618": r2(f618),
                      "h1": r2(h1), "h1n": h1n, "h2": r2(h2), "h2n": h2n, "risk": r2(risk), "riskn": riskn,
                      "durum": durum, "trend": trend}

          def kisa_vade(kod, st, tek):
              """Kisa vadeli islem icin 4 olcut: RSI, 20 gunluk ort. yonu, fiyatin ortalamaya gore yeri, son 5 gun."""
              if not tek or tek.get("vade") != "kisa":
                  return None
              ol = []
              r = tek.get("rsi")
              if r is not None:
                  p = -1 if r > 70 else (1 if r < 30 else 0)
                  ol.append({"ad": "RSI (14 gün)", "p": p, "t": ("%s · " % str(r).replace(".", ",")) + ("aşırı alım bölgesi, kâr satışı gelebilir" if r > 70 else ("aşırı satım bölgesi, tepki gelebilir" if r < 30 else "nötr bölge"))})
              if tek.get("ma20") and tek.get("ma20_once"):
                  yuk = tek["ma20"] > tek["ma20_once"]
                  ol.append({"ad": "20 günlük ortalama", "p": 1 if yuk else -1, "t": "yükseliyor" if yuk else "düşüyor"})
                  ust = tek["son"] > tek["ma20"]
                  ol.append({"ad": "Fiyat / ortalama", "p": 1 if ust else -1, "t": "fiyat 20 günlük ortalamanın " + ("üstünde" if ust else "altında")})
              d5 = tek.get("deg5")
              if d5 is not None:
                  p = 1 if d5 > 5 else (-1 if d5 < -5 else 0)
                  ol.append({"ad": "Son 5 gün", "p": p, "t": ("+" if d5 >= 0 else "−") + "%" + str(abs(d5)).replace(".", ",")})
              if len(ol) < 3:
                  return None
              puan = sum(x["p"] for x in ol)
              gor = "olumlu" if puan >= 2 else ("olumsuz" if puan <= -2 else "notr")
              oneri = {"olumlu": "Kısa vadeli görünüm olumlu: trend yukarı. Fiyat risk çizgisinin (20 günlük ortalama) üstünde kaldıkça pozisyon izlenebilir.",
                       "olumsuz": "Kısa vadeli görünüm zayıf: trend aşağı. Zarar kes seviyeni gözden geçir.",
                       "notr": "Kısa vadeli görünüm kararsız: yön netleşene kadar izle."}[gor]
              if r is not None and r > 70:
                  oneri += " RSI aşırı alım bölgesinde; kısa vadede kâr satışı gelebilir."
              elif r is not None and r < 30:
                  oneri += " RSI aşırı satım bölgesinde; tepki yükselişi gelebilir ama trend teyidi beklenmeli."
              if tek.get("durum") == "kar_al":
                  oneri += " Fiyat hedef bölgesinde: kâr almak düşünülebilir."
              return {"tur": "kisa", "gor": gor, "puan": puan, "olcut": ol, "oneri": oneri}

          def seviyeler(ser):
              ds = sorted(ser)
              c = [ser[d] for d in ds]
              if len(c) < 60:
                  return None
              son = c[-1]
              ma50 = sum(c[-50:]) / 50
              ma200 = sum(c[-200:]) / 200 if len(c) >= 200 else None
              ma200_once = sum(c[-220:-20]) / 200 if len(c) >= 220 else None
              w = c[-250:]
              L, H = min(w), max(w)
              R = H - L
              f382, f50, f618, f786 = H - 0.382 * R, H - 0.5 * R, H - 0.618 * R, H - 0.786 * R
              e1272, e1618 = L + 1.272 * R, L + 1.618 * R
              # Yukseliste ekleme: son 10 gun haric 1 yilin zirvesi direnc; ust uste 2 kapanis ustunde ise kirilim teyitli
              kir = None
              if len(c) >= 40:
                  z0 = max(c[-260:-10])
                  if c[-1] > z0 and c[-2] > z0:
                      kd = "teyit"
                  elif c[-1] > z0:
                      kd = "ilk"
                  elif any(x > z0 for x in c[-10:]):
                      kd = "geri"      # kirilim oldu ama fiyat yeniden direncin altina indi
                  else:
                      kd = "bekleniyor"
                  kir = {"sev": r2(z0), "durum": kd, "gt_alt": r2(z0 * 0.97), "gt_ust": r2(z0)}
              if son < H * 0.98:
                  h1, h1n, h2, h2n = H, "son 1 yılın zirvesi", e1272, "Fibonacci 1,272 uzantısı"
              else:
                  h1, h1n, h2, h2n = e1272, "Fibonacci 1,272 uzantısı", e1618, "Fibonacci 1,618 uzantısı"
              if ma200:
                  risk, riskn = ma200, "200 günlük ortalama"
              else:
                  risk, riskn = f618, "Fibonacci %61,8 geri çekilme"
              if son < risk:
                  durum = "risk"
              elif son >= h1 * 0.99:
                  durum = "kar_al"
              elif f50 <= son <= f382:
                  durum = "alim"
              elif f786 <= son <= f618:
                  durum = "alim2"
              elif son < f50:
                  durum = "dikkat"
              else:
                  durum = "bekle"
              if ma200:
                  trend = "yukari" if son > ma50 > ma200 else ("asagi" if son < ma50 < ma200 else "yatay")
              else:
                  trend = "yukari" if son > ma50 else "asagi"
              return {"vade": "uzun", "seri": [[d, r2(ser[d])] for d in ds[-260:]],  # panel grafigi icin dogrulanmis son ~1 yil
                      "son": r2(son), "tarih": ds[-1], "gun": len(c), "ma50": r2(ma50), "ma200": r2(ma200),
                      "ma200_once": r2(ma200_once), "dip": r2(L), "zirve": r2(H), "f382": r2(f382), "f50": r2(f50), "f618": r2(f618), "f786": r2(f786), "kir": kir,
                      "bolge": ("alim" if f50 <= son <= f382 else ("alim2" if f786 <= son <= f618 else None)),
                      "h1": r2(h1), "h1n": h1n, "h2": r2(h2), "h2n": h2n, "risk": r2(risk), "riskn": riskn,
                      "durum": durum, "trend": trend}

          BANKALAR = {"AKBNK", "GARAN", "ISCTR", "YKBNK", "HALKB", "VAKBN", "TSKB", "ALBRK", "SKBNK", "QNBFB", "ICBCT"}

          def uzun_vade(kod, st, tek):
              """Uzun vadeli yatirimci icin 4 olcut: degerleme, uzun trend, kar buyumesi, ozkaynak karliligi."""
              ol = []
              pe, pb = st.get("pe"), st.get("pb")
              def sev(v, a, b):
                  return None if not v or v <= 0 else (1 if v < a else (0 if v < b else -1))
              a, b = sev(pe, 8, 15), sev(pb, 1, 2)
              if kod in BANKALAR and b is not None:
                  dv = b if a is None else (b + a) / 2
              else:
                  vv = [x for x in (a, b) if x is not None]
                  dv = sum(vv) / len(vv) if vv else None
              if dv is not None:
                  p = 1 if dv >= 0.75 else (-1 if dv <= -0.75 else 0)
                  ol.append({"ad": "Değerleme", "p": p, "t": ("ucuz" if p == 1 else "pahalı" if p == -1 else "makul") +
                             (" (F/K %s, PD/DD %s)" % (str(pe).replace(".", ","), str(pb).replace(".", ",")) if pe and pb else "")})
              if tek and tek.get("ma200") and tek.get("ma200_once"):
                  yuk = tek["ma200"] > tek["ma200_once"]
                  ust = tek["son"] > tek["ma200"]
                  p = 1 if (ust and yuk) else (-1 if (not ust and not yuk) else 0)
                  ol.append({"ad": "Uzun trend", "p": p, "t": ("fiyat 200 günlük ortalamanın üstünde" if ust else "fiyat 200 günlük ortalamanın altında") +
                             (", ortalama yükseliyor" if yuk else ", ortalama düşüyor")})
              kb = st.get("kb")
              if kb is not None:
                  enf = (karne.get("enf") or {}).get("y")
                  t = "geçen yılın aynı dönemine göre %%%s %s" % (str(abs(kb)).replace(".", ","), "artış" if kb >= 0 else "düşüş")
                  kr = kb
                  if enf:
                      kr = ((1 + kb / 100) / (1 + enf / 100) - 1) * 100
                      t += " (enflasyondan arındırınca yaklaşık %s%%%s)" % ("+" if kr >= 0 else "-", ("%.1f" % abs(kr)).replace(".", ","))
                  p = 1 if kr > 10 else (-1 if kr < -10 else 0)
                  ol.append({"ad": "Kâr büyümesi", "p": p, "t": t})
              roe = st.get("roe")
              if roe is not None:
                  p = 1 if roe > 15 else (-1 if roe < 5 else 0)
                  ol.append({"ad": "Özkaynak kârlılığı", "p": p, "t": "yıllık %%%s" % str(roe).replace(".", ",")})
              if len(ol) < 3:
                  return None
              puan = sum(x["p"] for x in ol)
              gor = "olumlu" if puan >= 2 else ("olumsuz" if puan <= -2 else "notr")
              dur = (tek or {}).get("durum")
              if gor == "olumlu":
                  oneri = {"alim": "Uzun vade görünümü olumlu ve fiyat alım bölgesinde: kademeli ekleme için uygun bölge.",
                           "bekle": "Uzun vade görünümü olumlu: tutmaya devam. Eklemek için alım bölgesini beklemek daha uygun.",
                           "kar_al": "Uzun vade görünümü olumlu ama fiyat hedefte: tutmaya devam, bir kısmında kâr almak düşünülebilir.",
                           "dikkat": "Uzun vade görünümü olumlu ama fiyat sert geri çekildi: risk çizgisi korunursa tutmaya devam.",
                           "risk": "Uzun vade göstergeleri olumlu ama fiyat risk çizgisinin altında: pozisyonu gözden geçir."}.get(dur, "Uzun vade görünümü olumlu: tutmaya devam.")
              elif gor == "olumsuz":
                  oneri = "Uzun vade göstergeleri olumsuz: yeni alım için acele etme, mevcut pozisyonu gözden geçir."
              else:
                  oneri = {"alim": "Uzun vade görünümü nötr: alım bölgesinde ama ekleme için olumlu işaretlerin artmasını beklemek daha temkinli.",
                           "risk": "Uzun vade görünümü nötr ve fiyat risk çizgisinin altında: pozisyonu gözden geçir."}.get(dur, "Uzun vade görünümü nötr: tut ve izle, yeni alım için acele etme.")
              return {"gor": gor, "puan": puan, "olcut": ol, "oneri": oneri}

          log = {"updatedAt": simdi.strftime("%Y-%m-%dT%H:%M:%SZ"), "hisseler": {}}
          for kod in kodlar:
              K, hatalar, bol = {}, [], []
              for ad, fn in (("isyatirim", isyatirim), ("yahoo", yahoo), ("borsapy", borsapy_gecmis), ("kendi_kayit", kendi_kayit)):
                  try:
                      v = fn(kod)
                      if ad == "yahoo":
                          v, bol = v
                      K[ad] = v
                  except Exception as e:
                      K[ad] = {}
                      hatalar.append("%s: %s" % (ad, e))
                      print("HATA", kod, ad, e)
              ser, say, kayit = dogrula(K, bol)
              vade = VADE.get(kod, "uzun")
              tek = seviyeler_kisa(ser) if vade == "kisa" else seviyeler(ser)
              st = karne.setdefault("stocks", {}).setdefault(kod, {})
              st["vade"] = vade
              if tek:
                  st["tek"] = tek
              elif (eski.get(kod) or {}).get("tek"):
                  st["tek"] = eski[kod]["tek"]  # yeni hesap kesinlesmediyse son dogrulanmis hesap kalir
              uz = kisa_vade(kod, st, st.get("tek")) if vade == "kisa" else uzun_vade(kod, st, st.get("tek"))
              if uz:
                  st["uzun"] = uz
              elif (eski.get(kod) or {}).get("uzun"):
                  st["uzun"] = eski[kod]["uzun"]
              log["hisseler"][kod] = {"ozet": say, "kaynak_gun_sayisi": {s: len(v) for s, v in K.items()},
                                      "bolunmeler": bol, "hatalar": hatalar, "secim_kayitlari": kayit[-40:]}
              print(kod, say, tek)

          json.dump(karne, open("karne.json", "w"), indent=1, sort_keys=True)
          try:
              kk = json.load(open("kontrol-kaydi.json"))
          except Exception:
              kk = {}
          kk.update(log)
          json.dump(kk, open("kontrol-kaydi.json", "w"), ensure_ascii=False, indent=1)
          print("Seviyeler yazildi.")
          PY

      - name: Kaydet
        run: |
          git config user.name "fiyat-bot"
          git config user.email "fiyat-bot@users.noreply.github.com"
          git add karne.json
          [ -f kontrol-kaydi.json ] && git add kontrol-kaydi.json
          git diff --cached --quiet && exit 0
          git commit -m "Karne verisi"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
