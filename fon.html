<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#12131c">
<title>Fon bulucu</title>
<style>
:root{--bg:#12131c;--card:#1b1d2a;--card2:#242739;--mut:#9a9ab0;--tx:#e6e6ee;--g:#4ade80;--y:#facc15;--r:#f87171;--p:#8b7cf6;--ln:#3a3d55}
*{box-sizing:border-box}body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font-family:Roboto,Arial,sans-serif;padding:16px}
a{color:var(--p);text-decoration:none}
h1{font-size:23px;margin:4px 0 2px;background:linear-gradient(90deg,#8b7cf6,#f0957a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:var(--mut);margin-bottom:12px;line-height:1.5}
.warn{background:#3a2a14;color:#fcd9a0;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:12px}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.flt button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:20px;background:var(--card2);color:var(--mut);border:1px solid transparent}
.flt button.on{background:rgba(139,124,246,.2);color:var(--p);border-color:var(--p);font-weight:700}
.bx{background:var(--card);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--mut);line-height:1.5}
.bx b{color:var(--tx)}
.it{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.ust{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ust b{font-size:16px}.ust small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.35}
.pn{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(139,124,246,.18);color:var(--p);white-space:nowrap}
.met{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 6px;font-size:11.5px;color:var(--mut)}
.met b{display:block;font-size:13.5px;color:var(--tx)}.met i{font-style:normal;font-size:10.5px}
.up{color:var(--g)!important}.dn{color:var(--r)!important}
.alt{font-size:12px;color:var(--mut);line-height:1.5}
.ok{color:var(--g);font-weight:700}
.daha{display:block;width:100%;font:inherit;font-weight:700;padding:10px;border-radius:12px;border:1px dashed var(--ln);background:none;color:var(--p);margin:4px 0 12px}
</style></head><body>
<div><a href="index.html">‹ Panele dön</a></div>
<h1>Fon bulucu</h1>
<div class="sub" id="sub">Bankaların hisse senedi yoğun fonları (TEFAS)</div>
<div id="msg"></div><div id="app"></div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function y1(x){return x==null?"—":(x>=0?"+":"−")+"%"+Math.abs(x).toFixed(1).replace(".",",");}
function para(v){if(!(v>0))return"—";if(v>=1e9)return(v/1e9).toFixed(1).replace(".",",")+" milyar TL";if(v>=1e6)return Math.round(v/1e6)+" milyon TL";return Math.round(v).toLocaleString("tr-TR")+" TL";}
function adet(v){if(!(v>0))return"—";if(v>=1e3)return(v/1e3).toFixed(v>=1e4?0:1).replace(".",",")+" bin";return String(Math.round(v));}
function trD(s){var p=String(s||"").slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s;}
var D=null,SIRA="y1",HEPSI=false,GRUP="Hepsi";try{GRUP=localStorage.getItem("fon-grup")||"Hepsi";}catch(e){}try{SIRA=localStorage.getItem("fon-sira")||"y1";}catch(e){}
var SL=[["y1","1 yıl"],["a6","6 ay"],["a3","3 ay"],["a1","1 ay"],["ist","İstikrar"],["buy","Büyüklük"],["ucr","Düşük ücret"]];
var DA={a1:"1 ay",a3:"3 ay",a6:"6 ay",y1:"1 yıl"};
function deger(f,k){if(k==="ist")return f.istikrar?f.istikrar[0]*1000+(f.g.y1||0):-1e9;if(k==="buy")return f.buyukluk||0;if(k==="ucr")return f.ucret!=null?-f.ucret:-1e9;var v=f.g[k];return v==null?-1e9:v;}
function ciz(){var F=D.fonlar.filter(function(f){return GRUP==="Hepsi"||f.grup===GRUP;}),B=D.bist||{},var_ucret=F.some(function(f){return f.ucret!=null;});
  F.sort(function(a,b){return deger(b,SIRA)-deger(a,SIRA);});
  var h='<div class="flt">'+SL.filter(function(s){return s[0]!=="ucr"||var_ucret;}).map(function(s){return'<button data-s="'+s[0]+'"'+(s[0]===SIRA?' class="on"':'')+'>'+s[1]+'</button>';}).join("")+'</div>';
  h+='<div class="flt" id="grp">'+["Hepsi","Kamu","Özel","Katılım"].map(function(g){var n=g==="Hepsi"?D.fonlar.length:D.fonlar.filter(function(f){return f.grup===g;}).length;return'<button data-g="'+g+'"'+(g===GRUP?' class="on"':'')+'>'+(g==="Hepsi"?"Tüm bankalar":g==="Kamu"?"Kamu bankaları":g==="Özel"?"Özel bankalar":"Katılım bankaları")+' ('+n+')</button>';}).join("")+'</div>';
  h+='<div class="bx">Karşılaştırma · <b>BIST100</b>: 1 ay '+y1(B.a1)+' · 3 ay '+y1(B.a3)+' · 6 ay '+y1(B.a6)+' · 1 yıl '+y1(B.y1)+'</div>';
  var G=HEPSI?F:F.slice(0,25);
  G.forEach(function(f,i){var met="";["a1","a3","a6","y1"].forEach(function(k){var v=f.g[k],b=B[k];met+='<div>'+DA[k]+'<b class="'+(v==null?"":(v>=0?"up":"dn"))+'">'+y1(v)+'</b><i>'+(v==null||b==null?"":(v>b?"endeksi geçti":"endeksin altında"))+'</i></div>';});
    var ist=f.istikrar&&f.istikrar[1]?(f.istikrar[0]===0?'Son '+f.istikrar[1]+' dönemin hiçbirinde BIST100’ü geçemedi':'Son '+f.istikrar[1]+' dönemin <b>'+f.istikrar[0]+'</b>’'+({1:"inde",2:"sinde",3:"ünde",4:"ünde"}[f.istikrar[0]]||"inde")+' BIST100’ü geçti'):'';
    h+='<div class="it"><div class="ust"><span><b>'+esc(f.k)+'</b> <span style="font-size:12px;color:var(--p);font-weight:700">'+esc(f.banka||"")+'</span><small>'+esc(f.ad)+'</small></span><span class="pn">#'+(i+1)+'</span></div><div class="met">'+met+'</div>'+
      '<div class="alt">Büyüklük <b style="color:var(--tx)">'+para(f.buyukluk)+'</b> · '+adet(f.yatirimci)+' yatırımcı'+(f.risk?' · Risk '+f.risk+'/7':'')+(f.ucret!=null?' · Yönetim ücreti %'+String(f.ucret).replace(".",","):'')+'<br>'+ist+
      '<br><span class="ok">✓</span> Getiriler fiyat geçmişiyle teyitli · <a href="https://www.tefas.gov.tr/FonAnaliz.aspx?FonKod='+encodeURIComponent(f.k)+'" target="_blank" rel="noopener">TEFAS’ta aç ›</a></div></div>';});
  if(!HEPSI&&F.length>25)h+='<button class="daha" id="daha">Tümünü göster ('+F.length+' fon)</button>';
  var at=D.atlanan_sayi||{},atS=Object.keys(at).map(function(k){return at[k]+" "+k;}).join(", ");
  h+='<div class="alt" style="margin-top:6px">Getiriler TEFAS verisidir ve fonun günlük fiyatlarından ayrıca hesaplanarak teyit edilir; tutmayan fon listeye alınmaz. Sadece banka portföy şirketlerinin (kamu, özel ve katılım bankaları) Borsa İstanbul hisse senedi yoğun fonları gösterilir; yabancı hisse fonları, serbest fonlar ve 10 milyon TL altı fonlar dahil değildir. Geçmiş getiri gelecek getirinin garantisi değildir; bu sayfa tarama aracıdır, al/sat önerisi değildir.'+(atS?'<br>Bu taramada dışarıda kalan: '+esc(atS)+'.':'')+'</div>';
  document.getElementById("app").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#grp button"),function(b){b.onclick=function(){GRUP=b.getAttribute("data-g");try{localStorage.setItem("fon-grup",GRUP);}catch(e){}HEPSI=false;ciz();};});
  Array.prototype.forEach.call(document.querySelectorAll(".flt:not(#grp) button"),function(b){b.onclick=function(){SIRA=b.getAttribute("data-s");try{localStorage.setItem("fon-sira",SIRA);}catch(e){}ciz();};});
  var dh=document.getElementById("daha");if(dh)dh.onclick=function(){HEPSI=true;ciz();};}
fetch("fonlar.json?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){D=d;
  document.getElementById("sub").innerHTML="Bankaların hisse senedi yoğun fonları (TEFAS) · "+d.fonlar.length+" fon · son tarama "+trD(d.updated);ciz();})
 .catch(function(){document.getElementById("msg").innerHTML='<div class="warn">Fon verisi henüz hazır değil. GitHub’daki “Fon bulucu” çalışması ilk kez bittikten sonra burada görünecek.</div>';});
</script></body></html>
