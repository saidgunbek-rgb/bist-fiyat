<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#12131c">
<title>Fon bulucu</title>
<style>
:root{--bg:#12131c;--card:#1b1d2a;--card2:#242739;--mut:#9a9ab0;--tx:#e6e6ee;--g:#4ade80;--y:#facc15;--r:#f87171;--p:#8b7cf6;--ln:#3a3d55}
*{box-sizing:border-box}body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font-family:Roboto,Arial,sans-serif;padding:16px}
a{color:var(--p);text-decoration:none}
h1{font-size:23px;margin:4px 0 2px;background:linear-gradient(90deg,#8b7cf6,#f0957a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:var(--mut);margin-bottom:12px;line-height:1.5}
.warn{background:#3a2a14;color:#fcd9a0;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:12px}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.flt button{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:20px;background:var(--card2);color:var(--mut);border:1px solid transparent}
.flt button.on{background:rgba(139,124,246,.2);color:var(--p);border-color:var(--p);font-weight:700}
.bx{background:var(--card);border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--mut);line-height:1.5}
.bx b{color:var(--tx)}
.it{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.ust{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ust b{font-size:16px}.ust small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.35}
.pn{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(139,124,246,.18);color:var(--p);white-space:nowrap}
.met{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:9px 0 6px;font-size:11.5px;color:var(--mut)}
.met b{display:block;font-size:13.5px;color:var(--tx)}.met i{font-style:normal;font-size:10.5px}
.up{color:var(--g)!important}.dn{color:var(--r)!important}
.alt{font-size:12px;color:var(--mut);line-height:1.5}
.ok{color:var(--g);font-weight:700}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 2px 8px;padding-bottom:6px;border-bottom:1px solid var(--ln)}.bh b{font-size:16px}.bh small{color:var(--mut);font-size:12px}
.fs{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:9px 11px;margin-bottom:6px;cursor:pointer}.fn{width:16px;color:var(--mut);font-size:12px}.fk{flex:1;font-size:14px}.fk small{color:var(--p);font-weight:700;font-size:11.5px}.fv{font-weight:700;font-size:14px}.fp{font-size:12px;color:var(--mut);min-width:28px;text-align:right}
.dh{font-size:13.5px;font-weight:700;margin:12px 2px 6px}.dh small{font-weight:400;color:var(--mut);font-size:11.5px}
#pop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;padding:16px;align-items:center;justify-content:center}
#pop.on{display:flex}
.pk{position:relative;width:100%;max-width:520px;max-height:85vh;overflow:auto;background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:14px 12px 12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.pk .it{margin:0}
.pk .ust{padding-right:38px}
.px{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);font-size:15px;z-index:2}
.pkap{display:block;width:100%;margin-top:10px;padding:10px;border-radius:12px;border:0;background:var(--p);color:#fff;font:inherit;font-weight:700}
.fs2{display:block}
.fst{display:flex;align-items:center;gap:8px}
.sg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px;padding-top:7px;border-top:1px solid #2c2f44}
.sc{text-align:center;border-radius:7px;padding:3px 0}
.sc i{display:block;font-style:normal;font-size:10px;color:var(--mut);margin-bottom:2px}
.sc b{display:block;font-size:11.5px;font-weight:700;letter-spacing:-.2px}
.sc.hl{background:rgba(139,124,246,.16)}
.sc.hl i{color:var(--p);font-weight:700}
.gfw{background:#1b1d29;border:1.5px solid #3c3f58;border-radius:14px;padding:10px 11px;margin-bottom:9px}.gfh{font-size:13px;font-weight:700;margin-bottom:6px;padding-right:34px}.gar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.gab{background:var(--card2);color:var(--mut);border:1px solid transparent;border-radius:8px;padding:4px 8px;font:inherit;font-size:12px}.gab.on{border-color:var(--p);color:var(--p)}
.daha{display:block;width:100%;font:inherit;font-weight:700;padding:10px;border-radius:12px;border:1px dashed var(--ln);background:none;color:var(--p);margin:4px 0 12px}

/* Cerceve: butun fonlar ayni sade gri cerceve icinde */
.fs{border:1.5px solid #3c3f58;margin-bottom:9px;padding:11px 12px;background:#1b1d29}
.fs:active{border-color:var(--p)}
.it{border:1.5px solid #3c3f58;background:#1b1d29}
.bh{margin-top:22px}
</style></head><body>
<div><a href="index.html">‹ Panele dön</a></div>
<h1>Fon bulucu</h1>
<div class="sub" id="sub">Bankaların hisse senedi yoğun fonları (TEFAS)</div>
<div id="msg"></div><div id="app"></div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function y1(x){return x==null?"—":(x>=0?"+":"−")+"%"+Math.abs(x).toFixed(1).replace(".",",");}
function para(v){if(!(v>0))return"—";if(v>=1e9)return(v/1e9).toFixed(1).replace(".",",")+" milyar TL";if(v>=1e6)return Math.round(v/1e6)+" milyon TL";return Math.round(v).toLocaleString("tr-TR")+" TL";}
function adet(v){if(!(v>0))return"—";if(v>=1e3)return(v/1e3).toFixed(v>=1e4?0:1).replace(".",",")+" bin";return String(Math.round(v));}
function trD(s){var p=String(s||"").slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s;}
var D=null,SIRA="y1",HEPSI=false,GRUP="Hepsi";try{GRUP=localStorage.getItem("fon-grup")||"Hepsi";}catch(e){}try{SIRA=localStorage.getItem("fon-sira")||"y1";}catch(e){}
var SL=[["y1","1 yıl"],["a6","6 ay"],["a3","3 ay"],["a1","1 ay"],["y3","3 yıl"],["y5","5 yıl"],["reel","Reel getiri"],["mdd","En az düşüş"],["gr","Getiri/risk"],["ist","İstikrar"],["buy","Büyüklük"],["ucr","Düşük ücret"]];
var DA={a1:"1 ay",a3:"3 ay",a6:"6 ay",y1:"1 yıl",y3:"3 yıl",y5:"5 yıl",reel:"reel 1 yıl",mdd:"en büyük düşüş",gr:"getiri/risk"};
function deger(f,k){var R=f.rk||{};if(k==="reel")return f.g.reel_y1==null?-1e9:f.g.reel_y1;if(k==="mdd")return R.mdd==null?-1e9:R.mdd;if(k==="gr")return R.gr==null?-1e9:R.gr;if(k==="ist")return f.istikrar?f.istikrar[0]*1000+(f.g.y1||0):-1e9;if(k==="buy")return f.buyukluk||0;if(k==="ucr")return f.ucret!=null?-f.ucret:-1e9;var v=f.g[k];return v==null?-1e9:v;}
var BANKA="Hepsi",GOR="banka",ACB={};try{BANKA=localStorage.getItem("fon-banka")||"Hepsi";GOR=localStorage.getItem("fon-gor")||"fav";}catch(e){}
function met2(f,B,kisa){var R=f.rk||{},s="";
  if(!kisa)[["y3","3 yıl"],["y5","5 yıl"]].forEach(function(x){var v=f.g[x[0]],b=B[x[0]];s+='<div>'+x[1]+'<b class="'+(v==null?"":(v>=0?"up":"dn"))+'">'+y1(v)+'</b><i>'+(v==null?"veri yok":(b==null?"":(v>b?"endeksi geçti":"endeksin altında")))+'</i></div>';});
  var r=f.g.reel_y1;s+='<div>Reel 1 yıl<b class="'+(r==null?"":(r>=0?"up":"dn"))+'">'+y1(r)+'</b><i>'+(r==null?"":(r>=0?"enflasyonu yendi":"enflasyonun altında"))+'</i></div>';
  var m=R.mdd;s+='<div>En büyük düşüş<b class="dn">'+(m==null?"—":"−%"+Math.abs(m).toFixed(1).replace(".",","))+'</b><i>'+(m==null||B.mdd==null?"son 1 yıl":(m>B.mdd?"endeksten az düştü":"endeksten çok düştü"))+'</i></div>';
  var ek=R.vol!=null?'<div class="alt" style="margin:-2px 0 6px">Oynaklık (yıllık) %'+R.vol.toFixed(1).replace(".",",")+(B.vol!=null?' · BIST100 %'+B.vol.toFixed(1).replace(".",","):'')+(R.gr!=null?' · Getiri/risk <b style="color:var(--tx)">'+R.gr.toFixed(2).replace(".",",")+'</b>'+(B.y1!=null&&B.vol?' (BIST100 '+(B.y1/B.vol).toFixed(2).replace(".",",")+')':''):'')+'</div>':'';
  return'<div class="met"'+(kisa?' style="grid-template-columns:1fr 1fr"':'')+'>'+s+'</div>'+ek;}
function kart(f,i,B,kisa){var met="";["a1","a3","a6","y1"].forEach(function(k){var v=f.g[k],b=B[k];met+='<div>'+DA[k]+'<b class="'+(v==null?"":(v>=0?"up":"dn"))+'">'+y1(v)+'</b><i>'+(v==null||b==null?"":(v>b?"endeksi geçti":"endeksin altında"))+'</i></div>';});
  var ist=f.istikrar&&f.istikrar[1]?(f.istikrar[0]===0?'Son '+f.istikrar[1]+' dönemin hiçbirinde BIST100’ü geçemedi':'Son '+f.istikrar[1]+' dönemin <b>'+f.istikrar[0]+'</b>’'+({1:"inde",2:"sinde",3:"ünde",4:"ünde"}[f.istikrar[0]]||"inde")+' BIST100’ü geçti'):'';
  return'<div class="it'+(f.her_yonu?' yildiz':'')+'"><div class="ust"><span><b>'+esc(f.k)+'</b> <span style="font-size:12px;color:var(--p);font-weight:700">'+esc(f.banka||"")+'</span><small>'+esc(f.ad)+'</small></span><span class="pn">'+(f.her_yonu?'⭐ ':'')+(f.puan!=null?f.puan+'/100':'#'+(i+1))+'</span></div>'+(kisa?'':'<div class="met">'+met+'</div>')+
    met2(f,B,kisa)+
    '<div class="alt">Büyüklük <b style="color:var(--tx)">'+para(f.buyukluk)+'</b> · '+adet(f.yatirimci)+' yatırımcı'+(f.risk?' · Risk '+f.risk+'/7':'')+(f.ucret!=null?' · Yönetim ücreti %'+String(f.ucret).replace(".",","):'')+'<br>'+ist+
    '<br><span class="ok">✓</span> Getiriler fiyat geçmişiyle teyitli · <a href="https://www.tefas.gov.tr/FonAnaliz.aspx?FonKod='+encodeURIComponent(f.k)+'" target="_blank" rel="noopener">TEFAS’ta aç ›</a></div></div>';}

var FAC={};
function yz(x){return x==null?"—":(x>=0?"+":"−")+"%"+Math.abs(x).toFixed(x!==0&&Math.abs(x)<1?2:1).replace(".",",");}
var SUT=[["d1","1 gün"],["a1","1 ay"],["a3","3 ay"],["a6","6 ay"],["y1","1 yıl"],["y3","3 yıl"],["y5","5 yıl"]];
function satir(f,v,b,i,hl){hl=hl||"y1";var g='';
  SUT.forEach(function(s){var x=f.g[s[0]];g+='<div class="sc'+(s[0]===hl?' hl':'')+'"><i>'+s[1]+'</i><b class="'+(x==null?"":(x>=0?"up":"dn"))+'">'+(x==null?"—":yz(x))+'</b></div>';});
  return'<div class="fs fs2" data-ac="'+esc(f.k)+'"><div class="fst"><span class="fn">'+(i+1)+'</span><span class="fk"><b>'+esc(f.k)+'</b>'+(f.her_yonu?' ⭐':'')+' <small>'+esc(f.banka||"")+'</small></span><span class="fp">'+(f.puan!=null?f.puan+' puan':"—")+'</span></div><div class="sg">'+g+'</div></div>';}


var GAR=12,SERI=null;
function seriYukle(cb){if(SERI)return cb();fetch("fon-seri.json?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){SERI=d;cb();}).catch(function(){SERI={hata:1};cb();});}
function grafikFon(f){
  var ar=[[3,"3 ay"],[6,"6 ay"],[12,"1 yıl"],[36,"3 yıl"],[60,"5 yıl"],[0,"Tümü"]].map(function(a){return'<button class="gab'+(a[0]===GAR?' on':'')+'" data-gar="'+a[0]+'" data-k="'+esc(f.k)+'">'+a[1]+'</button>';}).join("");
  var bas='<div class="gfw"><div class="gfh"><span>'+esc(f.k)+' ve BIST100</span></div><div class="gar">'+ar+'</div>';
  if(!SERI)return bas+'<div class="alt" style="padding:30px 0;text-align:center">Grafik yükleniyor…</div></div>';
  var S=SERI.fon&&SERI.fon[f.k],BS=SERI.bist||[];
  if(!S||S.length<3)return bas+'<div class="alt" style="padding:20px 0;text-align:center">Bu fonun grafik verisi henüz yok.</div></div>';
  var son=S[S.length-1][0],ls="";if(GAR){var lim=new Date(son);lim.setMonth(lim.getMonth()-GAR);ls=lim.toISOString().slice(0,10);}
  var s=S.filter(function(p){return p[0]>=ls;}),genc=GAR&&(new Date(S[0][0])-new Date(ls))>14*864e5;
  var bmap={};BS.forEach(function(p){bmap[p[0]]=p[1];});
  var f0=s[0][1],b0=null,bs=[];s.forEach(function(p){var v=bmap[p[0]];if(v!=null&&b0==null)b0=v;bs.push(v!=null&&b0?v/b0*100:null);});
  var fs=s.map(function(p){return p[1]/f0*100;}),all=fs.concat(bs.filter(function(x){return x!=null;})),lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pd=(hi-lo)*.08;lo-=pd;hi+=pd;
  var W=340,H=180,L=4,R=44,T=8,B=18,w=W-L-R,hh=H-T-B;function X(i){return L+i/(s.length-1)*w;}function Y(v){return T+(hi-v)/(hi-lo)*hh;}
  var g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  g+='<line x1="'+L+'" x2="'+(L+w)+'" y1="'+Y(100).toFixed(1)+'" y2="'+Y(100).toFixed(1)+'" stroke="#3c3f58" stroke-dasharray="3 3"/>';
  var pb=[];bs.forEach(function(v,i){if(v!=null)pb.push(X(i).toFixed(1)+","+Y(v).toFixed(1));});
  g+='<polyline fill="none" stroke="#f0957a" stroke-width="1.5" opacity=".9" points="'+pb.join(" ")+'"/>';
  g+='<polyline fill="none" stroke="#a594ff" stroke-width="2.2" points="'+fs.map(function(v,i){return X(i).toFixed(1)+","+Y(v).toFixed(1);}).join(" ")+'"/>';
  var fe=fs[fs.length-1],be=bs[bs.length-1];
  function et(v,c){var p=v-100;return'<text x="'+(L+w+4)+'" y="'+(Y(v)+4).toFixed(1)+'" font-size="10.5" fill="'+c+'">'+(p>=0?"+":"−")+Math.abs(p).toFixed(Math.abs(p)<10?1:0).replace(".",",")+'%</text>';}
  g+=et(fe,"#a594ff");if(be!=null&&Math.abs(Y(be)-Y(fe))>11)g+=et(be,"#f0957a");
  g+='<text x="'+L+'" y="'+(H-3)+'" font-size="10" fill="#9a9ab0">'+trD(s[0][0])+'</text><text x="'+(L+w)+'" y="'+(H-3)+'" font-size="10" fill="#9a9ab0" text-anchor="end">'+trD(s[s.length-1][0])+'</text></svg>';
  return bas+g+'<div class="alt" style="margin-top:4px"><span style="color:#a594ff">━ '+esc(f.k)+'</span> &nbsp; <span style="color:#f0957a">━ BIST100</span> &nbsp; · başlangıç = 100'+(genc?'<br>Fon '+esc(trD(S[0][0]))+' tarihinden beri var; grafik o tarihten başlıyor.':'')+(GAR===0?'<br>Tümü: fonun ilk fiyatından bugüne.':'')+'</div></div>';}
function pencere(k){var f=D.fonlar.filter(function(x){return x.k===k;})[0];if(!f)return;
  var o=document.getElementById("pop");if(!o){o=document.createElement("div");o.id="pop";document.body.appendChild(o);}
  o.innerHTML='<div class="pk"><button class="px" aria-label="Kapat">✕</button>'+grafikFon(f)+kart(f,0,D.bist||{},true).replace(/<span class="pn">[^]*?<\/span><\/div>/,'<span class="pn">'+(f.her_yonu?'⭐ ':'')+(f.puan!=null?f.puan+'/100':'')+'</span></div>')+'<button class="pkap">Kapat</button></div>';
  o.className="on";document.body.style.overflow="hidden";
  function kapat(){o.className="";document.body.style.overflow="";}
  o.onclick=function(e){if(e.target===o)kapat();};
  o.querySelector(".px").onclick=kapat;o.querySelector(".pkap").onclick=kapat;
  Array.prototype.forEach.call(o.querySelectorAll(".gab"),function(b){b.onclick=function(){GAR=+b.getAttribute("data-gar");var sc=o.querySelector(".pk").scrollTop;pencere(b.getAttribute("data-k"));o.querySelector(".pk").scrollTop=sc;};});
  if(!SERI)seriYukle(function(){if(o.className==="on")pencere(k);});}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var o=document.getElementById("pop");if(o){o.className="";document.body.style.overflow="";}}});
function favHtml(B){var F=D.fonlar,h='',EN=D.enf;
  h+='<div class="bx">Bu bölüm her akşamki taramadan sonra kendiliğinden yenilenir. Bir fona dokununca bilgileri küçük bir pencerede açılır. <b>Puan</b> (0–100): fonun 1 ay, 3 ay, 6 ay, 1 yıl, 3 yıl getirisi, getiri/risk ve en büyük düşüşte diğer banka fonları arasındaki sırasının ortalamasıdır.</div>';
  // 1) Her yonuyle iyi
  var HY=F.filter(function(f){return f.her_yonu;}).sort(function(a,b){return(b.puan||0)-(a.puan||0);});
  h+='<div class="bh"><span><b>⭐ Her yönüyle iyi</b> <small>'+HY.length+' fon</small></span></div>';
  h+='<div class="alt" style="margin:-2px 2px 8px">Şartlar: 1 ay, 3 ay, 6 ay ve 1 yılın hepsinde BIST100’ü geçmiş · enflasyonu yenmiş · son 1 yılda endeksten az düşmüş · getiri/risk endeksten iyi · 3 yıllık verisi varsa orada da endeksin önünde.</div>';
  if(HY.length)HY.forEach(function(f,i){h+=satir(f,f.g.y1,B.y1,i);});
  else{var Y=F.slice().sort(function(a,b){return(b.kosul||0)-(a.kosul||0)||(b.puan||0)-(a.puan||0);}).slice(0,3);
    h+='<div class="alt" style="margin:0 2px 6px">Bugün 5 şartın hepsini sağlayan fon yok. En yakın olanlar:</div>';Y.forEach(function(f,i){h+=satir(f,f.g.y1,B.y1,i).replace('<span class="fp">','<span class="fp" title="sağlanan şart">'+f.kosul+'/5 · ');});}
  // 2) Genel puanda ilk 5
  var GP=F.filter(function(f){return f.puan!=null;}).sort(function(a,b){return b.puan-a.puan;}).slice(0,5);
  h+='<div class="bh"><span><b>🏆 Genel puanda ilk 5</b></span><span class="alt">puan</span></div>';GP.forEach(function(f,i){h+=satir(f,f.g.y1,B.y1,i);});
  // 3) Donem favorileri
  var DN=[["d1","Son gün"],["a1","Son 1 ay"],["a3","Son 3 ay"],["a6","Son 6 ay"],["y1","Son 1 yıl"]];
  h+='<div class="bh"><span><b>📅 Dönemin favorileri</b></span><span class="alt">vurgulu sütun: o dönem</span></div>';
  DN.forEach(function(d){var k=d[0],b=k==="d1"?null:B[k],L=F.filter(function(f){return f.g[k]!=null&&(b==null||f.g[k]>b);}).sort(function(x,y){return y.g[k]-x.g[k];}).slice(0,3);
    var tt=k==="d1"&&F[0]&&F[0].d1_tarih?' ('+esc(trD(F[0].d1_tarih))+')':'';
    h+='<div class="dh">'+d[1]+tt+' <small>'+(k==="d1"?'fonun son açıklanan fiyatındaki değişim · fon fiyatları bir önceki günün kapanışıyla oluştuğu için BIST100’ün bugünkü hareketiyle karşılaştırılmaz':(b!=null?'BIST100 '+yz(b)+' · endeksi geçenler arasından':''))+'</small></div>';
    if(!L.length)h+='<div class="alt" style="margin:0 2px 8px">Bu dönemde endeksi geçen fon yok.</div>';
    L.forEach(function(f,i){h+=satir(f,f.g[k],b,i,k);});});
  // 4) Uzun suredir iyi
  var UZ=F.filter(function(f){return f.gecmis&&f.gecmis.kac>0;}).sort(function(a,b){return b.gecmis.kac-a.gecmis.kac||b.gecmis.seri-a.gecmis.seri||(b.puan||0)-(a.puan||0);}).slice(0,10);
  var top=UZ.length?UZ[0].gecmis.toplam:0;
  h+='<div class="bh"><span><b>📈 Uzun süredir iyi</b></span><span class="alt">son '+top+' tarama</span></div>';
  h+='<div class="alt" style="margin:-2px 2px 8px">Genel puanda ilk 10’da kaldığı gün sayısı (son 30 tarama). '+(top<10?'Geçmiş her akşam birikiyor; şu an '+top+' günlük kayıt var, liste günler geçtikçe anlamlı hale gelir.':'')+'</div>';
  UZ.forEach(function(f,i){var g=f.gecmis;h+=satir(f,f.g.y1,B.y1,i).replace('<span class="fp">','<span class="fp" style="width:auto">'+g.kac+'/'+g.toplam+' gün'+(g.seri>1?' · '+g.seri+' gün üst üste':'')+(g.her_yonu_gun?' · ⭐'+g.her_yonu_gun:'')+' · ');});
  h+='<div class="alt" style="margin-top:10px">Bu liste kurallara göre otomatik seçilir; al/sat önerisi değildir. Geçmiş getiri gelecek getirinin garantisi değildir.</div>';
  return h;}
function ciz(){var B=D.bist||{},TUM=D.fonlar;
  var F=TUM.filter(function(f){return(GRUP==="Hepsi"||f.grup===GRUP)&&(BANKA==="Hepsi"||f.banka===BANKA);}),var_ucret=F.some(function(f){return f.ucret!=null;});
  F.sort(function(a,b){return deger(b,SIRA)-deger(a,SIRA);});
  var h='<div class="flt" id="gor"><button data-v="fav"'+(GOR==="fav"?' class="on"':'')+'>⭐ Favoriler</button><button data-v="banka"'+(GOR==="banka"?' class="on"':'')+'>🏦 Bankalara göre</button><button data-v="liste"'+(GOR==="liste"?' class="on"':'')+'>📋 Tek liste</button></div>';
  if(GOR==="fav"){h+=favHtml(B);document.getElementById("app").innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll("#gor button"),function(b){b.onclick=function(){GOR=b.getAttribute("data-v");try{localStorage.setItem("fon-gor",GOR);}catch(e){}ciz();};});
    Array.prototype.forEach.call(document.querySelectorAll("[data-ac]"),function(b){b.onclick=function(){pencere(b.getAttribute("data-ac"));};});return;}
  h+='<div class="flt" id="srt">'+SL.filter(function(s){return s[0]!=="ucr"||var_ucret;}).map(function(s){return'<button data-s="'+s[0]+'"'+(s[0]===SIRA?' class="on"':'')+'>'+s[1]+'</button>';}).join("")+'</div>';
  h+='<div class="flt" id="grp">'+["Hepsi","Kamu","Özel","Katılım"].filter(function(g){return g==="Hepsi"||TUM.some(function(f){return f.grup===g;});}).map(function(g){var n=g==="Hepsi"?TUM.length:TUM.filter(function(f){return f.grup===g;}).length;return'<button data-g="'+g+'"'+(g===GRUP?' class="on"':'')+'>'+(g==="Hepsi"?"Tüm bankalar":g==="Kamu"?"Kamu":g==="Özel"?"Özel":"Katılım")+' ('+n+')</button>';}).join("")+'</div>';
  var bs={};TUM.forEach(function(f){if(GRUP==="Hepsi"||f.grup===GRUP)bs[f.banka]=(bs[f.banka]||0)+1;});
  var bl=Object.keys(bs).sort(function(a,b){return bs[b]-bs[a]||a.localeCompare(b,"tr");});
  if(BANKA!=="Hepsi"&&!bs[BANKA]){BANKA="Hepsi";return ciz();}
  h+='<select id="bnk" style="width:100%;margin:-2px 0 10px;padding:9px 10px;border-radius:12px;background:var(--card2);color:var(--tx);border:1px solid var(--ln);font:inherit;font-size:14px"><option value="Hepsi">Banka seç: hepsi ('+bl.length+' banka)</option>'+bl.map(function(b){return'<option value="'+esc(b)+'"'+(b===BANKA?' selected':'')+'>'+esc(b)+' ('+bs[b]+' fon)</option>';}).join("")+'</select>';
  var EN=D.enf;h+='<div class="bx">Karşılaştırma · <b>BIST100</b>: 1 ay '+y1(B.a1)+' · 3 ay '+y1(B.a3)+' · 6 ay '+y1(B.a6)+' · 1 yıl '+y1(B.y1)+' · 3 yıl '+y1(B.y3)+' · 5 yıl '+y1(B.y5)+
    (B.reel_y1!=null?'<br>Reel 1 yıl '+y1(B.reel_y1):'')+(B.mdd!=null?' · En büyük düşüş −%'+Math.abs(B.mdd).toFixed(1).replace(".",","):'')+(B.vol!=null?' · Oynaklık %'+B.vol.toFixed(1).replace(".",","):'')+
    (EN&&EN.y!=null?'<br>Enflasyon (yıllık TÜFE): <b>%'+String(EN.y).replace(".",",")+'</b>'+(EN.t?' · '+esc(trD(EN.t)):''):'')+
    '<details style="margin-top:6px"><summary style="color:var(--p);cursor:pointer">Bu ölçüler ne demek?</summary><div style="margin-top:6px">'+
    '<b>Reel getiri:</b> Enflasyondan arındırılmış getiri; artıysa paran gerçekten değer kazanmış demektir.<br>'+
    '<b>En büyük düşüş:</b> Son 1 yılda fonun zirvesinden en fazla ne kadar gerilediği. Küçük olması daha az sarsıntı demektir.<br>'+
    '<b>Oynaklık:</b> Fiyatın ne kadar dalgalandığı. Yüksekse iniş-çıkışlar serttir.<br>'+
    '<b>Getiri/risk:</b> 1 yıllık getirinin oynaklığa bölümü. Yüksek olan, aldığı riske göre daha çok kazandırmıştır.<br>'+
    '<b>3 ve 5 yıl:</b> Fon o kadar eskiyse ve TEFAS rakamı fiyat geçmişiyle tutuyorsa gösterilir; tutmazsa “—” görünür.</div></details></div>';
  if(GOR==="banka"&&BANKA==="Hepsi"){
    var G={};F.forEach(function(f){(G[f.banka]=G[f.banka]||[]).push(f);});
    Object.keys(G).sort(function(a,b){return deger(G[b][0],SIRA)-deger(G[a][0],SIRA);}).forEach(function(b){var L=G[b],ac=ACB[b],gr=L[0].grup;
      h+='<div class="bh"><span><b>'+esc(b)+'</b> <small>'+esc(gr)+' · '+L.length+' fon</small></span><span class="alt">En iyi: '+esc(L[0].k)+' '+(SIRA in DA?DA[SIRA]+' '+y1(L[0].g[SIRA]):'')+'</span></div>';
      (ac?L:L.slice(0,3)).forEach(function(f,i){h+=kart(f,i,B);});
      if(L.length>3)h+='<button class="daha" data-b="'+esc(b)+'">'+(ac?esc(b)+' fonlarını daralt':esc(b)+'’nın tüm '+L.length+' fonunu göster')+'</button>';});
  }else{
    (HEPSI?F:F.slice(0,25)).forEach(function(f,i){h+=kart(f,i,B);});
    if(!HEPSI&&F.length>25)h+='<button class="daha" id="daha">Tümünü göster ('+F.length+' fon)</button>';}
  var at=D.atlanan_sayi||{},atS=Object.keys(at).map(function(k){return at[k]+" "+k;}).join(", ");
  h+='<div class="alt" style="margin-top:6px">Getiriler TEFAS verisidir ve fonun günlük fiyatlarından ayrıca hesaplanarak teyit edilir; tutmayan fon listeye alınmaz. Sadece seçili bankaların (Ziraat, Garanti BBVA, İş Bankası, Akbank, Yapı Kredi, DenizBank) portföy şirketlerinin Borsa İstanbul hisse senedi yoğun fonları gösterilir; yabancı hisse fonları, serbest fonlar ve 10 milyon TL altı fonlar dahil değildir. Geçmiş getiri gelecek getirinin garantisi değildir; bu sayfa tarama aracıdır, al/sat önerisi değildir.'+(atS?'<br>Bu taramada dışarıda kalan: '+esc(atS)+'.':'')+'</div>';
  document.getElementById("app").innerHTML=h;
  function kay(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  Array.prototype.forEach.call(document.querySelectorAll("#gor button"),function(b){b.onclick=function(){GOR=b.getAttribute("data-v");kay("fon-gor",GOR);ciz();};});
  Array.prototype.forEach.call(document.querySelectorAll("#grp button"),function(b){b.onclick=function(){GRUP=b.getAttribute("data-g");kay("fon-grup",GRUP);BANKA="Hepsi";kay("fon-banka",BANKA);HEPSI=false;ciz();};});
  Array.prototype.forEach.call(document.querySelectorAll("#srt button"),function(b){b.onclick=function(){SIRA=b.getAttribute("data-s");kay("fon-sira",SIRA);ciz();};});
  document.getElementById("bnk").onchange=function(){BANKA=this.value;kay("fon-banka",BANKA);HEPSI=true;ciz();};
  Array.prototype.forEach.call(document.querySelectorAll(".daha[data-b]"),function(b){b.onclick=function(){var k=b.getAttribute("data-b");ACB[k]=!ACB[k];ciz();};});
  var dh=document.getElementById("daha");if(dh)dh.onclick=function(){HEPSI=true;ciz();};}
fetch("fonlar.json?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){D=d;
  document.getElementById("sub").innerHTML="Bankaların hisse senedi yoğun fonları (TEFAS) · "+d.fonlar.length+" fon · son tarama "+trD(d.updated);ciz();})
 .catch(function(){document.getElementById("msg").innerHTML='<div class="warn">Fon verisi henüz hazır değil. GitHub’daki “Fon bulucu” çalışması ilk kez bittikten sonra burada görünecek.</div>';});
</script></body></html>
