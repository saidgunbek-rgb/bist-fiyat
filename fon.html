<style>

.warn{background:#3a2a14;color:#fcd9a0;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:12px}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.ftb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}

.ftb button b{font-size:14px}.ftb button small{color:var(--mut);font-size:11.5px}

.fsek>.bh:first-child{margin-top:4px}

 function ek(){var d=document.createElement("div");d.id="cvd";d.style.cssText="background:#3a2f12;color:#ffd27a;border:1px solid #6b5520;border-radius:10px;padding:8px 12px;margin:8px;font:13px/1.45 system-ui,-apple-system,sans-serif";d.textContent="📴 İnternet yok · "+(y?y+" tarihinde kaydedilen":"en son kaydedilen")+" veriler gösteriliyor. İnternet gelince sayfayı yenile.";document.body.insertBefore(d,document.body.firstChild);}

<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function y1(x){return x==null?"—":(x>=0?"+":"−")+"%"+Math.abs(x).toFixed(1).replace(".",",");}
function para(v){if(!(v>0))return"—";if(v>=1e9)return(v/1e9).toFixed(1).replace(".",",")+" milyar TL";if(v>=1e6)return Math.round(v/1e6)+" milyon TL";return Math.round(v).toLocaleString("tr-TR")+" TL";}
function adet(v){if(!(v>0))return"—";if(v>=1e3)return(v/1e3).toFixed(v>=1e4?0:1).replace(".",",")+" bin";return String(Math.round(v));}
function trD(s){var p=String(s||"").slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s;}
var D=null,SIRA="y1",HEPSI=false,GRUP="Hepsi";try{GRUP=localStorage.getItem("fon-grup")||"Hepsi";}catch(e){}try{SIRA=localStorage.getItem("fon-sira")||"y1";}catch(e){}
var SL=[["y1","1 yıl"],["a6","6 ay"],["a3","3 ay"],["a1","1 ay"],["y3","3 yıl"],["y5","5 yıl"],["reel","Reel getiri"],["mdd","En az düşüş"],["gr","Getiri/risk"],["ist","İstikrar"],["buy","Büyüklük"],["ucr","Düşük ücret"]];
var DA={a1:"1 ay",a3:"3 ay",a6:"6 ay",y1:"1 yıl",y3:"3 yıl",y5:"5 yıl",reel:"reel 1 yıl",mdd:"en büyük düşüş",gr:"getiri/risk"};
function deger(f,k){var R=f.rk||{};if(k==="reel")return f.g.reel_y1==null?-1e9:f.g.reel_y1;if(k==="mdd")return R.mdd==null?-1e9:R.mdd;if(k==="gr")return R.gr==null?-1e9:R.gr;if(k==="ist")return f.istikrar?f.istikrar[0]*1000+(f.g.y1||0):-1e9;if(k==="buy")return f.buyukluk||0;if(k==="ucr")return f.ucret!=null?-f.ucret:-1e9;var v=f.g[k];return v==null?-1e9:v;}
var BANKA="Hepsi",GOR="banka",ACB={};try{BANKA=localStorage.getItem("fon-banka")||"Hepsi";GOR=localStorage.getItem("fon-gor")||"fav";}catch(e){}
function met2(f,B,kisa){var R=f.rk||{},s="";
  if(!kisa)[["y3","3 yıl"],["y5","5 yıl"]].forEach(function(x){var v=f.g[x[0]],b=B[x[0]];s+='<div>'+x[1]+'<b class="'+(v==null?"":(v>=0?"up":"dn"))+'">'+y1(v)+'</b><i>'+(v==null?"veri yok":(b==null?"":(v>b?"endeksi geçti":"endeksin altında")))+'</i></div>';});
  var r=f.g.reel_y1;s+='<div>Reel 1 yıl<b class="'+(r==null?"":(r>=0?"up":"dn"))+'">'+y1(r)+'</b><i>'+(r==null?"":(r>=0?"enflasyonu yendi":"enflasyonun altında"))+'</i></div>';
  var m=R.mdd;s+='<div>En büyük düşüş<b class="dn">'+(m==null?"—":"−%"+Math.abs(m).toFixed(1).replace(".",","))+'</b><i>'+(m==null||B.mdd==null?"son 1 yıl":(m>B.mdd?"endeksten az düştü":"endeksten çok düştü"))+'</i></div>';
  var ek=R.vol!=null?'<div class="alt" style="margin:-2px 0 6px">Oynaklık (yıllık) %'+R.vol.toFixed(1).replace(".",",")+(B.vol!=null?' · BIST100 %'+B.vol.toFixed(1).replace(".",","):'')+(R.gr!=null?' · Getiri/risk <b style="color:var(--tx)">'+R.gr.toFixed(2).replace(".",",")+'</b>'+(B.y1!=null&&B.vol?' (BIST100 '+(B.y1/B.vol).toFixed(2).replace(".",",")+')':''):'')+'</div>':'';
  return'<div class="met"'+(kisa?' style="grid-template-columns:1fr 1fr"':'')+'>'+s+'</div>'+ek;}
function kart(f,i,B,kisa){var met="";["a1","a3","a6","y1"].forEach(function(k){var v=f.g[k],b=B[k];met+='<div>'+DA[k]+'<b class="'+(v==null?"":(v>=0?"up":"dn"))+'">'+y1(v)+'</b><i>'+(v==null||b==null?"":(v>b?"endeksi geçti":"endeksin altında"))+'</i></div>';});
  var ist=f.istikrar&&f.istikrar[1]?(f.istikrar[0]===0?'Son '+f.istikrar[1]+' dönemin hiçbirinde BIST100’ü geçemedi':'Son '+f.istikrar[1]+' dönemin <b>'+f.istikrar[0]+'</b>’'+({1:"inde",2:"sinde",3:"ünde",4:"ünde"}[f.istikrar[0]]||"inde")+' BIST100’ü geçti'):'';
  return'<div class="it'+(f.her_yonu?' yildiz':'')+'"><div class="ust"><span><b>'+esc(f.k)+'</b> <span style="font-size:12px;color:var(--p);font-weight:700">'+esc(f.banka||"")+'</span><small>'+esc(f.ad)+'</small></span><span class="pn">'+(f.her_yonu?'⭐ ':'')+(f.puan!=null?f.puan+'/100':'#'+(i+1))+'</span></div>'+(kisa?'':'<div class="met">'+met+'</div>')+
    met2(f,B,kisa)+
    '<div class="alt">Büyüklük <b style="color:var(--tx)">'+para(f.buyukluk)+'</b> · '+adet(f.yatirimci)+' yatırımcı'+(f.risk?' · Risk '+f.risk+'/7':'')+(f.ucret!=null?' · Yönetim ücreti %'+String(f.ucret).replace(".",","):'')+'<br>'+ist+
    '<br><span class="ok">✓</span> Getiriler fiyat geçmişiyle teyitli · <a href="https://www.tefas.gov.tr/FonAnaliz.aspx?FonKod='+encodeURIComponent(f.k)+'" target="_blank" rel="noopener">TEFAS’ta aç ›</a></div></div>';}

var FAC={};
function yz(x){return x==null?"—":(x>=0?"+":"−")+"%"+Math.abs(x).toFixed(x!==0&&Math.abs(x)<1?2:1).replace(".",",");}
var SUT=[["d1","1 gün"],["a1","1 ay"],["a3","3 ay"],["a6","6 ay"],["y1","1 yıl"],["y3","3 yıl"],["y5","5 yıl"]];
function satir(f,v,b,i,hl){hl=hl||"y1";var g='';
  SUT.forEach(function(s){var x=f.g[s[0]];g+='<div class="sc'+(s[0]===hl?' hl':'')+'"><i>'+s[1]+'</i><b class="'+(x==null?"":(x>=0?"up":"dn"))+'">'+(x==null?"—":yz(x))+'</b></div>';});
  return'<div class="fs fs2" data-ac="'+esc(f.k)+'"><div class="fst"><span class="fn">'+(i+1)+'</span><span class="fk"><b>'+esc(f.k)+'</b>'+(f.her_yonu?' ⭐':'')+' <small>'+esc(f.banka||"")+'</small></span><span class="fp">'+(f.puan!=null?f.puan+' puan':"—")+'</span></div><div class="sg">'+g+'</div></div>';}


var GAR=12,SERI=null;
function seriYukle(cb){if(SERI)return cb();fetch("fon-seri.json?"+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){SERI=d;cb();}).catch(function(){SERI={hata:1};cb();});}
/* ---- Fon grafigi: hisse analizindeki gibi kaydirilir/yakinlastirilir; EMA 13/39, sabit Fibonacci (son 52 hafta), RSI, BIST100 kiyasi.
   Veri haftalik tek fiyat oldugu icin mum yok; cizgi grafik. Gorunum her fon icin hatirlanir. */
var GS=null,GSK="";
function gsFp(v){return v<1?v.toFixed(4):v<100?v.toFixed(3):v.toFixed(2);}
function gsTr(s){return s.replace(".",",");}
function gsKay(k){try{localStorage.setItem("fon-gor-"+k,JSON.stringify({gar:GS.gar,ema:GS.ema,fib:GS.fib,bist:GS.bist,rsi:GS.rsi,fr:GS.fr,n:GS.n,tamam:GS.tamam}));}catch(e){}}
function gsAc(k,N){var s={gar:12,ema:1,fib:1,bist:0,rsi:0,fr:null,n:null};try{var x=JSON.parse(localStorage.getItem("fon-gor-"+k)||"null");if(x&&typeof x==="object"){["gar","ema","fib","bist","rsi"].forEach(function(a){if(x[a]!=null)s[a]=+x[a];});if(x.n>=8&&x.n<=N&&x.fr!=null){s.n=+x.n;s.fr=+x.fr;}}}catch(e){}return s;}
function gsDonem(S,ay){var N=S.length;if(!ay)return[0,N];var son=S[N-1][0],Y_=+son.slice(0,4),M_=+son.slice(5,7)-ay,G_=+son.slice(8,10);while(M_<=0){M_+=12;Y_--;}
  var gm=new Date(Date.UTC(Y_,M_,0)).getUTCDate(),ls=Y_+"-"+("0"+M_).slice(-2)+"-"+("0"+Math.min(G_,gm)).slice(-2),bi=0;for(var q=0;q<N;q++){if(S[q][0]<=ls)bi=q;else break;}
  return[bi,N-bi];}
function gsEma(v,n){var a=2/(n+1),o=[],m=0;for(var i=0;i<v.length;i++){if(i<n-1)o.push(null);else if(i===n-1){m=0;for(var j=0;j<n;j++)m+=v[j];m/=n;o.push(m);}else{m=v[i]*a+m*(1-a);o.push(m);}}return o;}
function gsRsi(v,n){var o=[],ag=0,al=0;for(var i=0;i<v.length;i++){if(i<n){o.push(null);if(i>0){var d=v[i]-v[i-1];ag+=d>0?d:0;al+=d<0?-d:0;}if(i===n){ag/=n;al/=n;o[i]=al===0?100:100-100/(1+ag/al);}continue;}
  var d2=v[i]-v[i-1];ag=(ag*(n-1)+(d2>0?d2:0))/n;al=(al*(n-1)+(d2<0?-d2:0))/n;o.push(al===0?100:100-100/(1+ag/al));}return o;}
function grafikFon(f){
  var bas='<div class="gfw"><div class="gfh"><span>'+esc(f.k)+' · fiyat grafiği</span></div>';
  if(!SERI)return bas+'<div class="alt" style="padding:30px 0;text-align:center">Grafik yükleniyor…</div></div>';
  var S=SERI.fon&&SERI.fon[f.k];
  if(!S||S.length<3)return bas+'<div class="alt" style="padding:20px 0;text-align:center">Bu fonun grafik verisi henüz yok.</div></div>';
  if(GSK!==f.k||!GS){GSK=f.k;GS=gsAc(f.k,S.length);}
  var ar=[[3,"3 ay"],[6,"6 ay"],[12,"1 yıl"],[36,"3 yıl"],[60,"5 yıl"],[0,"Tümü"]].map(function(a){return'<button class="gab" data-gar="'+a[0]+'">'+a[1]+'</button>';}).join("");
  var tg=[["ema","EMA 13/39"],["fib","Fibonacci (1 yıl)"],["rsi","RSI"],["bist","BIST100 ile kıyasla"]].map(function(a){return'<button class="gab" data-tg="'+a[0]+'">'+a[1]+'</button>';}).join("");
  return bas+'<div class="gar" id="gsar">'+ar+'</div><div id="gsv" style="touch-action:pan-y;user-select:none;-webkit-user-select:none"></div><div class="gar" id="gstg" style="margin:6px 0 4px">'+tg+'</div><div class="alt" id="gslg"></div></div>';}
function gsCiz(f){var S=SERI.fon[f.k],N=S.length,v=S.map(function(p){return p[1];}),o=document.getElementById("gsv");if(!o)return;
  if(GS.n==null||GS.fr==null){var d=gsDonem(S,GS.gar);GS.fr=d[0];GS.n=Math.max(8,Math.min(N,d[1]));}
  GS.n=Math.max(Math.min(8,N),Math.min(N,GS.n));GS.fr=Math.max(0,Math.min(N-GS.n,GS.fr));
  var fr=Math.round(GS.fr),n=GS.n,bit=Math.min(N,Math.ceil(fr+n)),bist=GS.bist,
