# TEST: KAP bildirimleri ve ikinci bilanco kaynagi icin hangi kaynaklar calisiyor?
# Hicbir sisteme dokunmaz, sadece sonucu kap-test.json dosyasina yazar. Elle calistirilir (Run workflow).
name: KAP ve bilanco kaynak testi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HISSELER: "THYAO,AKBNK"
    steps:
      - uses: actions/checkout@v4

      - name: borsapy kur
        continue-on-error: true
        run: pip install borsapy 2>&1 | tail -1

      - name: Kaynaklari dene
        run: |
          python3 - <<'PY'
          import json, os, re, time, datetime, urllib.request, urllib.parse, http.cookiejar
          import xml.etree.ElementTree as ET

          KODLAR = [k.strip().upper() for k in os.environ["HISSELER"].split(",") if k.strip()]
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36",
                "Accept-Language": "tr-TR,tr;q=0.9"}
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          out = {"tarih": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")}

          def iste(url, data=None, h=None, n=None):
              hd = dict(UA); hd.update(h or {})
              r = op.open(urllib.request.Request(url, data=data, headers=hd), timeout=40)
              b = r.read()
              return r.status, b.decode("utf-8", "replace")

          def dene(ad, fn):
              try:
                  out[ad] = fn()
              except Exception as e:
                  out[ad] = "HATA: %s" % str(e)[:300]
              print("=====", ad, json.dumps(out[ad], ensure_ascii=False)[:1500])

          bugun = datetime.date.today()
          bas = bugun - datetime.timedelta(days=30)

          # ================= 1) KAP =================
          # 1a) Ana sayfa: erisim var mi, sayfada hangi API yollari geciyor?
          def kap_ana():
              st, s = iste("https://www.kap.org.tr/tr")
              yollar = sorted(set(re.findall(r'/tr/api/[A-Za-z0-9_/\-]+', s)))[:40]
              js = sorted(set(re.findall(r'(/_next/static/[^"\']+\.js)', s)))[:25]
              bulunan = set()
              for j in js:
                  try:
                      _, t = iste("https://www.kap.org.tr" + j)
                      bulunan |= set(re.findall(r'["\'`](/?(?:tr/)?api/[A-Za-z0-9_/\-{}$.]+)', t))
                  except Exception:
                      pass
              return {"durum": st, "uzunluk": len(s), "sayfadaki_api": yollar, "js_sayisi": len(js),
                      "js_icindeki_api": sorted(bulunan)[:80]}
          dene("kap_ana_sayfa", kap_ana)

          # 1b) Eski bildirim sorgu servisi (tum bildirimler, son 3 gun) -> hisse koduna gore suz
          def kap_sorgu():
              govde = {"fromDate": (bugun - datetime.timedelta(days=3)).isoformat(), "toDate": bugun.isoformat(),
                       "year": "", "prd": "", "term": "", "ruleType": "", "bdkReview": "", "disclosureClass": "",
                       "index": "", "market": "", "isLate": "", "subjectList": [], "mkkMemberOidList": [],
                       "inactiveMkkMemberOidList": [], "bdkMemberOidList": [], "mainSector": "", "sector": "",
                       "subSector": "", "memberType": "IGS", "fromSrc": "N", "srcCategory": "", "discIndex": []}
              st, s = iste("https://www.kap.org.tr/tr/api/memberDisclosureQuery", json.dumps(govde).encode(),
                           {"Content-Type": "application/json", "Accept": "application/json"})
              v = json.loads(s)
              ilgili = [x for x in v if any(k in str(x.get("stockCodes", "")) for k in KODLAR)]
              return {"durum": st, "toplam": len(v), "ornek_alanlar": sorted(v[0].keys()) if v else [],
                      "ilgili": ilgili[:10]}
          dene("kap_bildirim_sorgu", kap_sorgu)

          # 1c) Baska olasi KAP servisleri: sadece durum kodu ve ilk 300 karakter
          def kap_diger():
              sonuc = {}
              for u in ("https://www.kap.org.tr/tr/api/kapmembers/IGS/A",
                        "https://www.kap.org.tr/tr/api/disclosure/list/main",
                        "https://www.kap.org.tr/tr/api/company/generic/THYAO",
                        "https://www.kap.org.tr/tr/bist-sirketler",
                        "https://www.kap.org.tr/tr/rss/disclosures"):
                  try:
                      st, s = iste(u)
                      i = s.find("THYAO")
                      sonuc[u] = {"durum": st, "uzunluk": len(s), "bas": s[:300],
                                  "THYAO_cevresi": s[max(0, i - 200):i + 300] if i >= 0 else None}
                  except Exception as e:
                      sonuc[u] = "HATA: %s" % str(e)[:200]
              return sonuc
          dene("kap_diger_servisler", kap_diger)

          # 1d) borsapy icindeki KAP / haber ozellikleri
          def bpy_kap():
              import borsapy as bp
              sonuc = {"surum": getattr(bp, "__version__", "?"),
                       "modul_icerigi": [x for x in dir(bp) if not x.startswith("_")][:80]}
              t = bp.Ticker("THYAO")
              sonuc["ticker_ozellikleri"] = [x for x in dir(t) if not x.startswith("_")][:120]
              for ad in ("news", "kap", "disclosures", "kap_news", "announcements"):
                  if hasattr(t, ad):
                      try:
                          v = getattr(t, ad)
                          v = v() if callable(v) else v
                          if hasattr(v, "head"):
                              v = v.head(8).astype(str).to_dict("records")
                          sonuc["ticker." + ad] = json.loads(json.dumps(v, default=str))[:8] if isinstance(v, list) else str(v)[:1500]
                      except Exception as e:
                          sonuc["ticker." + ad] = "HATA: %s" % str(e)[:200]
              return sonuc
          dene("borsapy_kap", bpy_kap)

          # 1e) Google Haberler RSS (yedek: KAP haberleri basinda cikinca)
          def google_rss():
              sonuc = {}
              for k in KODLAR:
                  q = urllib.parse.quote("%s KAP" % k)
                  st, s = iste("https://news.google.com/rss/search?q=%s&hl=tr&gl=TR&ceid=TR:tr" % q)
                  root = ET.fromstring(s)
                  sonuc[k] = [{"baslik": (i.findtext("title") or "")[:150], "tarih": i.findtext("pubDate"),
                               "kaynak": i.findtext("source")} for i in root.iter("item")][:8]
              return sonuc
          dene("google_haber_rss", google_rss)

          # ================= 2) IKINCI BILANCO KAYNAGI =================
          # 2a) Yahoo fundamentals timeseries (ceyreklik net kar, ozkaynak)
          def yahoo_ts():
              sonuc = {}
              p1 = int(time.time()) - 3 * 365 * 86400; p2 = int(time.time())
              tip = ",".join(["quarterlyNetIncomeCommonStockholders", "quarterlyStockholdersEquity",
                              "trailingNetIncomeCommonStockholders", "annualNetIncomeCommonStockholders"])
              for k in KODLAR:
                  u = ("https://query1.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/%s.IS"
                       "?type=%s&period1=%d&period2=%d") % (k, tip, p1, p2)
                  _, s = iste(u)
                  d = {}
                  for r in json.loads(s)["timeseries"]["result"]:
                      t = r["meta"]["type"][0]
                      d[t] = [(x.get("asOfDate"), (x.get("reportedValue") or {}).get("raw")) for x in (r.get(t) or []) if x]
                  sonuc[k] = d
              return sonuc
          dene("yahoo_bilanco", yahoo_ts)

          # 2b) TradingView: net kar, ozkaynak, F/K, PD/DD, ozkaynak karliligi
          def tv():
              kol = ["close", "market_cap_basic", "price_earnings_ttm", "price_book_fq", "price_book_ratio",
                     "net_income", "net_income_fq", "net_income_ttm", "total_equity", "total_equity_fq",
                     "return_on_equity", "return_on_equity_fq", "earnings_per_share_basic_ttm"]
              body = json.dumps({"symbols": {"tickers": ["BIST:" + k for k in KODLAR]}, "columns": kol}).encode()
              _, s = iste("https://scanner.tradingview.com/turkey/scan", body, {"Content-Type": "application/json"})
              j = json.loads(s)
              if "data" not in j:
                  return {"cevap": s[:500]}
              return {row["s"]: dict(zip(kol, row["d"])) for row in j["data"]}
          dene("tradingview_bilanco", tv)

          # 2c) borsapy finansal tablolar
          def bpy_fin():
              import borsapy as bp
              sonuc = {}
              for k in KODLAR:
                  t = bp.Ticker(k); d = {}
                  for ad in ("quarterly_income_stmt", "income_stmt", "quarterly_balance_sheet", "balance_sheet",
                             "financials", "quarterly_financials"):
                      if hasattr(t, ad):
                          try:
                              v = getattr(t, ad)
                              v = v() if callable(v) else v
                              if hasattr(v, "index"):
                                  satirlar = [str(i) for i in list(v.index)]
                                  sec = [i for i in satirlar if re.search(r"(?i)net|kar|özkaynak|ozkaynak|equity|income", i)][:12]
                                  d[ad] = {"kolonlar": [str(c) for c in list(v.columns)][:6],
                                           "satirlar": {i: [str(x) for x in list(v.loc[i])[:4]] for i in sec if i in v.index}}
                              else:
                                  d[ad] = str(v)[:400]
                          except Exception as e:
                              d[ad] = "HATA: %s" % str(e)[:200]
                  sonuc[k] = d
              return sonuc
          dene("borsapy_bilanco", bpy_fin)

          # ================= 3) BIZIM DEGERLERLE OTOMATIK KARSILASTIRMA =================
          def karsilastir():
              k = json.load(open("karne.json")).get("stocks", {})
              tvd = out.get("tradingview_bilanco") if isinstance(out.get("tradingview_bilanco"), dict) else {}
              sonuc = {}
              for kod in KODLAR:
                  b = k.get(kod, {}); t = tvd.get("BIST:" + kod, {}) or {}
                  def fark(x, y):
                      return None if not x or not y else round((x / y - 1) * 100, 1)
                  sonuc[kod] = {"bizim_FK": b.get("pe"), "tv_FK": t.get("price_earnings_ttm"), "FK_fark_%": fark(b.get("pe"), t.get("price_earnings_ttm")),
                                "bizim_PDDD": b.get("pb"), "tv_PDDD": t.get("price_book_fq") or t.get("price_book_ratio"),
                                "PDDD_fark_%": fark(b.get("pb"), t.get("price_book_fq") or t.get("price_book_ratio")),
                                "bizim_ozkaynak_karliligi": b.get("roe"), "tv_ozkaynak_karliligi": t.get("return_on_equity")}
              return sonuc
          dene("karsilastirma", karsilastir)

          json.dump(out, open("kap-test.json", "w"), ensure_ascii=False, indent=1, default=str)
          print("Rapor yazildi: kap-test.json")
          PY

      - name: Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add kap-test.json
          git commit -m "KAP ve bilanco kaynak testi" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
